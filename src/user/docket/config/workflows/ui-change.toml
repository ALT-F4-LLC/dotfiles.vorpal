[pipeline]
name = "ui-change"
version = 31  # 31: prose-only rewrite for concision; no topology, routing, or
              #   limit change.
              # 30: `lease_ttl` added to every `[limits]` entry, matched to
              #   that entry's `max_step_duration`, so a lease lasts exactly
              #   as long as the step may run. A long wave no longer outlives
              #   the write-class lease and no longer draws an ack-reap panel;
              #   `step heartbeat` could not extend past `max_step_duration`
              #   anyway, so the ceiling is unchanged. No topology change.
              # 29: review, synthesize-findings and reconcile repoint to
              #   `findings@10` and `findings-cluster@3` — prose-only schema
              #   corrections (stale field descriptions), no
              #   validation-semantics change. No topology change.
              # 28: `verify-ac` emits `ac-report@2` (adds `unmet-out-of-scope`)
              #   and its vote predicate becomes `any(status != met)`, read after
              #   `fix-loop`'s `any(status == unmet)`: an in-scope unmet still
              #   loops, an out-of-scope or unverifiable AC goes to the one-seat
              #   `verify-ac-vote` (approve passes with the gap filed, reject
              #   routes fix-loop). No topology change; the measurement is on
              #   standard-change@37.
              #   Also `route-direct`, `route-loop` and `route-tend` join
              #   unless_labels: an issue docket-groom routed to the operator's
              #   own session, the tend queue, or a loop matches zero workflows,
              #   like `blocked`, until the label changes; `route-run` stays
              #   bindable.
              # 27: corpus-wide naming-convention pass (src/user/docket/config/README.md).
              #   Step renames only, no topology change: `synthesize` ->
              #   `synthesize-findings`, `verify` -> `verify-ac`, `verify-tribunal` ->
              #   `verify-ac-vote`. Every `after`, threshold route key, and
              #   `<step>.<kind>` input reference updated to match; `verify`'s
              #   dependency on `design-qa` is preserved under its new name `verify-ac`.
              # 26: three edits on the review stage, no topology change.
              #   (1) `verify-tribunal` seats tribunal-correctness alone: its own
              #   cast matched 9 of 9 decided outcomes on this track and 25 of 25
              #   corpus-wide, rejections included, and one voter tallies 1.0 or 0.0
              #   against the 0.67 rule where a three-seat 2-1 tally landed either
              #   side of it by confidence decimals. (2) `verify-tribunal` routes a
              #   rejection to `fix-loop`, as standard-change, security-change and
              #   docs-only already do, instead of parking the whole run; `fix` gains
              #   `verify-tribunal.vote-record` so the fixer reads the panel's
              #   reasoning, as on those tracks. The tribunal rejected 3 of 9 here
              #   and each rejection stopped the run for an operator decision a fix
              #   round could have absorbed. (3) `reconcile` drops `hold_spread`: 28
              #   held-cluster panels were decided on this track and 27 approved the
              #   computed value, which then routed fix-loop anyway, at three
              #   store-configured seats and a median 13 minutes each; a disputed
              #   blocker now goes to the fixer and a wrong one costs one fix round.
              #   The four-seat fan-out stays (sole finders across 107 reconciled
              #   rounds: architecture 3 blocker / 46 high, design 2 / 64,
              #   correctness 2 / 20, testing 0 / 128; testing's sole highs were
              #   acted on 44 of 55 times they could be) and design-qa stays (5 of 63
              #   runs routed a blocker no source-reading seat can observe).
              # 25: `doc-validate` joins the `implement` and `fix` gate lists
              #   the widened doc-validate pathspec was declared
              #   only on docs-only and spec-doc/spec-project, so this
              #   track's doc edits were never checked by it.
              # 24: `blocked` joins unless_labels: a hold label so
              #   an issue not yet workable matches zero registered workflows
              #   until the label is removed.
              # 23: three input edits, no topology change. (1) `fix` adds
              #   `synthesize.findings` beside `reconcile.findings`: the
              #   aggregate reaches the fixer as cluster titles and member ids
              #   with no evidence, while the synthesize artifact's body lists
              #   every member's judge, id, severity and evidence — one fixer
              #   on this track, handed eight title-only clusters, spent
              #   fourteen calls (run reports, step shows, a raw open of the
              #   store's database) hunting for member bodies. ordinalScoped
              #   binds it to the round that just judged the fixer's base.
              #   (2) `fix` adds `issue.latest.change-summary` beside
              #   `implement.change-summary`: the engine never rebinds a loop
              #   body's own inputs, so at fix@2 and later the packet carried
              #   implement@0's account and omitted fix@(N-1)'s, the tree the
              #   fixer actually stands on (three fix@2 packets in one run on
              #   this track all bound to implement@0). `issue.latest.<kind>`
              #   is the engine's named form for exactly this; at fix@1 both
              #   entries resolve to implement@0 and the bundle de-duplicates
              #   them. (3) `issue.diff` joins `verify-tribunal`: without it
              #   context assembly lifts no target_sha, wave.js seats the
              #   panel with "NO target ref — seats read their own HEAD", and
              #   each seat re-derives the judged tree (one reconstructed it
              #   under its temp directory via git archive, another diffed two
              #   shas it found in the ac-report's prose). With it the bundle
              #   and the packet header carry target_sha/target_worktree. The
              #   wave's own log line still needs `step show` to surface the
              #   field, which is an engine change tracked separately.
              #   NOT changed: `synthesize`'s `review.*` already binds to the
              #   current round only; previous-round raw judge payloads in a
              #   re-review synthesize packet come from the engine's
              #   previous-round pass matching every artifact of the emitted
              #   kind, which no input edit can scope — engine change, tracked
              #   separately.
              # 22: reconcile gains a second routing, `drain-highs`
              #   on `any(open_severity >= high)`, interposing a new executor
              #   step that files each still-open high cluster (not held, not
              #   operator-resolved) as a `--gap-file` backlog issue at its
              #   completion — two durable homes in one transaction, the
              #   gap-file precedent. Before this, a run completed round 0
              #   with several open HIGH clusters recorded only in reconcile
              #   artifacts nothing downstream reads: the fix-loop threshold
              #   worked as configured, but an open high had no drain path at
              #   all, while severity-ladder-general promises a Concern
              #   "lands in the run record and backlog the operator reviews
              #   before publishing". Routing highs into the fix loop instead
              #   would repeat the route security-change@23 reverted (only a
              #   Blocker opens a fix round). Blocker routing is unchanged:
              #   `fix-loop` stays first and ThresholdOrder evaluates it
              #   first, so a round with any open blocker still loops and
              #   highs drain only once blockers are cleared; a round with
              #   nothing open at high or above routes `pass` and the drain
              #   step is terminalized `skipped` — never claimed, no cost
              #   accrued. Same change: standard-change@28, spec-doc@21,
              #   spec-project@15; new contracts/drain-highs.md; policy@19
              #   seats the executor.
              # 21: `security` joins unless_labels beside
              #   `security-change` and `security-load-bearing`, which this
              #   list already excludes. security-change@26 now matches
              #   `security`, so without this an issue labelled `ui` +
              #   `security` would match two workflows and refuse activation;
              #   with it the security track wins, exactly as it already does
              #   for the two sibling labels.
              # 20: two independent reasons — (1) this table's own description
              #   text had a citation dropped in a provenance-citation-scrub
              #   pass; (2) review/reconcile/design-qa repoint findings@8 ->
              #   findings@9 and synthesize repoints findings-cluster@1 ->
              #   findings-cluster@2, the same scrub applied to those two
              #   schemas' field descriptions. The engine refuses an in-place
              #   edit to a frozen registration either way.
description = "UI change bound to an accepted ux-spec cited in the issue body. Design-judged and design-QA'd before AC verification, so AC verification can read the design-QA findings and resolve met/unmet instead of unverifiable. The conductor integrates commits; the operator publishes."

[match]
labels_any = ["ui"]
unless_labels = [
  "blocked",
  "docs-only",
  "investigation",
  "release",
  "retro",
  "route-direct",
  "route-loop",
  "route-tend",
  "security",
  "security-change",
  "security-load-bearing",
  "spec-doc",
  "spec-project",
]

[limits]
"design-qa" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"drain-highs" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-architecture" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-correctness" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-design" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-testing" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"synthesize-findings" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"verify-ac" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"write" = { max = 16, lease_ttl = "2h", max_step_duration = "2h" }

[[step]]
after = []
class = "write"
emits = "change-summary"
executor = "implement"
expected_cost = 1.50
gates = ["build", "tests", "self-hygiene", "secret-scan", "doc-validate"]
inputs = ["issue.body"]
max_attempts = 2
name = "implement"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["implement"]
emits = "findings"
expected_cost = 0.60
fanout = ["judge-correctness", "judge-architecture", "judge-testing", "judge-design"]
holds_tree = false
inputs = ["implement.change-summary", "issue.diff"]
name = "review"
packet = ["contracts/{executor}.md"]
payload = "findings@10"

[[step]]
after = ["review"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.60
holds_tree = false
inputs = ["review.*"]
name = "synthesize-findings"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@3"

[[step]]
action = "aggregate"
after = ["synthesize-findings"]
inputs = ["synthesize-findings.findings"]
max_fix_loops = 2
name = "reconcile"
params = { field = "severity", method = "max", output = "findings" }
payload = "findings@10"
threshold = { "fix-loop" = "any(open_severity >= blocker)", "drain-highs" = "any(open_severity >= high)" }

[[step]]
after = ["reconcile"]
emits = "drain-report"
executor = "drain-highs"
expected_cost = 0.30
holds_tree = false
inputs = ["reconcile.findings", "issue.body"]
name = "drain-highs"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after_loop = "review"
class = "write"
emits = "change-summary"
executor = "fix"
expected_cost = 1.00
gates = ["build", "tests", "self-hygiene", "secret-scan", "doc-validate"]
inputs = ["reconcile.findings", "synthesize-findings.findings", "implement.change-summary", "issue.latest.change-summary", "issue.latest.ac-report", "design-qa.findings", "verify-ac-vote.vote-record"]
loop = true
name = "fix"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["reconcile"]
emits = "findings"
executor = "design-qa"
expected_cost = 0.90
gates = [{ name = "render-verify", pre = true }, { name = "copy-verify", pre = true }]
holds_tree = false
inputs = ["issue.body", "issue.diff", "implement.change-summary", "design-qa.gate-results"]
name = "design-qa"
packet = ["contracts/{executor}.md"]
payload = "findings@10"
threshold = { "fix-loop" = "any(severity >= blocker)" }

[[step]]
after = ["design-qa"]
emits = "ac-report"
executor = "verify-ac"
expected_cost = 0.50
gates = [{ name = "ac-commands", pre = true }]
holds_tree = false
inputs = ["issue.body", "issue.diff", "implement.change-summary", "verify-ac.gate-results", "design-qa.findings"]
name = "verify-ac"
packet = ["contracts/{executor}.md"]
payload = "ac-report@2"
threshold = { "fix-loop" = "any(status == unmet)", "verify-ac-vote" = "any(status != met)" }

[[step]]
after = ["verify-ac"]
inputs = ["verify-ac.ac-report", "issue.body", "issue.diff"]
name = "verify-ac-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-correctness"]
