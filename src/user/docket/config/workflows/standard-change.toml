[pipeline]
description = "Implement, review, reconcile, and verify one ordinary change; the conductor integrates commits, the operator publishes."
name = "standard-change"
version = 47

[match]
unless_labels = [
  "blocked",
  "disposition",
  "docs-only",
  "investigation",
  "release",
  "retro",
  "route-direct",
  "route-loop",
  "route-tend",
  "security",
  "security-change",
  "security-load-bearing",
  "small",
  "spec-doc",
  "spec-project",
  "trivial",
  "ui",
]

[limits]
"drain-highs" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-architecture" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-correctness" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-testing" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"synthesize-findings" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"verify-ac" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"write" = { max = 16, lease_ttl = "2h", max_step_duration = "2h" }

[[step]]
after = []
class = "write"
emits = "change-summary"
executor = "implement"
expected_cost = 1.50
gates = ["build", "tests", "self-hygiene", "secret-scan", "vuln-scan", "doc-validate"]
inputs = ["issue.body"]
max_attempts = 2
name = "implement"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
name = "review"
holds_tree = false
after = ["implement"]
fanout = ["judge-correctness", "judge-architecture", "judge-testing"]
emits = "findings"
packet = ["contracts/{executor}.md"]
payload = "findings@12"
expected_cost = 0.60
inputs = ["implement.change-summary", "issue.diff"]

[[step]]
after = ["review"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.60
holds_tree = false
inputs = ["review.*"]
name = "synthesize-findings"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@5"

[[step]]
action = "aggregate"
after = ["synthesize-findings"]
inputs = ["synthesize-findings.findings"]
max_fix_loops = 2
name = "reconcile"
params = { field = "severity", method = "max", output = "findings" }
payload = "findings@13"
threshold = { "fix-loop" = "any(open_severity >= blocker)", "drain-highs" = "any(open_severity >= high)" }

[[step]]
after = ["reconcile"]
emits = "drain-report"
executor = "drain-highs"
expected_cost = 0.30
holds_tree = false
inputs = ["reconcile.findings", "issue.body"]
name = "drain-highs"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after_loop = "review"
class = "write"
emits = "change-summary"
executor = "fix"
expected_cost = 1.00
gates = ["build", "tests", "self-hygiene", "secret-scan", "vuln-scan", "doc-validate"]
inputs = ["reconcile.findings", "synthesize-findings.findings", "implement.change-summary", "issue.latest.change-summary", "issue.latest.ac-report", "verify-ac-vote.vote-record"]
loop = true
name = "fix"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["reconcile"]
emits = "ac-report"
executor = "verify-ac"
expected_cost = 0.50
gates = [{ name = "ac-commands", pre = true }]
holds_tree = false
inputs = ["issue.body", "issue.diff", "implement.change-summary", "implement.gate-results", "verify-ac.gate-results"]
name = "verify-ac"
packet = ["contracts/{executor}.md"]
payload = "ac-report@2"
threshold = { "fix-loop" = "any(status == unmet)", "verify-ac-vote" = "any(status != met)" }

[[step]]
after = ["verify-ac"]
inputs = ["verify-ac.ac-report", "issue.body", "issue.diff"]
name = "verify-ac-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-correctness"]
