[pipeline]
description = "Documentation change: implement with doc-validate and citation gates, one correctness judge, tribunal-filtered review and AC verification, and a bounded fix-loop re-entering at review; the conductor integrates commits, the operator publishes. Design-heavy doc work routes through spec-doc first."
name = "docs-only"
version = 17  # 17: review step repoints findings@8 -> findings@9 — a citation-
              #   scrub pass rewrote findings@8's field descriptions to drop
              #   literal DKT/RUN/DOT-style provenance ids, which the engine
              #   refuses as an in-place edit to a frozen registration

[match]
labels_any = ["docs-only"]
unless_labels = ["investigation", "spec-doc", "spec-project", "release", "retro"]

[limits]
"judge-correctness" = { max = 16, max_step_duration = "1h" }
"verify-ac" = { max = 16, max_step_duration = "1h" }
"write" = { max = 16, max_step_duration = "2h" }

[[step]]
after = []
class = "write"
emits = "change-summary"
executor = "implement"
expected_cost = 0.80
gates = ["self-hygiene", "doc-validate", "citation-check"]
inputs = ["issue.body"]
max_attempts = 2
name = "implement"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["implement"]
emits = "findings"
executor = "judge-correctness"
expected_cost = 0.60
holds_tree = false
inputs = ["implement.change-summary", "issue.diff"]
name = "review"
packet = ["contracts/{executor}.md"]
payload = "findings@9"
threshold = { "review-tribunal" = "any(severity >= high)" }

[[step]]
after = ["review"]
inputs = ["review.findings", "issue.diff"]
name = "review-tribunal"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-correctness"]

[[step]]
after_loop = "review"
class = "write"
emits = "change-summary"
executor = "fix"
expected_cost = 0.60
gates = ["self-hygiene", "doc-validate", "citation-check"]
inputs = ["review.findings", "implement.change-summary", "issue.latest.ac-report", "review-tribunal.vote-record", "verify-tribunal.vote-record"]
loop = true
name = "fix"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["review"]
emits = "ac-report"
executor = "verify-ac"
expected_cost = 0.40
gates = [{ name = "ac-commands", pre = true }]
holds_tree = false
inputs = ["issue.body", "issue.diff", "implement.change-summary", "verify.gate-results"]
max_fix_loops = 2
name = "verify"
packet = ["contracts/{executor}.md"]
payload = "ac-report@1"
threshold = { "fix-loop" = "any(status == unmet)", "verify-tribunal" = "any(status == unverifiable)" }

[[step]]
after = ["verify"]
inputs = ["verify.ac-report", "issue.body"]
name = "verify-tribunal"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-correctness"]
