[policy]
version = 44

[variants]
fable-high = { model = "fable", effort = "high" }
fable-low = { model = "fable", effort = "low", escalate_to = "fable-medium" }
fable-max = { model = "fable", effort = "max" }
fable-medium = { model = "fable", effort = "medium" }
fable-xhigh = { model = "fable", effort = "xhigh" }
haiku-high = { model = "haiku", effort = "high", escalate_to = "sonnet-high" }
opus-high = { model = "opus", effort = "high", escalate_to = "fable-high" }
opus-low = { model = "opus", effort = "low", escalate_to = "opus-medium" }
opus-max = { model = "opus", effort = "max", escalate_to = "fable-max" }
opus-medium = { model = "opus", effort = "medium", escalate_to = "fable-medium" }
opus-xhigh = { model = "opus", effort = "xhigh", escalate_to = "fable-xhigh" }
sonnet-high = { model = "sonnet", effort = "high", escalate_to = "opus-high" }
sonnet-low = { model = "sonnet", effort = "low", escalate_to = "sonnet-medium" }
sonnet-medium = { model = "sonnet", effort = "medium", escalate_to = "opus-medium" }

[executors]
adr-author = { variant = "fable-high" }
design-qa = { variant = "opus-medium" }
dispose = { variant = "opus-medium" }
drain-highs = { variant = "haiku-high" }
fix = { variant = "opus-medium" }
implement = { variant = "opus-medium" }
investigate = { variant = "fable-high" }
judge-architecture = { variant = "fable-low" }
judge-correctness = { variant = "opus-medium" }
judge-design = { variant = "opus-medium" }
judge-security = { variant = "opus-medium", never = ["fable"], reason = "security-classifier-reroute" }
judge-simplicity = { variant = "opus-medium" }
judge-testing = { variant = "sonnet-high" }
prd-author = { variant = "fable-high" }
report = { variant = "fable-medium" }
research = { variant = "opus-high" }
revise-investigation = { variant = "fable-high" }
spec-author-architecture = { variant = "opus-medium" }
spec-author-code-quality = { variant = "opus-medium" }
spec-author-operations = { variant = "opus-medium" }
spec-author-performance = { variant = "opus-medium" }
spec-author-review-strategy = { variant = "opus-medium" }
spec-author-security = { variant = "opus-medium", never = ["fable"], reason = "security-classifier-reroute" }
spec-author-testing = { variant = "opus-medium" }
synthesize-findings = { variant = "sonnet-high" }
tdd-author = { variant = "fable-high" }
tdd-author-security = { variant = "opus-medium", never = ["fable"], reason = "security-classifier-reroute" }
threat-model = { variant = "opus-medium", never = ["fable"], reason = "security-classifier-reroute" }
tribunal-architecture = { variant = "fable-medium" }
tribunal-correctness = { variant = "opus-medium" }
tribunal-design = { variant = "sonnet-high" }
tribunal-security = { variant = "opus-medium", never = ["fable"], reason = "security-classifier-reroute" }
ux-spec-author = { variant = "fable-high" }
verify-ac = { variant = "opus-medium" }

[security]
ceiling = "opus-max"
labels = ["security-change", "security-load-bearing", "security"]
never = ["fable"]
nodes = ["judge-security", "threat-model", "tdd-author-security", "spec-author-security", "tribunal-security"]
reason = "As observed at policy version 42: Claude Opus 5.5 launched with the same class of biology, cybersecurity, and distillation safeguards as Claude Fable 5.1, all of which fall back to another model transparently (cyber -> Opus 4.8, biology -> Opus 5), so a flagged request hops to a fallback on an Opus seat exactly as on a Fable seat. Naming Opus does not avoid the hop; it only avoids paying Fable's rate ($10 / $50 per million input / output tokens against Opus 5.5's $4 / $20) for the same fallback run, which is why `never` keeps Fable off these nodes. The hop is narrow: the policy on both models allows vulnerability discovery in source code and blocks compiled-binary vulnerability discovery, penetration testing, and exploit development, so a secure code review of a diff is inside the permitted set and the residual is dual-use edge cases. Do not seat Sonnet on these nodes: Sonnet 5.5's cyber fallback is Sonnet 5 (Terminal-Bench 4.0 10.3% against Sonnet 5.5's 70.6%), a far steeper cliff than Opus 4.8; Haiku 5.5 blocks with no fallback at all. Residual: nothing in the step record catches the hop, so the serving model surfaces only in the transcript-read usage back-fill, whose ledger rows carry units and quantities only."

[escalation]
on_failure = "one-hop"
on_round = "one-hop"
round_executors = ["fix", "dispose"]
fable_gates = [
  "failed-top-opus-round",
  "investigator-class",
  "novel-architecture",
]

[escalation.fallback]
fable-high = "opus-xhigh"
fable-low = "opus-medium"
fable-max = "opus-max"
fable-medium = "opus-high"
fable-xhigh = "opus-max"
