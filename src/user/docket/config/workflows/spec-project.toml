[pipeline]
description = "Author the seven reserved project spec files in parallel, review them once, and accept by tribunal vote that escalates to the operator."
name = "spec-project"
version = 9

[match]
labels_any = ["spec-project"]
unless_labels = ["release", "retro"]

[limits]
"judge-architecture" = { max = 16, max_step_duration = "1h" }
"judge-correctness" = { max = 16, max_step_duration = "1h" }
"judge-simplicity" = { max = 16, max_step_duration = "1h" }
"synthesize-findings" = { max = 16, max_step_duration = "1h" }
"write" = { max = 16, max_step_duration = "2h" }

[[step]]
after = []
class = "write"
emits = "spec"
expected_cost = 1.00
fanout = [
  "spec-author-architecture",
  "spec-author-security",
  "spec-author-operations",
  "spec-author-performance",
  "spec-author-code-quality",
  "spec-author-review-strategy",
  "spec-author-testing",
]
gates = ["doc-validate", "reserved-name-check"]
inputs = ["issue.body"]
max_attempts = 2
name = "spec-author"
on_fail = "waiting-human"
packet = ["contracts/spec-author.md"]

[[step]]
after = ["spec-author"]
emits = "findings"
expected_cost = 0.60
fanout = ["judge-architecture", "judge-correctness", "judge-simplicity"]
holds_tree = false
inputs = ["spec-author.*", "issue.body"]
name = "review"
packet = ["contracts/{executor}.md"]
payload = "findings@7"

[[step]]
after = ["review"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.60
holds_tree = false
inputs = ["review.*"]
name = "synthesize"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@1"

[[step]]
action = "aggregate"
after = ["synthesize"]
inputs = ["synthesize.findings"]
max_fix_loops = 2
name = "reconcile"
params = { field = "severity", method = "max", hold_spread = 2, output = "findings" }
payload = "findings@7"
threshold = { "fix-loop" = "any(severity >= blocker)" }

[[step]]
after_loop = "review"
class = "write"
emits = "spec"
expected_cost = 0.70
fanout = [
  "spec-author-architecture",
  "spec-author-security",
  "spec-author-operations",
  "spec-author-performance",
  "spec-author-code-quality",
  "spec-author-review-strategy",
  "spec-author-testing",
]
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "spec-author.*"]
loop = true
name = "revise"
packet = ["contracts/spec-author.md"]

[[step]]
after = ["reconcile"]
inputs = ["spec-author.*", "reconcile.findings"]
name = "accept"
on_fail = "waiting-human"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-correctness"]
