[pipeline]
description = "Read-only root-cause investigation ending at a tribunal read that revises the report on rejection and escalates to the operator."
name = "investigation"
version = 8

[match]
labels_any  = ["investigation"]
unless_labels = ["spec-doc", "spec-project", "release", "retro"]

[limits]
"investigate" = { max = 16, max_step_duration = "1h" }

[[step]]
after = []
emits = "investigation"
executor = "investigate"
expected_cost = 0.70
holds_tree = false
inputs = ["issue.body"]
max_attempts = 2
name = "investigate"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["investigate"]
emits = "investigation"
executor = "investigate"
expected_cost = 0.40
holds_tree = false
inputs = ["investigate.investigation", "issue.body"]
name = "report"
packet = ["contracts/report.md"]

[[step]]
after = ["report"]
inputs = ["report.investigation"]
max_fix_loops = 2
name = "read-gate"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-correctness"]

[[step]]
after_loop = "read-gate"
emits = "investigation"
executor = "investigate"
expected_cost = 0.40
holds_tree = false
inputs = ["report.investigation", "issue.body"]
loop = true
name = "revise"
packet = ["contracts/revise.md"]
