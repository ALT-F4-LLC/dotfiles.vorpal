[pipeline]
name = "ui-change"
version = 25  # 25: `doc-validate` joins the `implement` and `fix` gate lists
              #   the widened doc-validate pathspec was declared
              #   only on docs-only and spec-doc/spec-project, so this
              #   track's doc edits were never checked by it.
              # 24: `blocked` joins unless_labels: a hold label so
              #   an issue not yet workable matches zero registered workflows
              #   until the label is removed.
              # 23: three input edits, no topology change. (1) `fix` adds
              #   `synthesize.findings` beside `reconcile.findings`: the
              #   aggregate reaches the fixer as cluster titles and member ids
              #   with no evidence, while the synthesize artifact's body lists
              #   every member's judge, id, severity and evidence — one fixer
              #   on this track, handed eight title-only clusters, spent
              #   fourteen calls (run reports, step shows, a raw open of the
              #   store's database) hunting for member bodies. ordinalScoped
              #   binds it to the round that just judged the fixer's base.
              #   (2) `fix` adds `issue.latest.change-summary` beside
              #   `implement.change-summary`: the engine never rebinds a loop
              #   body's own inputs, so at fix@2 and later the packet carried
              #   implement@0's account and omitted fix@(N-1)'s, the tree the
              #   fixer actually stands on (three fix@2 packets in one run on
              #   this track all bound to implement@0). `issue.latest.<kind>`
              #   is the engine's named form for exactly this; at fix@1 both
              #   entries resolve to implement@0 and the bundle de-duplicates
              #   them. (3) `issue.diff` joins `verify-tribunal`: without it
              #   context assembly lifts no target_sha, wave.js seats the
              #   panel with "NO target ref — seats read their own HEAD", and
              #   each seat re-derives the judged tree (one reconstructed it
              #   under its temp directory via git archive, another diffed two
              #   shas it found in the ac-report's prose). With it the bundle
              #   and the packet header carry target_sha/target_worktree. The
              #   wave's own log line still needs `step show` to surface the
              #   field, which is an engine change tracked separately.
              #   NOT changed: `synthesize`'s `review.*` already binds to the
              #   current round only; previous-round raw judge payloads in a
              #   re-review synthesize packet come from the engine's
              #   previous-round pass matching every artifact of the emitted
              #   kind, which no input edit can scope — engine change, tracked
              #   separately.
              # 22: reconcile gains a second routing, `drain-highs`
              #   on `any(open_severity >= high)`, interposing a new executor
              #   step that files each still-open high cluster (not held, not
              #   operator-resolved) as a `--gap-file` backlog issue at its
              #   completion — two durable homes in one transaction, the
              #   gap-file precedent. Before this, a run completed round 0
              #   with several open HIGH clusters recorded only in reconcile
              #   artifacts nothing downstream reads: the fix-loop threshold
              #   worked as configured, but an open high had no drain path at
              #   all, while severity-ladder-general promises a Concern
              #   "lands in the run record and backlog the operator reviews
              #   before publishing". Routing highs into the fix loop instead
              #   would repeat the route security-change@23 reverted (only a
              #   Blocker opens a fix round). Blocker routing is unchanged:
              #   `fix-loop` stays first and ThresholdOrder evaluates it
              #   first, so a round with any open blocker still loops and
              #   highs drain only once blockers are cleared; a round with
              #   nothing open at high or above routes `pass` and the drain
              #   step is terminalized `skipped` — never claimed, no cost
              #   accrued. Same change: standard-change@28, spec-doc@21,
              #   spec-project@15; new contracts/drain-highs.md; policy@19
              #   seats the executor.
              # 21: `security` joins unless_labels beside
              #   `security-change` and `security-load-bearing`, which this
              #   list already excludes. security-change@26 now matches
              #   `security`, so without this an issue labelled `ui` +
              #   `security` would match two workflows and refuse activation;
              #   with it the security track wins, exactly as it already does
              #   for the two sibling labels.
              # 20: two independent reasons — (1) this table's own description
              #   text had a citation dropped in a provenance-citation-scrub
              #   pass; (2) review/reconcile/design-qa repoint findings@8 ->
              #   findings@9 and synthesize repoints findings-cluster@1 ->
              #   findings-cluster@2, the same scrub applied to those two
              #   schemas' field descriptions. The engine refuses an in-place
              #   edit to a frozen registration either way.
description = "UI change bound to an accepted ux-spec (cited in the issue body — no engine input form reaches a cross-issue doc), design-judged and design-QA'd before AC verification so an AC that reads the design-QA findings can resolve met/unmet instead of unverifiable; the conductor integrates commits, the operator publishes."

[match]
labels_any = ["ui"]
unless_labels = [
  "blocked",
  "docs-only",
  "investigation",
  "release",
  "retro",
  "security",
  "security-change",
  "security-load-bearing",
  "spec-doc",
  "spec-project",
]

[limits]
"design-qa" = { max = 16, max_step_duration = "1h" }
"drain-highs" = { max = 16, max_step_duration = "1h" }
"judge-architecture" = { max = 16, max_step_duration = "1h" }
"judge-correctness" = { max = 16, max_step_duration = "1h" }
"judge-design" = { max = 16, max_step_duration = "1h" }
"judge-testing" = { max = 16, max_step_duration = "1h" }
"synthesize-findings" = { max = 16, max_step_duration = "1h" }
"verify-ac" = { max = 16, max_step_duration = "1h" }
"write" = { max = 16, max_step_duration = "2h" }

[[step]]
after = []
class = "write"
emits = "change-summary"
executor = "implement"
expected_cost = 1.50
gates = ["build", "tests", "self-hygiene", "secret-scan", "doc-validate"]
inputs = ["issue.body"]
max_attempts = 2
name = "implement"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["implement"]
emits = "findings"
expected_cost = 0.60
fanout = ["judge-correctness", "judge-architecture", "judge-testing", "judge-design"]
holds_tree = false
inputs = ["implement.change-summary", "issue.diff"]
name = "review"
packet = ["contracts/{executor}.md"]
payload = "findings@9"

[[step]]
after = ["review"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.60
holds_tree = false
inputs = ["review.*"]
name = "synthesize"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@2"

[[step]]
action = "aggregate"
after = ["synthesize"]
inputs = ["synthesize.findings"]
max_fix_loops = 2
name = "reconcile"
params = { field = "severity", method = "max", hold_spread = 3, output = "findings" }
payload = "findings@9"
threshold = { "fix-loop" = "any(open_severity >= blocker)", "drain-highs" = "any(open_severity >= high)" }

[[step]]
after = ["reconcile"]
emits = "drain-report"
executor = "drain-highs"
expected_cost = 0.30
holds_tree = false
inputs = ["reconcile.findings", "issue.body"]
name = "drain-highs"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after_loop = "review"
class = "write"
emits = "change-summary"
executor = "fix"
expected_cost = 1.00
gates = ["build", "tests", "self-hygiene", "secret-scan", "doc-validate"]
inputs = ["reconcile.findings", "synthesize.findings", "implement.change-summary", "issue.latest.change-summary", "issue.latest.ac-report", "design-qa.findings"]
loop = true
name = "fix"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["reconcile"]
emits = "findings"
executor = "design-qa"
expected_cost = 0.90
gates = [{ name = "render-verify", pre = true }, { name = "copy-verify", pre = true }]
holds_tree = false
inputs = ["issue.body", "issue.diff", "implement.change-summary", "design-qa.gate-results"]
name = "design-qa"
packet = ["contracts/{executor}.md"]
payload = "findings@9"
threshold = { "fix-loop" = "any(severity >= blocker)" }

[[step]]
after = ["design-qa"]
emits = "ac-report"
executor = "verify-ac"
expected_cost = 0.50
gates = [{ name = "ac-commands", pre = true }]
holds_tree = false
inputs = ["issue.body", "issue.diff", "implement.change-summary", "verify.gate-results", "design-qa.findings"]
name = "verify"
packet = ["contracts/{executor}.md"]
payload = "ac-report@1"
threshold = { "fix-loop" = "any(status == unmet)", "verify-tribunal" = "any(status == unverifiable)" }

[[step]]
after = ["verify"]
inputs = ["verify.ac-report", "issue.body", "issue.diff"]
name = "verify-tribunal"
on_fail = "waiting-human"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-correctness"]
