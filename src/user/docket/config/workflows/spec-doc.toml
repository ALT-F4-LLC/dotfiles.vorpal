[pipeline]
description = "Author a PRD/TDD/ADR/ux-spec, optionally grounded by a research step, validate, review, and accept by vote: the doc-acceptance panel (TDD/ADR) or the tribunal (PRD/ux-spec); a rejection re-enters the bounded revise loop at review."
name = "spec-doc"
version = 27  # 27: corpus-wide naming-convention pass (src/user/docket/config/README.md).
              #   Step renames, plus one topology change. Renames: `author-tdd-security`
              #   -> `tdd-author-security`, `author-tdd` -> `tdd-author`, `author-adr`
              #   -> `adr-author`, `author-ux-spec` -> `ux-spec-author`, `author-prd`
              #   -> `prd-author` (each step now equals its sole executor's name,
              #   retiring the corpus's systematic author-<X>/<X>-author word-order
              #   inversion); `synthesize` -> `synthesize-findings`; `accept-vote-tdd`
              #   -> `tdd-vote`, `accept-vote-adr` -> `adr-vote` (vote steps now
              #   uniformly named `<doctype>-vote`). Topology change: `accept-tribunal`
              #   — which gated BOTH ux-spec and prd acceptance under one step name
              #   selected by two mutually exclusive `when` clauses — splits into two
              #   steps, `ux-spec-vote` and `prd-vote`, each carrying one of the former
              #   combined step's `when` predicates and identical voters/vote_rule/
              #   after/on_fail. `record`'s `after` list and the two revise-* steps'
              #   vote-record inputs updated to the split names. Step count 15 -> 16.
              # 26: no behavior change — a step rename and two comment
              #   corrections; the topology, seats, rules and routes are
              #   byte-for-byte those of version 25. (a) The tribunal
              #   acceptance vote `accept-human` is renamed
              #   `accept-tribunal`: it seats tribunal-architecture,
              #   tribunal-security and tribunal-design, and since version 25
              #   its rejection has routed `fix-loop`, so the old name
              #   described neither the seats nor the route. `revise-prd`
              #   and `revise-ux-spec` now read `accept-tribunal.vote-record`
              #   — the engine serves the same recorded proposal under the
              #   new step name — and `record.after` names the new name.
              #   Same `vote_rule = "tribunal"`, same `on_fail = "fix-loop"`,
              #   same `after = ["reconcile"]`, same `when`. (b) The
              #   version-25 note below is corrected in place. It said the
              #   judge-panel gate's three decisions on one issue were two
              #   rejections that looped with no operator involvement and a
              #   third that hit the loop bound. The store shows one
              #   rejection at 3-0 that looped with no operator involvement,
              #   one rejection at 2-1 (weighted 0.36) that hit the loop
              #   bound, parked waiting-human, and was resolved `fix-round`
              #   twelve minutes later, and one approval at 2-1 (weighted
              #   0.63): two rejections, not three, and only one looped. The
              #   note's mechanism claim, the loop bound as the human
              #   backstop, stands. A registered version's bytes are frozen,
              #   so the edited bytes are a new version.
              # 25: `accept-human` routes a rejection to `fix-loop` instead
              #   of `waiting-human`, matching `accept-vote-tdd` and
              #   `accept-vote-adr` in this file (same `after`, same re-entry
              #   at `review`); `revise-prd` and `revise-ux-spec` read
              #   `accept-human.vote-record` as `revise-tdd` reads
              #   `accept-vote-tdd.vote-record`. Measured across every
              #   project on this machine (2 issues ever bound): this gate
              #   decided once — rejected 3-0, parked the run, operator
              #   resolved `override-pass`. The judge-panel gate on the same
              #   track decided three times on one issue: one rejection
              #   (3-0) looped with no operator involvement; one rejection
              #   (2-1, weighted 0.36) hit the loop bound, parked
              #   waiting-human, and the operator resolved `fix-round`
              #   twelve minutes later; the third decision approved (2-1,
              #   weighted 0.63). That bound is the backstop this keeps: a
              #   rejected vote with `on_fail = "fix-loop"` enters the
              #   issue's loop, and when the next ordinal would exceed
              #   `max_fix_loops` (2, declared on `reconcile`; one counter
              #   per issue, shared with reconcile's blocker rounds) the
              #   engine parks the vote step waiting-human with a reason
              #   naming `docket step resolve --as fix-round`. Thin evidence,
              #   stated as such; the change leans on the file's own two
              #   sibling gates. Description no longer says "escalating to
              #   the operator".
              # 24: `blocked` joins unless_labels: a hold label so
              #   an issue not yet workable matches zero registered workflows
              #   until the label is removed.
              # 23: the three TDD security lane pairs (`author-tdd-security`,
              #   `-alt`, `-slb` and their `revise-` twins) collapse back to
              #   one pair. They were three copies of one step — same
              #   executor, gates, inputs, cost — differing only in which of
              #   the three security labels each `when` tested, because the
              #   engine's step-level `when` admitted only conjunctions and
              #   the disjoint split was the only way to say "any of these".
              #   The engine now accepts a set-membership clause,
              #   `labels contains_any [a, b, c]`, evaluated as list
              #   intersection; a single `when` of
              #   `labels contains doc:tdd and labels contains_any
              #   [security-change, security-load-bearing, security]` is the
              #   exact union of the three old predicates, so no label
              #   combination routes differently than it did at @22 —
              #   `author-tdd`/`revise-tdd` keep their three `!=` clauses and
              #   remain the disjoint complement. `review.after` drops the
              #   two retired names. Routing equivalence is by construction;
              #   no spec-doc run had exercised the `-slb` lane, so this is
              #   not measured against the ledger.
              # 22: a third TDD security lane pair, `author-tdd-security-slb`
              #   and `revise-tdd-security-slb`, for an issue labelled
              #   `doc:tdd` + `security-load-bearing` with neither
              #   `security-change` nor `security`. policy.toml's [security]
              #   table names all three labels as security labels and its
              #   comment says every one must ROUTE, not only pin the model;
              #   until this version the TDD lanes routed the first and third
              #   and let the second fall through to `author-tdd`. The wave
              #   still applied the `never = fable` pin by label, so the model
              #   was right and the contract was wrong: the general TDD
              #   charter, without the threat-model-method and
              #   security-review-dimensions fragments, would have written a
              #   security design. No run had hit it (3 spec-doc runs in the
              #   ledger: two ux-spec, one tdd-security-alt); this closes it on
              #   design judgment, not measurement. It costs a whole lane pair
              #   because a step-level `when` admits only conjunctions — the
              #   engine splits on ` and ` and knows no `or` — which is also
              #   why the `-alt` lane exists. `author-tdd` and `revise-tdd`
              #   add `labels != security-load-bearing` so the lanes stay
              #   disjoint. An engine issue asks for an any-of connective so
              #   the three security lanes can collapse to one later.
              # 21: reconcile gains the `drain-highs` routing on
              #   `any(open_severity >= high)` plus the interposed executor
              #   step it names, which files each still-open high cluster
              #   (not held, not operator-resolved) as a `--gap-file` backlog
              #   issue at its completion; see ui-change@22 for the full
              #   trail. This track's acceptance votes do read
              #   reconcile.findings, but a vote-record is one decision about
              #   the doc, not a durable record of each open high — a doc
              #   accepted with open highs standing evaporated them exactly
              #   as the change tracks did. `fix-loop` stays first and
              #   ThresholdOrder evaluates it first, so a round with any open
              #   blocker still loops; a round with nothing open at high or
              #   above routes `pass` with the drain step terminalized
              #   `skipped`, never claimed and never billed.

[match]
labels_any = ["spec-doc"]
unless_labels = ["blocked", "spec-project", "release", "retro"]

[limits]
"drain-highs" = { max = 16, max_step_duration = "1h" }
"judge-architecture" = { max = 16, max_step_duration = "1h" }
"judge-design" = { max = 16, max_step_duration = "1h" }
"judge-security" = { max = 16, max_step_duration = "1h" }
"research" = { max = 16, max_step_duration = "1h" }
"synthesize-findings" = { max = 16, max_step_duration = "1h" }
"write" = { max = 16, max_step_duration = "2h" }

[[step]]
after = []
emits = "research-notes"
executor = "research"
expected_cost = 0.50
holds_tree = false
inputs = ["issue.body"]
name = "research"
packet = ["contracts/{executor}.md"]
when = "labels contains needs-research"

[[step]]
after = ["research"]
class = "write"
emits = "doc"
executor = "tdd-author-security"
expected_cost = 1.20
gates = ["doc-validate", "tdd-preflight", "reserved-name-check"]
inputs = ["research.*", "issue.body"]
max_attempts = 2
name = "tdd-author-security"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels contains_any [security-change, security-load-bearing, security]"

[[step]]
after = ["research"]
class = "write"
emits = "doc"
executor = "tdd-author"
expected_cost = 1.20
gates = ["doc-validate", "tdd-preflight", "reserved-name-check"]
inputs = ["research.*", "issue.body"]
max_attempts = 2
name = "tdd-author"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels != security-change and labels != security and labels != security-load-bearing"

[[step]]
after = ["research"]
class = "write"
emits = "doc"
executor = "adr-author"
expected_cost = 1.20
gates = ["doc-validate", "reserved-name-check"]
inputs = ["research.*", "issue.body"]
max_attempts = 2
name = "adr-author"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:adr and labels != doc:tdd"

[[step]]
after = ["research"]
class = "write"
emits = "doc"
executor = "ux-spec-author"
expected_cost = 1.20
gates = ["doc-validate", "reserved-name-check"]
inputs = ["research.*", "issue.body"]
max_attempts = 2
name = "ux-spec-author"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:ux-spec and labels != doc:tdd and labels != doc:adr"

[[step]]
after = ["research"]
class = "write"
emits = "doc"
executor = "prd-author"
expected_cost = 1.20
gates = ["doc-validate", "reserved-name-check"]
inputs = ["research.*", "issue.body"]
max_attempts = 2
name = "prd-author"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels != doc:tdd and labels != doc:adr and labels != doc:ux-spec"

[[step]]
after = ["tdd-author-security", "tdd-author", "adr-author", "ux-spec-author", "prd-author"]
emits = "findings"
expected_cost = 0.60
fanout = ["judge-architecture", "judge-security", "judge-design"]
holds_tree = false
inputs = ["issue.latest.doc", "issue.body"]
name = "review"
packet = ["contracts/{executor}.md"]
payload = "findings@9"

[[step]]
after = ["review"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.60
holds_tree = false
inputs = ["review.*"]
name = "synthesize-findings"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@2"

[[step]]
action = "aggregate"
after = ["synthesize-findings"]
inputs = ["synthesize-findings.findings"]
max_fix_loops = 2
name = "reconcile"
params = { field = "severity", method = "max", hold_spread = 3, output = "findings" }
payload = "findings@9"
threshold = { "fix-loop" = "any(open_severity >= blocker)", "drain-highs" = "any(open_severity >= high)" }

[[step]]
after = ["reconcile"]
emits = "drain-report"
executor = "drain-highs"
expected_cost = 0.30
holds_tree = false
inputs = ["reconcile.findings", "issue.body"]
name = "drain-highs"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "tdd-author-security"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc", "tdd-vote.vote-record", "research.*"]
loop = true
name = "revise-tdd-security"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels contains_any [security-change, security-load-bearing, security]"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "tdd-author"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc", "tdd-vote.vote-record", "research.*"]
loop = true
name = "revise-tdd"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels != security-change and labels != security and labels != security-load-bearing"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "adr-author"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc", "adr-vote.vote-record", "research.*"]
loop = true
name = "revise-adr"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:adr and labels != doc:tdd"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "ux-spec-author"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc", "ux-spec-vote.vote-record", "research.*"]
loop = true
name = "revise-ux-spec"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:ux-spec and labels != doc:tdd and labels != doc:adr"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "prd-author"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc", "prd-vote.vote-record", "research.*"]
loop = true
name = "revise-prd"
packet = ["contracts/{executor}.md"]
when = "labels != doc:tdd and labels != doc:adr and labels != doc:ux-spec"

[[step]]
after = ["reconcile"]
inputs = ["issue.latest.doc", "reconcile.findings"]
name = "tdd-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "doc-acceptance"
# Deliberately judge-*, not tribunal-*: doc-acceptance is the judges' own
# panel, not the operator-stand-in tribunal (`ux-spec-vote`/`prd-vote` below), and
# policy.toml routes the two seat families to different tiers (judge-*
# opus-high, tribunal-* fable/opus-xhigh). As voters these seats are briefed
# by the workflow scripts' LENSES table, not by contracts/judge-*.md — one
# name, two remits.
voters = ["judge-architecture", "judge-security", "judge-correctness"]
when = "labels contains doc:tdd"

[[step]]
after = ["reconcile"]
inputs = ["issue.latest.doc", "reconcile.findings"]
name = "adr-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "doc-acceptance"
# judge-*, deliberately — see tdd-vote above.
voters = ["judge-architecture", "judge-security", "judge-correctness"]
when = "labels contains doc:adr and labels != doc:tdd"

[[step]]
after = ["reconcile"]
inputs = ["issue.latest.doc", "reconcile.findings"]
name = "ux-spec-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-design"]
when = "labels contains doc:ux-spec and labels != doc:tdd and labels != doc:adr"

[[step]]
after = ["reconcile"]
inputs = ["issue.latest.doc", "reconcile.findings"]
name = "prd-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-design"]
when = "labels != doc:tdd and labels != doc:adr and labels != doc:ux-spec"

[[step]]
action = "doc-record"
after = ["tdd-vote", "adr-vote", "ux-spec-vote", "prd-vote"]
expected_cost = 0.20
gates = ["citation-check"]
inputs = ["issue.latest.doc"]
name = "record"
params = { output = "doc-record" }
