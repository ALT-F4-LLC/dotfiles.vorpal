[pipeline]
description = "Implement, review, reconcile, and verify one ordinary change; the conductor integrates commits, the operator publishes."
name = "standard-change"
version = 26  # 26: implement and fix add the `vuln-scan` gate. An ordinary
              #   change can add a third-party dependency, and nothing in
              #   this pipeline audited a newly added dependency's own CVE
              #   exposure — a hash-pinned lockfile buys integrity, not
              #   vulnerability freedom. The gate is UNCONDITIONAL because
              #   §11.1 admits no gate predicate: a gate entry carries only
              #   `name`, `source`, and `pre`, and step-level `when` reads
              #   issue kind/labels, never the diff. A repo with no
              #   `vuln-scan` trust entry records `unmatched`, which routes
              #   as a failure — register one (a declared stub, if there is
              #   no scanner yet) before binding this version

[match]
unless_labels = [
  "disposition",
  "docs-only",
  "investigation",
  "release",
  "retro",
  "security-change",
  "security-load-bearing",
  "spec-doc",
  "spec-project",
  "ui",
]

[limits]
"judge-architecture" = { max = 16, max_step_duration = "1h" }
"judge-correctness" = { max = 16, max_step_duration = "1h" }
"judge-security" = { max = 16, max_step_duration = "1h" }
"judge-testing" = { max = 16, max_step_duration = "1h" }
"synthesize-findings" = { max = 16, max_step_duration = "1h" }
"verify-ac" = { max = 16, max_step_duration = "1h" }
"write" = { max = 16, max_step_duration = "2h" }

[[step]]
after = []
class = "write"
emits = "change-summary"
executor = "implement"
expected_cost = 1.50
gates = ["build", "tests", "self-hygiene", "secret-scan", "vuln-scan"]
inputs = ["issue.body"]
max_attempts = 2
name = "implement"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
name = "review"
holds_tree = false
after = ["implement"]
fanout = ["judge-correctness", "judge-architecture", "judge-testing"]
emits = "findings"
packet = ["contracts/{executor}.md"]
payload = "findings@9"
expected_cost = 0.60
inputs = ["implement.change-summary", "issue.diff"]

[[step]]
after = ["implement"]
emits = "findings"
executor = "judge-security"
expected_cost = 0.60
holds_tree = false
inputs = ["implement.change-summary", "issue.diff"]
name = "review-security"
packet = ["contracts/{executor}.md"]
payload = "findings@9"
when = "labels contains security"

[[step]]
after = ["review", "review-security"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.60
holds_tree = false
inputs = ["review.*", "review-security.findings"]
name = "synthesize"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@2"

[[step]]
action = "aggregate"
after = ["synthesize"]
inputs = ["synthesize.findings"]
max_fix_loops = 2
name = "reconcile"
params = { field = "severity", method = "max", hold_spread = 3, output = "findings" }
payload = "findings@9"
threshold = { "fix-loop" = "any(open_severity >= blocker)" }

[[step]]
after_loop = "review"
class = "write"
emits = "change-summary"
executor = "fix"
expected_cost = 1.00
gates = ["build", "tests", "self-hygiene", "secret-scan", "vuln-scan"]
inputs = ["reconcile.findings", "implement.change-summary", "issue.latest.ac-report"]
loop = true
name = "fix"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["reconcile"]
emits = "ac-report"
executor = "verify-ac"
expected_cost = 0.50
gates = [{ name = "ac-commands", pre = true }]
holds_tree = false
inputs = ["issue.body", "issue.diff", "implement.change-summary", "verify.gate-results"]
name = "verify"
packet = ["contracts/{executor}.md"]
payload = "ac-report@1"
threshold = { "fix-loop" = "any(status == unmet)", "waiting-human" = "any(status == unverifiable)" }
