[pipeline]
description = "Security-track change: threat model first, security judge, abuse-case gate, vote-gated acceptance."
name = "security-change"
version = 23  # 23: `reconcile` sends High and above to the human
              #   `security-vote` again, and the `fix-loop` route added at
              #   22 is removed. The trail: b51e498 raised this threshold
              #   from `>= high` to `>= blocker`, which left a high-
              #   severity finding with no route at all and no vote; DOT-775
              #   read that gap as a missing fix round, and commit 2201b41
              #   closed it at 22 by adding `fix-loop = any(severity ==
              #   high)` beside the blocker-only vote. DOT-785 then found
              #   that route contradicts both ladders the corpus ships:
              #   `fragments/severity-ladder-security.md` says High and
              #   above route to the HUMAN security vote and that the
              #   automatic fix loop is retired for this track, and
              #   `fragments/severity-ladder-general.md` says only a
              #   Blocker opens a fix round. So this bump keeps 2201b41's
              #   diagnosis and reverts its routing: the fix-loop key goes,
              #   and the vote fires on `>= high` — where it sat before
              #   b51e498 — so every high and every blocker convenes the
              #   vote and nothing falls through unrouted. With `fix-loop`
              #   no longer a key on this step, the `ThresholdOrder`
              #   precedence that forced `== high` at 22 no longer bears on
              #   it; the `fix` step stays reachable, via the votes'
              #   `on_fail` and `verify`'s unmet-AC threshold.

[match]
labels_any = ["security-change", "security-load-bearing"]
unless_labels = [
  "docs-only",
  "investigation",
  "release",
  "retro",
  "spec-doc",
  "spec-project",
]

[limits]
"judge-architecture" = { max = 16, max_step_duration = "1h" }
"judge-correctness" = { max = 16, max_step_duration = "1h" }
"judge-security" = { max = 16, max_step_duration = "1h" }
"judge-testing" = { max = 16, max_step_duration = "1h" }
"synthesize-findings" = { max = 16, max_step_duration = "1h" }
"threat-model" = { max = 16, max_step_duration = "1h" }
"verify-ac" = { max = 16, max_step_duration = "1h" }
"write" = { max = 16, max_step_duration = "2h" }

[[step]]
after = []
emits = "threat-model"
executor = "threat-model"
expected_cost = 0.80
holds_tree = false
inputs = ["issue.body"]
name = "threat-model"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["threat-model"]
class = "write"
emits = "change-summary"
executor = "implement"
expected_cost = 1.50
gates = ["build", "tests", "self-hygiene", "secret-scan", "vuln-scan", "sdet-abuse"]
inputs = ["threat-model.threat-model", "issue.body"]
max_attempts = 2
name = "implement"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["implement"]
emits = "findings"
expected_cost = 0.60
fanout = ["judge-correctness", "judge-architecture", "judge-testing", "judge-security"]
holds_tree = false
inputs = ["implement.change-summary", "threat-model.threat-model", "issue.diff"]
name = "review"
packet = ["contracts/{executor}.md"]
payload = "findings@9"

[[step]]
after = ["review"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.60
holds_tree = false
inputs = ["review.*"]
name = "synthesize"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@2"

[[step]]
action = "aggregate"
after = ["synthesize"]
inputs = ["synthesize.findings"]
max_fix_loops = 3
name = "reconcile"
params = { field = "severity", method = "max", hold_spread = 3, output = "findings" }
payload = "findings@9"
threshold = { "security-vote" = "any(severity >= high)" }

[[step]]
name = "fix"
executor = "fix"
class = "write"
emits = "change-summary"
packet = ["contracts/{executor}.md"]
expected_cost = 1.00
loop = true
inputs = ["reconcile.findings", "implement.change-summary", "threat-model.threat-model", "issue.latest.ac-report", "security-vote.vote-record", "verify-tribunal.vote-record"]
gates = ["build", "tests", "self-hygiene", "secret-scan", "vuln-scan", "sdet-abuse"]
after_loop = "review"

[[step]]
after = ["reconcile"]
inputs = ["reconcile.findings"]
name = "security-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "security-acceptance"
voters = ["judge-security", "judge-architecture", "judge-correctness"]

[[step]]
after = ["reconcile"]
emits = "ac-report"
executor = "verify-ac"
expected_cost = 0.50
gates = [{ name = "ac-commands", pre = true }]
holds_tree = false
inputs = ["issue.body", "issue.diff", "implement.change-summary", "verify.gate-results"]
name = "verify"
packet = ["contracts/{executor}.md"]
payload = "ac-report@1"
threshold = { "fix-loop" = "any(status == unmet)", "verify-tribunal" = "any(status == unverifiable)" }

[[step]]
after = ["verify"]
inputs = ["verify.ac-report", "issue.body"]
name = "verify-tribunal"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-correctness"]
