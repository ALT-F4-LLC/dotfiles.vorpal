name: vorpal

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: bash tests/teammate-idle-hook.test.sh

      - run: bash tests/task-completed-hook.test.sh

      - run: bash tests/doctrine_check.test.sh

      # Central byte gate. The charter's ceilings bind here and nowhere else —
      # no editing skill carries its own copy of the obligation. --strict turns
      # the warn-only default into a failure, so a raise must land as a stated
      # reason on the byte_ceilings.tsv row rather than being silently absorbed.
      - run: bash src/user/claude-code/scripts/byte_ceiling_check.sh --strict

      - run: bash tests/model_census.test.sh

      - run: bash tests/drift_guard_check.test.sh

      - run: bash tests/guard-no-commit-hook.test.sh

  build-dev:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ALT-F4-LLC/setup-vorpal-action@0.1.1
        with:
          registry-backend: "s3"
          registry-backend-s3-bucket: "altf4llc-vorpal-registry"
          version: "0.3.0"
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_DEFAULT_REGION: "${{ vars.AWS_DEFAULT_REGION }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"

      - run: vorpal build 'dev'

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.arch }}-${{ runner.os }}-vorpal-lock
          path: Vorpal.lock

  build:
    needs:
      - build-dev
    runs-on: macos-latest
    strategy:
      matrix:
        artifact:
          - user
    steps:
      - uses: actions/checkout@v7

      - uses: ALT-F4-LLC/setup-vorpal-action@0.1.1
        with:
          registry-backend: "s3"
          registry-backend-s3-bucket: "altf4llc-vorpal-registry"
          version: "0.3.0"
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_DEFAULT_REGION: "${{ vars.AWS_DEFAULT_REGION }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"

      - run: vorpal build '${{ matrix.artifact }}'
