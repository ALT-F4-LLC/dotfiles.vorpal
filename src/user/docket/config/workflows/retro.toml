[pipeline]
description = "Mine recent run evidence into config-change proposals, accepted by tribunal vote that escalates to the operator."
name = "retro"
version = 9

[match]
labels_any = ["retro"]

[limits]
"judge-correctness" = { max = 16, max_step_duration = "1h" }
"judge-simplicity" = { max = 16, max_step_duration = "1h" }
"retro-analyst" = { max = 16, max_step_duration = "1h" }
"synthesize-findings" = { max = 16, max_step_duration = "1h" }

[[step]]
after = []
emits = "proposals"
executor = "retro-analyst"
expected_cost = 1.00
holds_tree = false
inputs = ["issue.body"]
max_attempts = 2
name = "analyze"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["analyze"]
emits = "findings"
expected_cost = 0.50
fanout = ["judge-correctness", "judge-simplicity"]
holds_tree = false
inputs = ["analyze.proposals"]
name = "review"
packet = ["contracts/{executor}.md"]
payload = "findings@6"

[[step]]
after = ["review"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.30
holds_tree = false
inputs = ["review.*"]
name = "synthesize"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@1"

[[step]]
action = "aggregate"
after = ["synthesize"]
inputs = ["synthesize.findings"]
max_fix_loops = 2
name = "reconcile"
params = { field = "severity", method = "max", hold_spread = 2, output = "findings" }
payload = "findings@5"
threshold = { "fix-loop" = "any(severity >= blocker)" }

[[step]]
after_loop = "review"
emits = "proposals"
executor = "retro-analyst"
expected_cost = 0.60
holds_tree = false
inputs = ["reconcile.findings", "analyze.proposals"]
loop = true
name = "revise"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["reconcile"]
inputs = ["analyze.proposals", "reconcile.findings"]
name = "accept"
on_fail = "waiting-human"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-correctness"]
