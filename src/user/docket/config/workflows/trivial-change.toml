[pipeline]
description = "Trivial mechanical change, bound by the `trivial` label. Implement with the full gate list, then AC verification with a single-seat tribunal on an unverifiable or out-of-scope AC and one fix round re-entering at verify-ac. No judge. The conductor integrates commits; the operator publishes."
name = "trivial-change"
version = 9

[match]
labels_any = ["trivial"]
unless_labels = [
  "blocked",
  "disposition",
  "docs-only",
  "investigation",
  "release",
  "retro",
  "route-direct",
  "route-loop",
  "route-tend",
  "security",
  "security-change",
  "security-load-bearing",
  "small",
  "spec-doc",
  "spec-project",
  "ui",
]

[limits]
"verify-ac" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"write" = { max = 16, lease_ttl = "2h", max_step_duration = "2h" }

[[step]]
after = []
class = "write"
emits = "change-summary"
executor = "implement"
expected_cost = 1.50
gates = ["diff-scope-trivial", "build", "tests", "self-hygiene", "secret-scan", "vuln-scan", "doc-validate"]
inputs = ["issue.body"]
max_attempts = 2
name = "implement"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after_loop = "verify-ac"
class = "write"
emits = "change-summary"
executor = "fix"
expected_cost = 1.00
gates = ["diff-scope-trivial", "build", "tests", "self-hygiene", "secret-scan", "vuln-scan", "doc-validate"]
inputs = ["implement.change-summary", "issue.latest.change-summary", "issue.latest.ac-report", "verify-ac-vote.vote-record"]
loop = true
name = "fix"
packet = ["contracts/{executor}.md", "fragments/fix-ac-only.md"]

[[step]]
after = ["implement"]
emits = "ac-report"
executor = "verify-ac"
expected_cost = 0.50
gates = [{ name = "ac-commands", pre = true }]
holds_tree = false
inputs = ["issue.body", "issue.diff", "implement.change-summary", "implement.gate-results", "verify-ac.gate-results"]
max_fix_loops = 1
name = "verify-ac"
packet = ["contracts/{executor}.md"]
payload = "ac-report@2"
threshold = { "fix-loop" = "any(status == unmet)", "verify-ac-vote" = "any(status != met)" }

[[step]]
after = ["verify-ac"]
inputs = ["verify-ac.ac-report", "issue.body", "issue.diff"]
name = "verify-ac-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-correctness"]
