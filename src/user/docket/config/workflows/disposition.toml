[pipeline]
description = "Cross-issue disposition: write the verdict comment and close the carrier. Gated on the build/test sanity check and AC verification, with a bounded revise loop. No code-review machinery."
name = "disposition"
version = 13

[match]
labels_any = ["disposition"]
unless_labels = ["blocked", "docs-only", "investigation", "spec-doc", "spec-project", "release", "retro", "security", "security-change", "security-load-bearing", "ui", "route-direct", "route-loop", "route-tend"]

[limits]
"write" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"verify-ac" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }

[[step]]
after = []
class = "write"
emits = "disposition"
executor = "dispose"
expected_cost = 0.60
gates = ["build", "tests"]
inputs = ["issue.body"]
max_attempts = 2
name = "dispose"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["dispose"]
emits = "ac-report"
executor = "verify-ac"
expected_cost = 0.40
gates = [{ name = "ac-commands", pre = true }]
holds_tree = false
inputs = ["issue.body", "issue.diff", "dispose.disposition", "verify-ac.gate-results"]
max_fix_loops = 2
name = "verify-ac"
packet = ["contracts/{executor}.md"]
payload = "ac-report@2"
threshold = { "fix-loop" = "any(status == unmet)", "verify-ac-vote" = "any(status != met)" }

[[step]]
after = ["verify-ac"]
inputs = ["verify-ac.ac-report", "issue.body", "issue.diff"]
name = "verify-ac-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-correctness"]

[[step]]
after_loop = "verify-ac"
class = "write"
emits = "disposition"
executor = "dispose"
expected_cost = 0.40
gates = ["build", "tests"]
inputs = ["verify-ac.ac-report", "issue.latest.disposition", "issue.body", "verify-ac-vote.vote-record"]
loop = true
name = "revise-disposition"
packet = ["contracts/{executor}.md"]
