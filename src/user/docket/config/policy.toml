[security]
ceiling = "opus-max"
# Every label here also ROUTES — it is not a model-only list. Until
# security-change@26 these three labels model-routed while only two appeared
# in any workflow's [match].labels_any, so an issue labelled just `security`
# drew the ceiling and the `never` below but ran the ordinary standard-change
# pipeline, with no threat model, no security-vote, no abuse-case gate; no
# check could see it, since `run activate --dry-run` refuses zero matches and
# several matches but an exactly-one-WRONG match is structurally
# undetectable there. Fix: `security` now routes too (security-change@26
# [match].labels_any; excluded in standard-change@27, ui-change@21,
# disposition@3). A label added to this list must also be added to
# security-change's `labels_any` and to the `unless_labels` of every workflow
# that excludes its siblings, or it re-opens the same trap.
labels = ["security-change", "security-load-bearing", "security"]
# security-load-bearing labeling test: apply the label at filing time to any
# issue that changes, relocates, or test-gates one of these control classes.
# "Test-gates" means acceptance criteria whose deletion or mutation a test
# would catch. Both changing a control's logic and moving or deleting its
# existing implementation qualify — a botched relocation can silently drop a
# chokepoint without changing any allow/deny outcome.
#   (a) Authentication — identity verification (OIDC/JWKS, issuer validation,
#       interceptor construction, credential validation)
#   (b) Authorization — access-control decisions (namespace/principal
#       binding, permission gates)
#   (c) Credential handling — building, storing, writing, or transmitting
#       secrets/tokens/credentials
#   (d) Egress/trust-boundary configuration — what hosts/registries/
#       endpoints code may reach or trust
#   (e) Path/namespace confinement — preventing caller-controlled escape
#       from an intended directory/namespace
#   (f) Verification/detection of any of the above — per threat-model.md's
#       definition of a control as including its verification, an
#       audit/detection-logging gap on a control counts even though deleting
#       it changes no allow/deny outcome
# Apply this test once, at filing (drain-highs.md references it for its own
# gap filings). Do not re-derive it at activation; RUN-92 spent five tribunal
# rounds re-deriving this same criterion because it lived nowhere durable.
never = ["fable"]
nodes = ["judge-security", "threat-model", "tdd-author-security", "spec-author-security", "tribunal-security"]
# D7 (code.claude.com/docs/en/model-config#automatic-model-fallback, 2026-09-02):
# "Fable models and Opus 5 run with safety classifiers, which most often flag
# cybersecurity and biology content. When a classifier flags a request and the
# flagged category has a fallback model, Claude Code re-runs the request on that
# model and shows a notice in the transcript." Fable 5.1: cyber → Opus 4.8, bio →
# Opus 5. Opus 5: cyber → Opus 4.8. Fable's classifier set is "a broader set than
# Claude Opus 5's cybersecurity-only classifiers" (Fable 5.1 migration guide).
reason = "Fable's safety classifiers cover more categories than Opus 5's cyber-only set and flag security review by its nature; Claude Code then re-runs the request on the fallback model (cyber → Opus 4.8), so a Fable seat here pays Fable's rate for an Opus 4.8 run and the ledger credits a model that never ran. Name Opus up front. Residual: Opus 5 itself re-runs cyber-flagged requests on Opus 4.8, and nothing in the step record catches that hop: the wave records `model_resolved` as unknown unless the runtime supplies an observation, so the serving model is visible only in the transcript-read usage back-fill, which reports the models it observed to the conductor apart from requested routing, while the ledger rows it writes carry units and quantities only."

[escalation]
# The on_failure walk is keyed on the row's claim count. The engine counts a
# claim whether it ended in a recorded failure or a lease reap (a session
# kill, a dead relay, a lapsed lease), and the resolver walks one escalate_to
# hop per prior claim, so a step whose only prior claim was reaped re-runs
# one tier up — e.g. an opus-high judge on a security-labelled issue walks to
# fable-high, is redirected by `never`, and lands on [escalation.fallback]
# opus-xhigh, on a row that never failed. Measured across a window of seven
# runs in three projects: 79 re-runs of reaped claims, none with a recorded
# failure behind its second attempt. 52 of the 79 were served a tier up and
# 27 were not, on the same claim count; verify-ac and the four review judges
# made up 62 of the 79. Attempt-matched output medians show the higher tier
# produced no more work than the first attempt (0.4x to 1.5x per executor),
# so the hop bought a higher price per token for the same output.
#
# The row now carries the distinction the walk needs: `failed_attempts` and
# `reaped_claims` count how each prior claim ended, and `prior_attempt_end`
# names how the most recent one ended ("reaped" | "failed"), on every
# next/dispatch-open/step-show row; the installed engine has this schema,
# and 67 of the 79 hops above ran under it. The engine's policy resolver,
# which ports the wave's walk, still reads the bare claim count and ignores
# those fields. Teaching it to hop on failed attempts only is an engine
# change, filed against the engine, not a value this file can express.
#
# Docket-retro ruling: the shipped default stays `one-hop`. The waste sits
# in the resolver's arithmetic, not the default; lowering the default would
# stop genuine failures from escalating to buy back a cost the arithmetic
# fix removes outright. Until the engine change lands, an acknowledged reap
# that is re-dispatched still re-runs one tier up. Acknowledging it (the
# docket-run ack-reap gate) does not currently surface that cost to the
# panel: the gate's required evidence is the holder confirmed gone and the
# error verbatim, not the tier hop.
on_failure = "one-hop"
# Round-based escalation. A fix-loop round is a FRESH step id —
# `docket step resolve --as fix-round` mints fix@N+1 at attempt 0 — so
# on_failure's attempt-keyed walk never sees a loop's failure history; the
# fixer sat at sonnet-medium for all nine rounds of a past run before this
# gap was caught. The engine encodes the round ordinal in the instance name
# (`fix@N`, first entry minted at @1); executors listed in round_executors
# count each round after their first as one escalate_to hop, composed with
# any attempt hops and bounded by the same chain end / [security].ceiling.
# Only listed executors participate: the per-round re-runs that share the
# ordinal (review@N judges, synthesize@N, verify@N) are deliberately not
# listed and keep their standing variants.
on_round = "one-hop"
# Docket-retro: DECLINED — `fix` does not start one hop up on
# security-labelled issues. Measured across 19 fix-loop runs (15
# security-flavored: RUN-25/29/30/34/35/36/38/48/49/50/51/52/58/59/60; 4
# contrast: RUN-32/53/56/61): round-1 fixers already at opus-medium
# reproduced the just-closed-class recurrence docket-retro attributes to the
# base tier in every group that could observe one (e.g. RUN-60's own fix@2,
# RUN-61's own "re-introducing the class this same commit deleted twice"),
# while sonnet-medium round-1 fixers converged in one round on several
# security issues. The recurrence tracks the fix diff's size and spread, not
# the tier, and appears at the same rate on unlabelled work. The remedy
# landed instead as the sibling-sweep and claim-discipline obligations in
# contracts/fix.md@4. Do not re-open without runs where a tier-differentiated
# comparison is observable — today the ledger prices no tier (expected_cost
# is variant-blind) and pairs requested/resolved only per step.
round_executors = ["fix", "dispose"]
fable_gates = [
  "failed-top-opus-round",
  "investigator-class",
  "novel-architecture",
]

[escalation.fallback]
fable-high = "opus-xhigh"
# fable-low (policy 29): the map's one-notch-up pattern, and required — a
# fable-low seat on a security-labelled row resolves through it
# (tribunal-design on a security-labelled spec-doc issue), and the engine
# refuses a policy that leaves such a seat no permitted model.
fable-low = "opus-medium"
fable-max = "opus-max"
fable-medium = "opus-high"
fable-xhigh = "opus-max"
