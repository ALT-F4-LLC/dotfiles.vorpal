[pipeline]
description = "Small ordinary change, bound by the `small` label. Implement with the full gate list; one correctness judge routes a blocker straight to the fix loop. AC verification uses a single-seat tribunal on an unverifiable or out-of-scope AC, and the bounded fix loop re-enters at review. The conductor integrates commits; the operator publishes."
name = "small-change"
version = 13

[match]
labels_any = ["small"]
unless_labels = [
  "blocked",
  "disposition",
  "docs-only",
  "investigation",
  "release",
  "retro",
  "route-direct",
  "route-loop",
  "route-tend",
  "security",
  "security-change",
  "security-load-bearing",
  "spec-doc",
  "spec-project",
  "ui",
]

[limits]
"judge-correctness" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"verify-ac" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"write" = { max = 16, lease_ttl = "2h", max_step_duration = "2h" }

[[step]]
after = []
class = "write"
emits = "change-summary"
executor = "implement"
expected_cost = 1.50
gates = ["diff-scope-small", "build", "tests", "self-hygiene", "secret-scan", "vuln-scan", "doc-validate"]
inputs = []
max_attempts = 2
name = "implement"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["implement"]
emits = "findings"
executor = "judge-correctness"
expected_cost = 0.60
holds_tree = false
inputs = ["implement.change-summary", "issue.diff"]
max_attempts = 2
max_fix_loops = 2
name = "review"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
payload = "findings@12"
threshold = { "fix-loop" = "any(severity >= blocker)" }

[[step]]
after_loop = "review"
class = "write"
emits = "change-summary"
executor = "fix"
expected_cost = 1.00
gates = ["diff-scope-small", "build", "tests", "self-hygiene", "secret-scan", "vuln-scan", "doc-validate"]
inputs = ["review.findings", "implement.change-summary", "issue.latest.change-summary", "issue.latest.ac-report", "verify-ac-vote.vote-record"]
loop = true
name = "fix"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["review"]
emits = "ac-report"
executor = "verify-ac"
expected_cost = 0.50
gates = [{ name = "ac-commands", pre = true }]
holds_tree = false
inputs = ["issue.diff", "implement.change-summary", "implement.gate-results", "verify-ac.gate-results"]
max_attempts = 2
name = "verify-ac"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
payload = "ac-report@2"
threshold = { "fix-loop" = "any(status == unmet)", "verify-ac-vote" = "any(status != met)" }

[[step]]
after = ["verify-ac"]
inputs = ["verify-ac.ac-report", "issue.body", "issue.diff"]
name = "verify-ac-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-correctness"]
