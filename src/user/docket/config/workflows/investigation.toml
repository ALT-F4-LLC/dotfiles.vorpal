[pipeline]
description = "Read-only root-cause investigation with an optional research step, ending at a tribunal read. A rejection sends the report back to a bounded revision loop."
name = "investigation"
version = 20

[match]
labels_any  = ["investigation"]
unless_labels = ["blocked", "spec-doc", "spec-project", "release", "retro", "route-direct", "route-loop", "route-tend"]

[limits]
"investigate" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"report" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"research" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"revise-investigation" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }

[[step]]
after = []
emits = "investigation"
executor = "investigate"
expected_cost = 0.70
holds_tree = false
inputs = ["issue.body"]
max_attempts = 2
name = "investigate"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["investigate"]
emits = "research-notes"
executor = "research"
expected_cost = 0.50
holds_tree = false
inputs = ["investigate.investigation", "issue.body"]
name = "research"
packet = ["contracts/{executor}.md"]
payload = "research-notes@2"
when = "labels contains needs-research"

[[step]]
after = ["investigate", "research"]
emits = "investigation"
executor = "report"
expected_cost = 0.40
holds_tree = false
inputs = ["investigate.investigation", "research.*", "issue.body"]
name = "report"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["report"]
inputs = ["issue.latest.investigation"]
max_fix_loops = 2
name = "report-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-correctness"]

[[step]]
after_loop = "report-vote"
emits = "investigation"
executor = "revise-investigation"
expected_cost = 0.40
holds_tree = false
inputs = ["issue.latest.investigation", "report-vote.vote-record", "research.*", "issue.body"]
loop = true
name = "revise-investigation"
packet = ["contracts/{executor}.md"]
