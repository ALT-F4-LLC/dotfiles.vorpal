name: vorpal

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: bash tests/docket-commit-guard-hook.test.sh

      - run: bash tests/docket-run-guard-hook.test.sh

      - run: bash tests/docket-spawn-guard-hook.test.sh

      - run: bash tests/docket-trust-guard-hook.test.sh

      - run: bash tests/pr-skill.test.sh

      - run: bash tests/wave-chain-dead-ladder.test.sh

      - run: bash tests/wave-classifier-retry.test.sh

      - run: bash tests/wave-escalation-walk.test.sh

      - run: bash tests/wave-fix-round-ancestry.test.sh

      - run: bash tests/wave-issue-lanes.test.sh

      - run: bash tests/wave-orphaned-claim.test.sh

      - run: bash tests/wave-park-signals.test.sh

      - run: bash tests/wave-target-envelope.test.sh

      - run: bash tests/wave-usage-probe-overhead.test.sh

      - run: bash tests/wave-vote-retry-report.test.sh

      - run: bash tests/workflow-module-parse.test.sh

      - run: bash tests/workflow-sync.test.sh

      # The per-suite rows above exit 0 whenever no case fails, including if a
      # suite stopped running its cases at all. sdet-abuse re-runs the hook
      # suites behind a minimum-case floor, so a hollowed-out suite is caught.
      - run: .docket/bin/sdet-abuse

  # Skill drift against the engine repo is reported, not gated, and it lives in
  # its own job for two reasons: provisioning the second checkout is a condition
  # this repository's PRs cannot control, and the two copies are known to differ
  # today (upstream ships one SKILL.md; this repo splits it into SKILL.md plus
  # reference.md). A red row here would say nothing about the PR that ran it, so
  # `continue-on-error` keeps the drift visible in the log without blocking
  # merges. Reconcile the copies, then delete continue-on-error to make it gate.
  skill-sync:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The engine copy of the docket skill is what skill-sync diffs against;
      # without it the suite has nothing to compare. `main` is the engine's
      # default branch — the test's local fallback path points at a developer
      # worktree instead, so change both together (see the UPSTREAM default in
      # tests/docket-skill-sync.test.sh). If this step fails to read the repo,
      # set the DOCKET_UPSTREAM_TOKEN secret to a token that can.
      - uses: actions/checkout@v7
        with:
          path: .docket-upstream
          ref: main
          repository: ALT-F4-LLC/docket
          token: ${{ secrets.DOCKET_UPSTREAM_TOKEN || github.token }}

      - run: bash tests/docket-skill-sync.test.sh
        env:
          DOCKET_SKILL_UPSTREAM: ${{ github.workspace }}/.docket-upstream/skills/docket/SKILL.md

  build-dev:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ALT-F4-LLC/setup-vorpal-action@0.2.0
        with:
          registry-backend: "s3"
          registry-backend-s3-bucket: "altf4llc-vorpal-registry"
          version: "0.3.0"
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_DEFAULT_REGION: "${{ vars.AWS_DEFAULT_REGION }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"

      - run: vorpal build 'dev'

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.arch }}-${{ runner.os }}-vorpal-lock
          path: Vorpal.lock

  build:
    needs:
      - build-dev
    runs-on: macos-latest
    strategy:
      matrix:
        artifact:
          - user
    steps:
      - uses: actions/checkout@v7

      - uses: ALT-F4-LLC/setup-vorpal-action@0.2.0
        with:
          registry-backend: "s3"
          registry-backend-s3-bucket: "altf4llc-vorpal-registry"
          version: "0.3.0"
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_DEFAULT_REGION: "${{ vars.AWS_DEFAULT_REGION }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"

      - run: vorpal build '${{ matrix.artifact }}'
