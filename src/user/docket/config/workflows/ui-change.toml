[pipeline]
name = "ui-change"
version = 13
description = "UI change bound to an accepted ux-spec (cited in the issue body — no engine input form reaches a cross-issue doc, DKT-547), design-judged and design-QA'd in parallel with AC verification; the conductor integrates commits, the operator publishes."

[match]
labels_any = ["ui"]
unless_labels = [
  "docs-only",
  "investigation",
  "release",
  "retro",
  "security-change",
  "security-load-bearing",
  "spec-doc",
  "spec-project",
]

[limits]
"design-qa" = { max = 16, max_step_duration = "1h" }
"judge-architecture" = { max = 16, max_step_duration = "1h" }
"judge-correctness" = { max = 16, max_step_duration = "1h" }
"judge-design" = { max = 16, max_step_duration = "1h" }
"judge-simplicity" = { max = 16, max_step_duration = "1h" }
"judge-testing" = { max = 16, max_step_duration = "1h" }
"synthesize-findings" = { max = 16, max_step_duration = "1h" }
"verify-ac" = { max = 16, max_step_duration = "1h" }
"write" = { max = 16, max_step_duration = "2h" }

[[step]]
after = []
class = "write"
emits = "change-summary"
executor = "implement"
expected_cost = 1.50
gates = ["build", "tests", "self-hygiene", "secret-scan"]
inputs = ["issue.body"]
max_attempts = 2
name = "implement"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["implement"]
emits = "findings"
expected_cost = 0.60
fanout = ["judge-correctness", "judge-architecture", "judge-simplicity", "judge-testing", "judge-design"]
holds_tree = false
inputs = ["implement.change-summary", "issue.diff"]
name = "review"
packet = ["contracts/{executor}.md"]
payload = "findings@6"

[[step]]
after = ["review"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.60
holds_tree = false
inputs = ["review.*"]
name = "synthesize"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@1"

[[step]]
action = "aggregate"
after = ["synthesize"]
inputs = ["synthesize.findings"]
max_fix_loops = 2
name = "reconcile"
params = { field = "severity", method = "max", hold_spread = 2, output = "findings" }
payload = "findings@5"
threshold = { "fix-loop" = "any(severity >= blocker)" }

[[step]]
after_loop = "review"
class = "write"
emits = "change-summary"
executor = "fix"
expected_cost = 1.00
gates = ["build", "tests", "secret-scan"]
inputs = ["reconcile.findings", "implement.change-summary"]
loop = true
name = "fix"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["reconcile"]
emits = "ac-report"
executor = "verify-ac"
expected_cost = 0.50
gates = [{ name = "ac-commands", pre = true }]
holds_tree = false
inputs = ["issue.body", "issue.diff", "implement.change-summary"]
name = "verify"
packet = ["contracts/{executor}.md"]
payload = "ac-report@1"
threshold = { "fix-loop" = "any(status == unmet)", "verify-tribunal" = "any(status == unverifiable)" }

[[step]]
after = ["verify"]
inputs = ["verify.ac-report", "issue.body"]
name = "verify-tribunal"
on_fail = "waiting-human"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-correctness"]

[[step]]
after = ["reconcile"]
emits = "findings"
executor = "design-qa"
expected_cost = 0.50
gates = ["render-verify", "copy-verify"]
holds_tree = false
inputs = ["issue.body", "issue.diff", "implement.change-summary"]
name = "design-qa"
packet = ["contracts/{executor}.md"]
payload = "findings@6"
threshold = { "fix-loop" = "any(severity >= blocker)" }
