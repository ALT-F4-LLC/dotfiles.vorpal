[package]
edition = "2021"
name = "dotfiles"
version = "0.1.0"

[[bin]]
name = "vorpal"
path = "src/vorpal.rs"

[dependencies]
anyhow = "1"
indoc = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
tokio = { features = ["rt-multi-thread"], version = "1" }
toml = "1.1.2"
vorpal-artifacts = { git = "https://github.com/ALT-F4-LLC/artifacts.vorpal.git", branch = "main" }
vorpal-sdk = "0.4.0"
