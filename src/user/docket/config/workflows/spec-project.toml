[pipeline]
description = "Author the seven reserved project spec files in parallel, optionally grounded by a research step, review and reconcile the findings, drain any open highs, and accept by tribunal vote; a rejection re-enters the bounded revise loop at spec authoring and runs review again."
name = "spec-project"
version = 21  # 21: the pipeline description names the current graph: the
              #   revise loop re-enters at `revise-spec` (then review), and
              #   reconcile and drain-highs sit between review and the vote.
              #   No topology change.
              # 20: `route-direct`, `route-loop` and `route-tend` join unless_labels:
              #   an issue docket-groom routed to the operator's own session, the
              #   tend queue, or a loop matches zero workflows, like `blocked`,
              #   until the label changes; `route-run` stays bindable. No
              #   topology change.
              # 19: corpus-wide naming-convention pass (src/user/docket/config/README.md).
              #   Step renames only, no topology change: `synthesize` ->
              #   `synthesize-findings`, `revise` (the spec-author fanout's
              #   loop-back step) -> `revise-spec` (a loop-back step's name
              #   must differ from its first-pass step name `spec-author`),
              #   `accept` -> `spec-vote` (vote steps now uniformly named
              #   `<role>-vote`). Every `after`, threshold route key, and
              #   `<step>.<kind>` input reference updated to match.
              # 18: no behavior change — the version-17 note below is
              #   corrected in place; every step, seat, rule and route is
              #   byte-for-byte version 17's. The note said spec-doc's
              #   judge-panel rejections "looped without operator
              #   involvement", all of them. The store shows two judge-panel
              #   rejections on that track: one at 3-0 that looped with no
              #   operator involvement, and one at 2-1 (weighted 0.36) that
              #   hit the loop bound, parked waiting-human, and was resolved
              #   `fix-round` by the operator twelve minutes later. The
              #   mechanism claim, the loop bound as the human backstop,
              #   stands. A registered version's bytes are frozen, so the
              #   edited bytes are a new version.
              # 17: `accept` routes a rejection to `fix-loop` instead of
              #   `waiting-human`, as spec-doc's acceptance votes do, and
              #   `revise` reads `accept.vote-record` so the seven authors
              #   see the panel's reasoning. Not measured on this track: it
              #   has never been activated on any project on this machine
              #   (0 of 97 runs). The nearest measurement is spec-doc's,
              #   where the only tribunal rejection ever decided parked the
              #   run and the operator resolved `override-pass`, while of
              #   the two judge-panel rejections on the same track, one
              #   looped without operator involvement and the other hit the
              #   loop bound and was resolved `fix-round` by the operator.
              #   The human backstop moves rather than
              #   disappears: a rejected vote with `on_fail = "fix-loop"`
              #   enters the issue's loop, and when the next ordinal would
              #   exceed `max_fix_loops` (2, declared on `reconcile`; one
              #   counter per issue, shared with reconcile's blocker rounds)
              #   the engine parks the vote step waiting-human with a reason
              #   naming `docket step resolve --as fix-round`. Description
              #   no longer says "escalates to the operator".
              # 16: `blocked` joins unless_labels: a hold label so
              #   an issue not yet workable matches zero registered workflows
              #   until the label is removed.
              # 15: reconcile gains the `drain-highs` routing on
              #   `any(open_severity >= high)` plus the interposed executor
              #   step it names, which files each still-open high cluster
              #   (not held, not operator-resolved) as a `--gap-file` backlog
              #   issue at its completion; see ui-change@22 for the full
              #   trail. The `accept` tribunal does read reconcile.findings,
              #   but a vote-record is one decision about the specs, not a
              #   durable record of each open high — specs accepted with open
              #   highs standing evaporated them exactly as the change tracks
              #   did. `fix-loop` stays first and ThresholdOrder evaluates it
              #   first, so a round with any open blocker still loops; a
              #   round with nothing open at high or above routes `pass` with
              #   the drain step terminalized `skipped`, never claimed and
              #   never billed.
              # 14: review/reconcile repoint findings@8 -> findings@9 and
              #   synthesize repoints findings-cluster@1 -> findings-cluster@2
              #   — a citation-scrub pass rewrote both schemas' field
              #   descriptions to drop literal DKT/RUN/DOT-style provenance
              #   ids, which the engine refuses as an in-place edit to a
              #   frozen registration

[match]
labels_any = ["spec-project"]
unless_labels = ["blocked", "release", "retro", "route-direct", "route-loop", "route-tend"]

[limits]
"drain-highs" = { max = 16, max_step_duration = "1h" }
"judge-architecture" = { max = 16, max_step_duration = "1h" }
"judge-correctness" = { max = 16, max_step_duration = "1h" }
"judge-simplicity" = { max = 16, max_step_duration = "1h" }
"research" = { max = 16, max_step_duration = "1h" }
"synthesize-findings" = { max = 16, max_step_duration = "1h" }
"write" = { max = 16, max_step_duration = "2h" }

[[step]]
after = []
emits = "research-notes"
executor = "research"
expected_cost = 0.50
holds_tree = false
inputs = ["issue.body"]
name = "research"
packet = ["contracts/{executor}.md"]
when = "labels contains needs-research"

[[step]]
after = ["research"]
class = "write"
emits = "spec"
expected_cost = 1.00
fanout = [
  "spec-author-architecture",
  "spec-author-security",
  "spec-author-operations",
  "spec-author-performance",
  "spec-author-code-quality",
  "spec-author-review-strategy",
  "spec-author-testing",
]
gates = ["doc-validate", "reserved-name-check"]
inputs = ["research.*", "issue.body"]
max_attempts = 2
name = "spec-author"
on_fail = "waiting-human"
packet = ["contracts/spec-author.md"]

[[step]]
after = ["spec-author"]
emits = "findings"
expected_cost = 0.60
fanout = ["judge-architecture", "judge-correctness", "judge-simplicity"]
holds_tree = false
inputs = ["spec-author.*", "issue.body"]
name = "review"
packet = ["contracts/{executor}.md"]
payload = "findings@9"

[[step]]
after = ["review"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.60
holds_tree = false
inputs = ["review.*"]
name = "synthesize-findings"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@2"

[[step]]
action = "aggregate"
after = ["synthesize-findings"]
inputs = ["synthesize-findings.findings"]
max_fix_loops = 2
name = "reconcile"
params = { field = "severity", method = "max", hold_spread = 3, output = "findings" }
payload = "findings@9"
threshold = { "fix-loop" = "any(open_severity >= blocker)", "drain-highs" = "any(open_severity >= high)" }

[[step]]
after = ["reconcile"]
emits = "drain-report"
executor = "drain-highs"
expected_cost = 0.30
holds_tree = false
inputs = ["reconcile.findings", "issue.body"]
name = "drain-highs"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

# Loop body: attempts and failure routing are governed by reconcile's
# max_fix_loops, not a local max_attempts/on_fail pair.
[[step]]
after_loop = "review"
class = "write"
emits = "spec"
expected_cost = 0.70
fanout = [
  "spec-author-architecture",
  "spec-author-security",
  "spec-author-operations",
  "spec-author-performance",
  "spec-author-code-quality",
  "spec-author-review-strategy",
  "spec-author-testing",
]
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.spec", "spec-vote.vote-record", "research.*"]
loop = true
name = "revise-spec"
packet = ["contracts/spec-author.md"]

[[step]]
after = ["reconcile"]
inputs = ["spec-author.*", "reconcile.findings"]
name = "spec-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-correctness"]
