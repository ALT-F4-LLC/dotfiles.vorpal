[policy]
version = 37

[variants]
fable-high = { model = "fable", effort = "high" }
fable-low = { model = "fable", effort = "low", escalate_to = "fable-medium" }
fable-max = { model = "fable", effort = "max" }
fable-medium = { model = "fable", effort = "medium" }
fable-xhigh = { model = "fable", effort = "xhigh" }
opus-high = { model = "opus", effort = "high", escalate_to = "fable-high" }
opus-low = { model = "opus", effort = "low", escalate_to = "opus-high" }
opus-max = { model = "opus", effort = "max", escalate_to = "fable-max" }
opus-medium = { model = "opus", effort = "medium", escalate_to = "fable-medium" }
opus-xhigh  = { model = "opus", effort = "xhigh", escalate_to = "fable-xhigh" }
sonnet-high = { model = "sonnet", effort = "high", escalate_to = "opus-high" }
sonnet-low = { model = "sonnet", effort = "low", escalate_to = "sonnet-medium" }
sonnet-max = { model = "sonnet", effort = "max", escalate_to = "opus-max" }
sonnet-medium = { model = "sonnet", effort = "medium", escalate_to = "opus-medium" }
sonnet-xhigh = { model = "sonnet", effort = "xhigh", escalate_to = "opus-xhigh" }

[executors]
adr-author = { variant = "fable-low" }
design-qa = { variant = "opus-low" }
dispose = { variant = "opus-low" }
drain-highs = { variant = "sonnet-low" }
fix = { variant = "opus-low" }
implement = { variant = "opus-low" }
investigate = { variant = "fable-low" }
judge-architecture = { variant = "opus-low" }
judge-correctness = { variant = "opus-medium" }
judge-design = { variant = "opus-low" }
judge-security = { variant = "opus-low", never = ["fable"], reason = "security-classifier-reroute" }
judge-simplicity = { variant = "opus-medium" }
judge-testing = { variant = "sonnet-low" }
prd-author = { variant = "fable-low" }
report = { variant = "fable-low" }
research = { variant = "fable-low" }
revise-investigation = { variant = "fable-low" }
spec-author-architecture = { variant = "opus-low" }
spec-author-code-quality = { variant = "opus-low" }
spec-author-operations = { variant = "opus-low" }
spec-author-performance = { variant = "opus-low" }
spec-author-review-strategy = { variant = "opus-low" }
spec-author-security = { variant = "opus-low", never = ["fable"], reason = "security-classifier-reroute" }
spec-author-testing = { variant = "opus-low" }
synthesize-findings = { variant = "sonnet-low" }
tdd-author = { variant = "fable-low" }
tdd-author-security = { variant = "opus-low", never = ["fable"], reason = "security-classifier-reroute" }
threat-model = { variant = "opus-low", never = ["fable"], reason = "security-classifier-reroute" }
tribunal-architecture = { variant = "opus-low" }
tribunal-correctness = { variant = "opus-medium" }
tribunal-design = { variant = "fable-low" }
tribunal-security = { variant = "opus-low", never = ["fable"], reason = "security-classifier-reroute" }
ux-spec-author = { variant = "fable-low" }
verify-ac = { variant = "opus-medium" }

[security]
ceiling = "opus-max"
labels = ["security-change", "security-load-bearing", "security"]
never = ["fable"]
nodes = ["judge-security", "threat-model", "tdd-author-security", "spec-author-security", "tribunal-security"]
reason = "Fable's safety classifiers cover more categories than Opus 5's cyber-only set and flag security review by its nature; Claude Code then re-runs the request on the fallback model (cyber → Opus 4.8), so a Fable seat here pays Fable's rate for an Opus 4.8 run and the ledger credits a model that never ran. Name Opus up front. Residual: Opus 5 itself re-runs cyber-flagged requests on Opus 4.8 with nothing in the step record catching the hop — the wave records `model_resolved` as unknown unless the runtime supplies an observation, so the serving model surfaces only in the transcript-read usage back-fill, whose ledger rows carry units and quantities only."

[escalation]
on_failure = "one-hop"
on_round = "one-hop"
round_executors = ["fix", "dispose"]
fable_gates = [
  "failed-top-opus-round",
  "investigator-class",
  "novel-architecture",
]

[escalation.fallback]
fable-high = "opus-xhigh"
fable-low = "opus-medium"
fable-max = "opus-max"
fable-medium = "opus-high"
fable-xhigh = "opus-max"
