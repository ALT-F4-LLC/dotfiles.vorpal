[pipeline]
description = "Documentation change: implement with doc-validate and citation gates, one correctness judge, tribunal-filtered review and AC verification, and a bounded fix loop re-entering at review. The conductor integrates commits; the operator publishes. Design-heavy doc work routes through spec-doc first."
name = "docs-only"
version = 33

[match]
labels_any = ["docs-only"]
unless_labels = ["blocked", "investigation", "spec-doc", "spec-project", "release", "retro", "route-direct", "route-loop", "route-tend"]

[limits]
"judge-correctness" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"verify-ac" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"write" = { max = 16, lease_ttl = "2h", max_step_duration = "2h" }

[[step]]
after = []
class = "write"
emits = "change-summary"
executor = "implement"
expected_cost = 0.80
gates = ["diff-scope-docs", "self-hygiene", "doc-validate", "citation-check", "tests"]
inputs = []
max_attempts = 2
name = "implement"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["implement"]
emits = "findings"
executor = "judge-correctness"
expected_cost = 0.60
holds_tree = false
inputs = ["implement.change-summary", "issue.diff"]
max_attempts = 2
name = "review"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
payload = "findings@12"
threshold = { "review-vote" = "any(severity >= blocker)" }

[[step]]
after = ["review"]
inputs = ["review.findings", "issue.diff"]
name = "review-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-correctness"]

[[step]]
after_loop = "review"
class = "write"
emits = "change-summary"
executor = "fix"
expected_cost = 0.60
gates = ["diff-scope-docs", "self-hygiene", "doc-validate", "citation-check", "tests"]
inputs = ["review.findings", "implement.change-summary", "issue.latest.change-summary", "issue.latest.ac-report", "review-vote.vote-record", "verify-ac-vote.vote-record"]
loop = true
name = "fix"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["review"]
emits = "ac-report"
executor = "verify-ac"
expected_cost = 0.40
gates = [{ name = "ac-commands", pre = true }]
holds_tree = false
inputs = ["issue.diff", "implement.change-summary", "implement.gate-results", "verify-ac.gate-results"]
max_attempts = 2
max_fix_loops = 2
name = "verify-ac"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
payload = "ac-report@2"
threshold = { "fix-loop" = "any(status == unmet)", "verify-ac-vote" = "any(status != met)" }

[[step]]
after = ["verify-ac"]
inputs = ["verify-ac.ac-report", "issue.body", "issue.diff"]
name = "verify-ac-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-correctness"]
