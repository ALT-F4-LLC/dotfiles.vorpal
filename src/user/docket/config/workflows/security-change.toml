[pipeline]
description = "Security-track change: threat model first, security judge, abuse-case gate, vote-gated acceptance."
name = "security-change"
version = 50

[match]
labels_any = ["security-change", "security-load-bearing", "security"]
unless_labels = [
  "blocked",
  "docs-only",
  "investigation",
  "release",
  "retro",
  "route-direct",
  "route-loop",
  "route-tend",
  "spec-doc",
  "spec-project",
]

[limits]
"drain-highs" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-architecture" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-correctness" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-security" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-testing" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"synthesize-findings" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"threat-model" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"verify-ac" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"write" = { max = 16, lease_ttl = "2h", max_step_duration = "2h" }

[[step]]
after = []
emits = "threat-model"
executor = "threat-model"
expected_cost = 0.80
holds_tree = false
inputs = []
max_attempts = 2
name = "threat-model"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["threat-model"]
class = "write"
emits = "change-summary"
executor = "implement"
expected_cost = 1.50
gates = ["build", "tests", "self-hygiene", "secret-scan", "vuln-scan", "sdet-abuse", "doc-validate"]
inputs = ["threat-model.threat-model"]
max_attempts = 2
name = "implement"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["implement"]
emits = "findings"
expected_cost = 0.60
fanout = ["judge-correctness", "judge-architecture", "judge-testing", "judge-security"]
holds_tree = false
inputs = ["implement.change-summary", "threat-model.threat-model", "issue.diff"]
name = "review"
packet = ["contracts/{executor}.md"]
payload = "findings@12"

[[step]]
after = ["review"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.60
holds_tree = false
inputs = ["review.*"]
max_attempts = 2
name = "synthesize-findings"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@5"

[[step]]
action = "aggregate"
after = ["synthesize-findings"]
inputs = ["synthesize-findings.findings"]
max_fix_loops = 2
name = "reconcile"
params = { field = "severity", method = "max", hold_spread = 3, output = "findings" }
payload = "findings@13"
# First-match, declared order: an open blocker always gets a fix round before
# the panel sees the change. v42 restores this route ahead of the vote,
# matching every other track, after v23 had removed it and left the two-seat
# vote as a blocker's only exit, letting two approvals pass a blocker to
# drain-highs.
threshold = { "fix-loop" = "any(open_severity >= blocker)", "security-vote" = "any(open_severity >= high)" }

[[step]]
name = "fix"
executor = "fix"
class = "write"
emits = "change-summary"
packet = ["contracts/{executor}.md"]
expected_cost = 1.00
loop = true
inputs = ["reconcile.findings", "synthesize-findings.findings", "implement.change-summary", "issue.latest.change-summary", "threat-model.threat-model", "issue.latest.ac-report", "security-vote.vote-record", "verify-ac-vote.vote-record"]
gates = ["build", "tests", "self-hygiene", "secret-scan", "vuln-scan", "sdet-abuse", "doc-validate"]
after_loop = "review"

[[step]]
after = ["reconcile"]
inputs = ["reconcile.findings", "issue.diff"]
name = "security-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "security-acceptance"
# Deliberately judge-*, not tribunal-*: this is the security-acceptance panel,
# not the operator-stand-in tribunal, and the two seat families are routed
# separately in policy.toml even where their current tiers coincide. As
# voters these seats are briefed by the workflow scripts' LENSES table, not
# by contracts/judge-*.md — one name, two remits. Two seats: under the 0.67
# security-acceptance rule a lone reject of two scores about 0.5 and rejects,
# so a single dissent decides, which a three-seat 2-1 tally never reliably did.
voters = ["judge-security", "judge-correctness"]

[[step]]
after = ["security-vote"]
after_fired = ["security-vote"]
emits = "drain-report"
executor = "drain-highs"
expected_cost = 0.30
holds_tree = false
inputs = ["reconcile.findings"]
max_attempts = 2
name = "drain-highs"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["reconcile"]
emits = "ac-report"
executor = "verify-ac"
expected_cost = 0.50
gates = [{ name = "ac-commands", pre = true }]
holds_tree = false
inputs = ["issue.diff", "implement.change-summary", "implement.gate-results", "verify-ac.gate-results"]
max_attempts = 2
name = "verify-ac"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
payload = "ac-report@2"
threshold = { "fix-loop" = "any(status == unmet)", "verify-ac-vote" = "any(status != met)" }

[[step]]
after = ["verify-ac"]
inputs = ["verify-ac.ac-report", "issue.body", "issue.diff"]
name = "verify-ac-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-correctness"]
