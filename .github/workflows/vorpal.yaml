name: vorpal

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: bash tests/ci-suite-wiring.test.sh

      - run: bash tests/commit-skill-attribution.test.sh

      - run: bash tests/contract-cluster-keys.test.sh

      - run: bash tests/contract-corpus.test.sh

      - run: bash tests/contract-includes.test.sh

      - run: bash tests/crossref-check.test.sh

      - run: bash tests/doc-validate.test.sh

      - run: bash tests/docket-cli-inventory.test.sh

      - run: bash tests/docket-evaluations.test.sh

      - run: bash tests/docket-commit-guard-hook.test.sh

      - run: bash tests/docket-run-guard-hook.test.sh

      - run: bash tests/docket-run-skill.test.sh

      - run: bash tests/docket-spawn-guard-hook.test.sh

      - run: bash tests/docket-trust-guard-hook.test.sh

      - run: bash tests/frozen-drift-check.test.sh

      - run: bash tests/mutant-rule-crossref.test.sh

      - run: bash tests/pr-skill.test.sh

      - run: bash tests/sandbox-bypass-guard-hook.test.sh

      - run: bash tests/sandbox-friction-hook.test.sh

      - run: bash tests/sdet-abuse.test.sh

      - run: bash tests/sensitive-path-guard-hook.test.sh

      - run: bash tests/tribunal-seat-brief.test.sh

      - run: bash tests/wave-agent-budget.test.sh

      - run: bash tests/wave-bootstrap-render.test.sh

      - run: bash tests/wave-chain-dead-ladder.test.sh

      - run: bash tests/wave-classifier-retry.test.sh

      - run: bash tests/wave-fix-round-ancestry.test.sh

      - run: bash tests/wave-issue-lanes.test.sh

      - run: bash tests/wave-model-attribution.test.sh

      - run: bash tests/wave-orphaned-claim.test.sh

      - run: bash tests/wave-park-signals.test.sh

      - run: bash tests/wave-target-envelope.test.sh

      - run: bash tests/wave-usage-probe-overhead.test.sh

      - run: bash tests/wave-vote-retry-report.test.sh

      - run: bash tests/workflow-module-parse.test.sh

      # The per-suite rows above exit 0 whenever no case fails, including if a
      # suite stopped running its cases at all. sdet-abuse re-runs the hook
      # suites behind a minimum-case floor, so a hollowed-out suite is caught.
      - run: .docket/bin/sdet-abuse

  build-dev:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ALT-F4-LLC/setup-vorpal-action@0.2.0
        with:
          registry-backend: "s3"
          registry-backend-s3-bucket: "altf4llc-vorpal-registry"
          version: "0.3.0"
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_DEFAULT_REGION: "${{ vars.AWS_DEFAULT_REGION }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"

      - run: vorpal build 'dev'

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.arch }}-${{ runner.os }}-vorpal-lock
          path: Vorpal.lock

  build:
    needs:
      - build-dev
    runs-on: macos-latest
    strategy:
      matrix:
        artifact:
          - user
    steps:
      - uses: actions/checkout@v7

      - uses: ALT-F4-LLC/setup-vorpal-action@0.2.0
        with:
          registry-backend: "s3"
          registry-backend-s3-bucket: "altf4llc-vorpal-registry"
          version: "0.3.0"
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_DEFAULT_REGION: "${{ vars.AWS_DEFAULT_REGION }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"

      - run: vorpal build '${{ matrix.artifact }}'
