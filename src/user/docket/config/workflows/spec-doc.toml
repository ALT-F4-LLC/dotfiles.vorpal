[pipeline]
description = "Author a PRD/TDD/ADR/ux-spec, optionally grounded by a research step, validate, review, and accept by vote: the doc-acceptance panel (TDD/ADR) or the tribunal (PRD/ux-spec), escalating to the operator."
name = "spec-doc"
version = 20

[match]
labels_any = ["spec-doc"]
unless_labels = ["spec-project", "release", "retro"]

[limits]
"judge-architecture" = { max = 16, max_step_duration = "1h" }
"judge-design" = { max = 16, max_step_duration = "1h" }
"judge-security" = { max = 16, max_step_duration = "1h" }
"research" = { max = 16, max_step_duration = "1h" }
"synthesize-findings" = { max = 16, max_step_duration = "1h" }
"write" = { max = 16, max_step_duration = "2h" }

[[step]]
after = []
emits = "research-notes"
executor = "research"
expected_cost = 0.50
holds_tree = false
inputs = ["issue.body"]
name = "research"
packet = ["contracts/{executor}.md"]
when = "labels contains needs-research"

[[step]]
after = ["research"]
class = "write"
emits = "doc"
executor = "tdd-author-security"
expected_cost = 1.20
gates = ["doc-validate", "tdd-preflight", "reserved-name-check"]
inputs = ["research.*", "issue.body"]
max_attempts = 2
name = "author-tdd-security"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels contains security-change"

[[step]]
after = ["research"]
class = "write"
emits = "doc"
executor = "tdd-author-security"
expected_cost = 1.20
gates = ["doc-validate", "tdd-preflight", "reserved-name-check"]
inputs = ["research.*", "issue.body"]
max_attempts = 2
name = "author-tdd-security-alt"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels contains security and labels != security-change"

[[step]]
after = ["research"]
class = "write"
emits = "doc"
executor = "tdd-author"
expected_cost = 1.20
gates = ["doc-validate", "tdd-preflight", "reserved-name-check"]
inputs = ["research.*", "issue.body"]
max_attempts = 2
name = "author-tdd"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels != security-change and labels != security"

[[step]]
after = ["research"]
class = "write"
emits = "doc"
executor = "adr-author"
expected_cost = 1.20
gates = ["doc-validate", "reserved-name-check"]
inputs = ["research.*", "issue.body"]
max_attempts = 2
name = "author-adr"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:adr and labels != doc:tdd"

[[step]]
after = ["research"]
class = "write"
emits = "doc"
executor = "ux-spec-author"
expected_cost = 1.20
gates = ["doc-validate", "reserved-name-check"]
inputs = ["research.*", "issue.body"]
max_attempts = 2
name = "author-ux-spec"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:ux-spec and labels != doc:tdd and labels != doc:adr"

[[step]]
after = ["research"]
class = "write"
emits = "doc"
executor = "prd-author"
expected_cost = 1.20
gates = ["doc-validate", "reserved-name-check"]
inputs = ["research.*", "issue.body"]
max_attempts = 2
name = "author-prd"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels != doc:tdd and labels != doc:adr and labels != doc:ux-spec"

[[step]]
after = ["author-tdd-security", "author-tdd-security-alt", "author-tdd", "author-adr", "author-ux-spec", "author-prd"]
emits = "findings"
expected_cost = 0.60
fanout = ["judge-architecture", "judge-security", "judge-design"]
holds_tree = false
inputs = ["issue.latest.doc", "issue.body"]
name = "review"
packet = ["contracts/{executor}.md"]
payload = "findings@9"

[[step]]
after = ["review"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.60
holds_tree = false
inputs = ["review.*"]
name = "synthesize"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@2"

[[step]]
action = "aggregate"
after = ["synthesize"]
inputs = ["synthesize.findings"]
max_fix_loops = 2
name = "reconcile"
params = { field = "severity", method = "max", hold_spread = 3, output = "findings" }
payload = "findings@9"
threshold = { "fix-loop" = "any(open_severity >= blocker)" }

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "tdd-author-security"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc", "accept-vote-tdd.vote-record", "research.*"]
loop = true
name = "revise-tdd-security"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels contains security-change"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "tdd-author-security"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc", "accept-vote-tdd.vote-record", "research.*"]
loop = true
name = "revise-tdd-security-alt"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels contains security and labels != security-change"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "tdd-author"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc", "accept-vote-tdd.vote-record", "research.*"]
loop = true
name = "revise-tdd"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels != security-change and labels != security"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "adr-author"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc", "accept-vote-adr.vote-record", "research.*"]
loop = true
name = "revise-adr"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:adr and labels != doc:tdd"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "ux-spec-author"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc", "research.*"]
loop = true
name = "revise-ux-spec"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:ux-spec and labels != doc:tdd and labels != doc:adr"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "prd-author"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc", "research.*"]
loop = true
name = "revise-prd"
packet = ["contracts/{executor}.md"]
when = "labels != doc:tdd and labels != doc:adr and labels != doc:ux-spec"

[[step]]
after = ["reconcile"]
inputs = ["issue.latest.doc", "reconcile.findings"]
name = "accept-vote-tdd"
on_fail = "fix-loop"
type = "vote"
vote_rule = "doc-acceptance"
# Deliberately judge-*, not tribunal-*: doc-acceptance is the judges' own
# panel, not the operator-stand-in tribunal (`accept-human` below), and
# policy.toml routes the two seat families to different tiers (judge-*
# opus-high, tribunal-* fable/opus-xhigh). As voters these seats are briefed
# by the workflow scripts' LENSES table, not by contracts/judge-*.md — one
# name, two remits (DOT-792).
voters = ["judge-architecture", "judge-security", "judge-correctness"]
when = "labels contains doc:tdd"

[[step]]
after = ["reconcile"]
inputs = ["issue.latest.doc", "reconcile.findings"]
name = "accept-vote-adr"
on_fail = "fix-loop"
type = "vote"
vote_rule = "doc-acceptance"
# judge-*, deliberately — see accept-vote-tdd (DOT-792).
voters = ["judge-architecture", "judge-security", "judge-correctness"]
when = "labels contains doc:adr and labels != doc:tdd"

[[step]]
after = ["reconcile"]
inputs = ["issue.latest.doc", "reconcile.findings"]
name = "accept-human"
on_fail = "waiting-human"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-design"]
when = "labels != doc:tdd and labels != doc:adr"

[[step]]
action = "doc-record"
after = ["accept-vote-tdd", "accept-vote-adr", "accept-human"]
expected_cost = 0.20
gates = ["citation-check"]
inputs = ["issue.latest.doc"]
name = "record"
params = { output = "doc-record" }
