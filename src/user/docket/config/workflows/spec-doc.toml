[pipeline]
description = "Author a PRD/TDD/ADR/ux-spec, validate, review, and accept by vote: the doc-acceptance panel (TDD/ADR) or the tribunal (PRD/ux-spec), escalating to the operator."
name = "spec-doc"
version = 14

[match]
labels_any = ["spec-doc"]
unless_labels = ["spec-project", "release", "retro"]

[limits]
"judge-architecture" = { max = 16, max_step_duration = "1h" }
"judge-design" = { max = 16, max_step_duration = "1h" }
"judge-security" = { max = 16, max_step_duration = "1h" }
"synthesize-findings" = { max = 16, max_step_duration = "1h" }
"write" = { max = 16, max_step_duration = "2h" }

[[step]]
after = []
class = "write"
emits = "doc"
executor = "tdd-author-security"
expected_cost = 1.20
gates = ["doc-validate", "tdd-preflight", "reserved-name-check"]
inputs = ["issue.body"]
max_attempts = 2
name = "author-tdd-security"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels contains security-change"

[[step]]
after = []
class = "write"
emits = "doc"
executor = "tdd-author-security"
expected_cost = 1.20
gates = ["doc-validate", "tdd-preflight", "reserved-name-check"]
inputs = ["issue.body"]
max_attempts = 2
name = "author-tdd-security-alt"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels contains security and labels != security-change"

[[step]]
after = []
class = "write"
emits = "doc"
executor = "tdd-author"
expected_cost = 1.20
gates = ["doc-validate", "tdd-preflight", "reserved-name-check"]
inputs = ["issue.body"]
max_attempts = 2
name = "author-tdd"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels != security-change and labels != security"

[[step]]
after = []
class = "write"
emits = "doc"
executor = "adr-author"
expected_cost = 1.20
gates = ["doc-validate", "reserved-name-check"]
inputs = ["issue.body"]
max_attempts = 2
name = "author-adr"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:adr and labels != doc:tdd"

[[step]]
after = []
class = "write"
emits = "doc"
executor = "ux-spec-author"
expected_cost = 1.20
gates = ["doc-validate", "reserved-name-check"]
inputs = ["issue.body"]
max_attempts = 2
name = "author-ux-spec"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:ux-spec and labels != doc:tdd and labels != doc:adr"

[[step]]
after = []
class = "write"
emits = "doc"
executor = "prd-author"
expected_cost = 1.20
gates = ["doc-validate", "reserved-name-check"]
inputs = ["issue.body"]
max_attempts = 2
name = "author-prd"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels != doc:tdd and labels != doc:adr and labels != doc:ux-spec"

[[step]]
after = ["author-tdd-security", "author-tdd-security-alt", "author-tdd", "author-adr", "author-ux-spec", "author-prd"]
emits = "findings"
expected_cost = 0.60
fanout = ["judge-architecture", "judge-security", "judge-design"]
holds_tree = false
inputs = ["author-tdd-security.doc", "author-tdd-security-alt.doc", "author-tdd.doc", "author-adr.doc", "author-ux-spec.doc", "author-prd.doc", "issue.body"]
name = "review"
packet = ["contracts/{executor}.md"]
payload = "findings@6"

[[step]]
after = ["review"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.60
holds_tree = false
inputs = ["review.*"]
name = "synthesize"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@1"

[[step]]
action = "aggregate"
after = ["synthesize"]
inputs = ["synthesize.findings"]
max_fix_loops = 2
name = "reconcile"
params = { field = "severity", method = "max", hold_spread = 2, output = "findings" }
payload = "findings@7"
threshold = { "fix-loop" = "any(open_severity >= high)" }

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "tdd-author-security"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc"]
loop = true
name = "revise-tdd-security"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels contains security-change"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "tdd-author-security"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc"]
loop = true
name = "revise-tdd-security-alt"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels contains security and labels != security-change"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "tdd-author"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc"]
loop = true
name = "revise-tdd"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels != security-change and labels != security"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "adr-author"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc"]
loop = true
name = "revise-adr"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:adr and labels != doc:tdd"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "ux-spec-author"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc"]
loop = true
name = "revise-ux-spec"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:ux-spec and labels != doc:tdd and labels != doc:adr"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "prd-author"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc"]
loop = true
name = "revise-prd"
packet = ["contracts/{executor}.md"]
when = "labels != doc:tdd and labels != doc:adr and labels != doc:ux-spec"

[[step]]
after = ["reconcile"]
inputs = ["author-tdd-security.doc", "author-tdd-security-alt.doc", "author-tdd.doc", "reconcile.findings"]
name = "accept-vote-tdd"
on_fail = "fix-loop"
type = "vote"
vote_rule = "doc-acceptance"
voters = ["judge-architecture", "judge-security", "judge-correctness"]
when = "labels contains doc:tdd"

[[step]]
after = ["reconcile"]
inputs = ["author-adr.doc", "reconcile.findings"]
name = "accept-vote-adr"
on_fail = "fix-loop"
type = "vote"
vote_rule = "doc-acceptance"
voters = ["judge-architecture", "judge-security", "judge-correctness"]
when = "labels contains doc:adr and labels != doc:tdd"

[[step]]
after = ["reconcile"]
inputs = ["author-prd.doc", "author-ux-spec.doc", "reconcile.findings"]
name = "accept-human"
on_fail = "waiting-human"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-design"]
when = "labels != doc:tdd and labels != doc:adr"

[[step]]
action = "doc-record"
after = ["accept-vote-tdd", "accept-vote-adr", "accept-human"]
expected_cost = 0.20
gates = ["citation-check"]
inputs = ["author-tdd-security.doc", "author-tdd-security-alt.doc", "author-tdd.doc", "author-adr.doc", "author-ux-spec.doc", "author-prd.doc"]
name = "record"
params = { output = "doc-record" }
