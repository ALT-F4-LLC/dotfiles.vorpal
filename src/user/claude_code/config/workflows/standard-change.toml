# standard-change — the baseline pipeline (05 §1).
# Ported from 05 §1's TOML, which is the design authority for this file.
# Engine-supplied semantics are never restated per pipeline: readiness, leases,
# attempts, artifact recording, context assembly, event logging (02 §5, §8).
# A pipeline author writes topology and thresholds only (05 §1).
# `issue.diff` is the engine-provided virtual artifact — referenced, never emitted.
# Requires `findings@1` registered first: `reconcile` declares it, and the ordered
# `any(severity >= high)` compiles only because that schema declares severity's
# order (06 §11.2, V21c/V29).

[pipeline]
name    = "standard-change"
version = 2                  # v2 (2026-08-06): commit-exec action restored — v1
                             #   ended at commit-author's MESSAGE with nothing
                             #   performing the commit; RUN-1 completed with an
                             #   approved message and a dirty tree. NOTE: bumping
                             #   in a repo where v1 is registered trips the known
                             #   engine defect (old [match] stays live and the
                             #   activation refuses on 2 candidates) — verify
                             #   against a real activation, and file it rather
                             #   than renaming the pipeline.
description = "Implement, review, reconcile, verify, and commit one ordinary change."

[match]                      # binding rule, evaluated at run activation (02 §1.2)
                             # EXACTLY ONE workflow may match an issue (06 §11.1), so
                             # this baseline must exclude every label that binds a
                             # variant. 05 §1's four exclusions cover the four
                             # variants that existed as labels in its own prose; the
                             # remaining four bind on labels only because Docket's
                             # issue kinds are a closed set (see the variants' [match]
                             # notes), so they are excluded here too. DKT filed.
kind   = ["task", "feature", "bug", "chore"]
unless_labels = [
  "security-load-bearing", "ui", "docs-only", "investigation",
  "spec-doc", "spec-project", "release", "retro",
]

[[step]]
name = "implement"
executor = "implement"       # label-keyed resolution to `test-infra` on
                             #   test-infra-labeled issues is a policy-side
                             #   concern (05 §1); the hint stays opaque here
class = "write"
emits = "change-summary"
packet = ["contracts/{executor}.md"]
expected_cost = 1.50
gates = ["build", "tests", "self-hygiene", "secret-scan"]
                                     # `scope` removed: gates get no issue
                                     #   identity, so scope containment is
                                     #   un-mechanized (DKT-84)
max_attempts = 2
on_fail = "waiting-human"

[[step]]
name = "review"
holds_tree = false            # reads the tree, never writes it: exempt from scope
                             #   exclusion so this step coexists with other issues'
                             #   steps instead of serialising against them
after = ["implement"]
fanout = ["judge-correctness", "judge-architecture", "judge-simplicity", "judge-testing"]
emits = "findings"
packet = ["contracts/{executor}.md"]
payload = "findings@1"               # validates at the JUDGE boundary: each judge
                                     #   emits a scalar `severity`, so a malformed
                                     #   payload fails its own sibling's `complete`
                                     #   with per-judge attribution, rather than
                                     #   surfacing later as a reconcile-time error.
                                     #   NOT declared on `synthesize`: that step's
                                     #   multi-member clusters carry member
                                     #   severities IN the `severity` field as an
                                     #   array (engine `clusterMembers`), which this
                                     #   schema's property-level enum would refuse
expected_cost = 0.60                 # per expanded sibling
inputs = ["implement.change-summary", "issue.diff"]

[[step]]
name = "synthesize"
holds_tree = false            # reads the tree, never writes it: exempt from scope
                             #   exclusion so this step coexists with other issues'
                             #   steps instead of serialising against them
after = ["review"]
executor = "synthesize-findings"
emits = "findings"
packet = ["contracts/{executor}.md"]
expected_cost = 0.40
inputs = ["review.*"]

[[step]]                     # deterministic: an action, no node
name = "reconcile"
after = ["synthesize"]
action = "aggregate"                 # builtin (06 §2); held clusters materialize
params = { field = "severity", method = "median", hold_spread = 2, output = "findings" }
                                     #   a `reconcile-held` human step — the
                                     #   fleet's reconciliation is parameters,
                                     #   not code
inputs = ["synthesize.findings"]     # the clusters the builtin reduces (DKT-28,
                                     #   V31: required non-empty)
payload = "findings@1"               # severity's declared order (V29)
threshold = { "fix-loop" = "any(severity >= high)" }   # no match -> pass (06 §11.2)
max_fix_loops = 2                    # loops exhausted -> waiting-human (06 §11.3)

[[step]]
name = "fix"
executor = "fix"
class = "write"
emits = "change-summary"
packet = ["contracts/{executor}.md"]
expected_cost = 1.00
loop = true                          # instantiated per fix-loop entry (06 §11.3)
inputs = ["reconcile.findings", "implement.change-summary"]
gates = ["build", "tests", "secret-scan"]
after_loop = "review"                # re-review the delta; engine re-enters at review

[[step]]
name = "verify"
holds_tree = false            # reads the tree, never writes it: exempt from scope
                             #   exclusion so this step coexists with other issues'
                             #   steps instead of serialising against them
after = ["reconcile"]
executor = "verify-ac"
emits = "ac-report"
packet = ["contracts/{executor}.md"]
payload = "ac-report@1"              # status is a plain enum: the thresholds below
                                     #   are equality, which needs no declared order
expected_cost = 0.50
gates = [{ name = "ac-commands", pre = true }]   # pre-gate: runs at claim, results
                                     #   land in the context bundle (02 §6)
inputs = ["issue.body", "issue.diff", "implement.change-summary"]
threshold = { "fix-loop" = "any(status == unmet)", "waiting-human" = "any(status == unverifiable)" }

[[step]]
name = "commit-gate"
after = ["verify"]
type = "human"                       # human:commit-authorized (03 §5, §6)
on_fail = "fix-loop"                 # reject routes to rework; explicit on_fail is
                                     #   required on human steps and waiting-human
                                     #   is invalid there (V13/V13a)

[[step]]
name = "commit"
after = ["commit-gate"]
executor = "commit-author"
emits = "commit-message"             # aligned to 04 §2 (M2b batch 4)
packet = ["contracts/{executor}.md"]
expected_cost = 0.10
gates = ["commit-msg"]               # the old commit-exec GATE's checks fold
                                     #   into commit-msg; a gate is argv-only
                                     #   and cannot be handed run state (DKT-84).
                                     #   Its EXECUTION half is the action below —
                                     #   retiring the gate without it left the
                                     #   pipeline unable to commit (RUN-1).

[[step]]                     # deterministic: an action, no node (see doc-record)
name = "commit-exec"
after = ["commit"]
action = "commit-exec"               # trusted action, engine-run, never claimed:
                                     #   stages ONLY paths under the issue's
                                     #   scope globs, commits with commit-author's
                                     #   message verbatim (git commit -F -), and
                                     #   replies with the new HEAD sha. The
                                     #   commit-author contract's "execution is
                                     #   gated and happens without you" refers to
                                     #   THIS step. Bootstrap §4a′ proposes its
                                     #   trust entry; the script lives at
                                     #   .docket/bin/commit-exec in the repo.
params = { output = "commit-record" }
inputs = ["commit.commit-message", "issue.body"]
expected_cost = 0.05
