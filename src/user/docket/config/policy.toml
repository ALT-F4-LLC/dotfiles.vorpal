# at sonnet-medium ran a median 2.7 min; D2 places Sonnet 5 low on "chat and
# non-coding use cases". One retry lands on today's sonnet-medium.
# Retro: median against 2.7 min.
drain-highs = { variant = "sonnet-low" }
# fable-low (policy 29), from fable-high, for wall-clock and more incremental
