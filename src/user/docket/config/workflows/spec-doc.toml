[pipeline]
description = "Author a PRD/TDD/ADR/ux-spec, optionally grounded by research, then validate, review, and vote to accept: the doc-acceptance panel for TDD/ADR, the tribunal for PRD/ux-spec. A rejection re-enters the doctype's revise step, then review, up to the loop bound."
name = "spec-doc"
version = 41

[match]
labels_any = ["spec-doc"]
unless_labels = ["blocked", "spec-project", "release", "retro", "route-direct", "route-loop", "route-tend"]

[limits]
"drain-highs" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-architecture" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-design" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-security" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"research" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"synthesize-findings" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"write" = { max = 16, lease_ttl = "2h", max_step_duration = "2h" }

[[step]]
after = []
emits = "research-notes"
executor = "research"
expected_cost = 0.50
holds_tree = false
inputs = []
name = "research"
packet = ["contracts/{executor}.md"]
payload = "research-notes@2"
when = "labels contains needs-research"

[[step]]
after = ["research"]
class = "write"
emits = "doc"
executor = "tdd-author-security"
expected_cost = 1.20
gates = ["doc-validate", "tdd-preflight", "reserved-name-check"]
inputs = ["research.*"]
max_attempts = 2
name = "tdd-author-security"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels contains_any [security-change, security-load-bearing, security]"

[[step]]
after = ["research"]
class = "write"
emits = "doc"
executor = "tdd-author"
expected_cost = 1.20
gates = ["doc-validate", "tdd-preflight", "reserved-name-check"]
inputs = ["research.*"]
max_attempts = 2
name = "tdd-author"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels != security-change and labels != security and labels != security-load-bearing"

[[step]]
after = ["research"]
class = "write"
emits = "doc"
executor = "adr-author"
expected_cost = 1.20
gates = ["doc-validate", "reserved-name-check"]
inputs = ["research.*"]
max_attempts = 2
name = "adr-author"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:adr and labels != doc:tdd"

[[step]]
after = ["research"]
class = "write"
emits = "doc"
executor = "ux-spec-author"
expected_cost = 1.20
gates = ["doc-validate", "reserved-name-check"]
inputs = ["research.*"]
max_attempts = 2
name = "ux-spec-author"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:ux-spec and labels != doc:tdd and labels != doc:adr"

[[step]]
after = ["research"]
class = "write"
emits = "doc"
executor = "prd-author"
expected_cost = 1.20
gates = ["doc-validate", "reserved-name-check"]
inputs = ["research.*"]
max_attempts = 2
name = "prd-author"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
when = "labels != doc:tdd and labels != doc:adr and labels != doc:ux-spec"

[[step]]
after = ["tdd-author-security", "tdd-author", "adr-author", "ux-spec-author", "prd-author"]
emits = "findings"
expected_cost = 0.60
fanout = ["judge-architecture", "judge-security", "judge-design"]
holds_tree = false
inputs = ["issue.latest.doc"]
name = "review"
packet = ["contracts/{executor}.md"]
payload = "findings@12"

[[step]]
after = ["review"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.60
holds_tree = false
inputs = ["review.*"]
name = "synthesize-findings"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@5"

[[step]]
action = "aggregate"
after = ["synthesize-findings"]
inputs = ["synthesize-findings.findings"]
max_fix_loops = 2
name = "reconcile"
params = { field = "severity", method = "max", hold_spread = 3, output = "findings" }
payload = "findings@13"
threshold = { "fix-loop" = "any(open_severity >= blocker)", "drain-highs" = "any(open_severity >= high)" }

[[step]]
after = ["reconcile"]
emits = "drain-report"
executor = "drain-highs"
expected_cost = 0.30
holds_tree = false
inputs = ["reconcile.findings"]
name = "drain-highs"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "tdd-author-security"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc", "tdd-vote.vote-record", "research.*"]
loop = true
name = "revise-tdd-security"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels contains_any [security-change, security-load-bearing, security]"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "tdd-author"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc", "tdd-vote.vote-record", "research.*"]
loop = true
name = "revise-tdd"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:tdd and labels != security-change and labels != security and labels != security-load-bearing"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "adr-author"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc", "adr-vote.vote-record", "research.*"]
loop = true
name = "revise-adr"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:adr and labels != doc:tdd"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "ux-spec-author"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc", "ux-spec-vote.vote-record", "research.*"]
loop = true
name = "revise-ux-spec"
packet = ["contracts/{executor}.md"]
when = "labels contains doc:ux-spec and labels != doc:tdd and labels != doc:adr"

[[step]]
after_loop = "review"
class = "write"
emits = "doc"
executor = "prd-author"
expected_cost = 1.50
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.doc", "prd-vote.vote-record", "research.*"]
loop = true
name = "revise-prd"
packet = ["contracts/{executor}.md"]
when = "labels != doc:tdd and labels != doc:adr and labels != doc:ux-spec"

[[step]]
after = ["reconcile"]
inputs = ["issue.latest.doc", "reconcile.findings"]
name = "tdd-vote"
on_fail = "fix-loop"
threshold = { "fix-loop" = "count>=1(vote == reject)" }
type = "vote"
vote_rule = "doc-acceptance"
# Deliberately judge-*, not tribunal-*: doc-acceptance is the judges' own
# panel, not the operator-stand-in tribunal (`ux-spec-vote`/`prd-vote` below), and
# the two seat families are routed separately in policy.toml even where
# their current tiers coincide. As voters these seats are briefed
# by the workflow scripts' LENSES table, not by contracts/judge-*.md — one
# name, two remits.
voters = ["judge-architecture", "judge-security", "judge-correctness"]
when = "labels contains doc:tdd"

[[step]]
after = ["reconcile"]
inputs = ["issue.latest.doc", "reconcile.findings"]
name = "adr-vote"
on_fail = "fix-loop"
threshold = { "fix-loop" = "count>=1(vote == reject)" }
type = "vote"
vote_rule = "doc-acceptance"
# judge-*, deliberately — see tdd-vote above.
voters = ["judge-architecture", "judge-security", "judge-correctness"]
when = "labels contains doc:adr and labels != doc:tdd"

[[step]]
after = ["reconcile"]
inputs = ["issue.latest.doc", "reconcile.findings"]
name = "ux-spec-vote"
on_fail = "fix-loop"
threshold = { "fix-loop" = "count>=1(vote == reject)" }
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-design"]
when = "labels contains doc:ux-spec and labels != doc:tdd and labels != doc:adr"

[[step]]
after = ["reconcile"]
inputs = ["issue.latest.doc", "reconcile.findings"]
name = "prd-vote"
on_fail = "fix-loop"
threshold = { "fix-loop" = "count>=1(vote == reject)" }
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-design"]
when = "labels != doc:tdd and labels != doc:adr and labels != doc:ux-spec"

[[step]]
action = "doc-record"
after = ["tdd-vote", "adr-vote", "ux-spec-vote", "prd-vote"]
expected_cost = 0.20
gates = ["citation-check"]
inputs = ["issue.latest.doc"]
name = "record"
params = { output = "doc-record" }
