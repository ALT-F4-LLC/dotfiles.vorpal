[pipeline]
description = "Implement, review, reconcile, and verify one ordinary change; the conductor integrates commits, the operator publishes."
name = "standard-change"
version = 31  # 31: `verify` routes `unverifiable` to an interposed
              #   `verify-tribunal` vote instead of `waiting-human`, the
              #   step security-change@31 already carries (same seats, same
              #   `on_fail = "fix-loop"`, `vote_rule = "tribunal"`), and
              #   `fix` reads its vote-record. RUN-90 measured the old
              #   routing: 20 of its 21 parks were a verify reporting an AC
              #   `unverifiable` because the `ac-commands` gate is a stub
              #   (AGT-271); every one parked the whole run and every one
              #   the operator resolved `override-pass`. A vote rides the
              #   wave and parks nothing; a below-threshold tally still
              #   routes to the fixer, never to a silent pass. Cost: three
              #   seats per verify that reports an unverifiable AC — most of
              #   them while the gate stays a stub. `unmet` still loops.
              # 30: two input edits on `fix`, no topology change. (1)
              #   `synthesize.findings` joins `reconcile.findings`: the
              #   aggregate reaches the fixer as cluster titles and member ids
              #   with no evidence, while the synthesize artifact's body lists
              #   every member's judge, id, severity and evidence — one fixer
              #   handed eight title-only clusters spent fourteen calls (run
              #   reports, step shows, a raw open of the store's database)
              #   hunting for member bodies. ordinalScoped binds it to the
              #   round that just judged the fixer's base. (2)
              #   `issue.latest.change-summary` joins
              #   `implement.change-summary`: the engine never rebinds a loop
              #   body's own inputs, so at fix@2 and later the packet carried
              #   implement@0's account and omitted fix@(N-1)'s, the tree the
              #   fixer actually stands on (three fix@2 packets in one run all
              #   bound to implement@0). `issue.latest.<kind>` is the engine's
              #   named form for exactly this; at fix@1 both entries resolve
              #   to implement@0 and the bundle de-duplicates them. This track
              #   has no vote step, so the target-ref change its siblings
              #   made at the same time does not apply here. NOT changed:
              #   `synthesize`'s `review.*` already binds to the current round
              #   only; the previous-round raw judge payloads in a re-review
              #   synthesize packet come from the engine's previous-round pass
              #   matching every artifact of the emitted kind, which no input
              #   edit can scope — engine change, tracked separately.
              # 29: the `review-security` step is removed, with its
              #   `judge-security` limit row and synthesize's
              #   `review-security.findings` input. Its predicate
              #   (`labels contains security`) has been unsatisfiable since
              #   27 put `security` in unless_labels: the match table refuses
              #   every issue carrying that label, and a step-level `when`
              #   reads the same label list, so the lane could never fire
              #   again. Measured across every project's ledger: 4 executions,
              #   all on versions 26 and earlier; 24 skips, 8 of them on 27.
              #   The security judge still runs where the label routes, on
              #   the security-change track. Nothing else changes: a false
              #   `when` already expanded the step as `skipped`, so the
              #   topology every run actually walked is exactly this one.
              # 28: reconcile gains the `drain-highs` routing on
              #   `any(open_severity >= high)` plus the interposed executor
              #   step it names, which files each still-open high cluster
              #   (not held, not operator-resolved) as a `--gap-file` backlog
              #   issue at its completion; see ui-change@22 for the full
              #   trail (open highs completed rounds recorded only in
              #   reconcile artifacts nothing downstream reads — the fix-loop
              #   threshold worked as configured, but an open high had no
              #   drain path at all). `fix-loop` stays first and
              #   ThresholdOrder evaluates it first, so a round with any open
              #   blocker still loops; a round with nothing open at high or
              #   above routes `pass` with the drain step terminalized
              #   `skipped`, never claimed and never billed.
              # 27: `security` joins unless_labels beside
              #   `security-change` and `security-load-bearing`, because
              #   security-change@26 now matches that label too. Without this
              #   the two workflows would both match an issue labelled only
              #   `security`; with it, that issue binds the security track
              #   instead of falling through to this baseline unnoticed.
              # 26: implement and fix add the `vuln-scan` gate. An ordinary
              #   change can add a third-party dependency, and nothing in
              #   this pipeline audited a newly added dependency's own CVE
              #   exposure — a hash-pinned lockfile buys integrity, not
              #   vulnerability freedom. The gate is UNCONDITIONAL because
              #   §11.1 admits no gate predicate: a gate entry carries only
              #   `name`, `source`, and `pre`, and step-level `when` reads
              #   issue kind/labels, never the diff. A repo with no
              #   `vuln-scan` trust entry records `unmatched`, which routes
              #   as a failure — register one (a declared stub, if there is
              #   no scanner yet) before binding this version

[match]
unless_labels = [
  "disposition",
  "docs-only",
  "investigation",
  "release",
  "retro",
  "security",
  "security-change",
  "security-load-bearing",
  "spec-doc",
  "spec-project",
  "ui",
]

[limits]
"drain-highs" = { max = 16, max_step_duration = "1h" }
"judge-architecture" = { max = 16, max_step_duration = "1h" }
"judge-correctness" = { max = 16, max_step_duration = "1h" }
"judge-testing" = { max = 16, max_step_duration = "1h" }
"synthesize-findings" = { max = 16, max_step_duration = "1h" }
"verify-ac" = { max = 16, max_step_duration = "1h" }
"write" = { max = 16, max_step_duration = "2h" }

[[step]]
after = []
class = "write"
emits = "change-summary"
executor = "implement"
expected_cost = 1.50
gates = ["build", "tests", "self-hygiene", "secret-scan", "vuln-scan"]
inputs = ["issue.body"]
max_attempts = 2
name = "implement"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
name = "review"
holds_tree = false
after = ["implement"]
fanout = ["judge-correctness", "judge-architecture", "judge-testing"]
emits = "findings"
packet = ["contracts/{executor}.md"]
payload = "findings@9"
expected_cost = 0.60
inputs = ["implement.change-summary", "issue.diff"]

[[step]]
after = ["review"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.60
holds_tree = false
inputs = ["review.*"]
name = "synthesize"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@2"

[[step]]
action = "aggregate"
after = ["synthesize"]
inputs = ["synthesize.findings"]
max_fix_loops = 2
name = "reconcile"
params = { field = "severity", method = "max", hold_spread = 3, output = "findings" }
payload = "findings@9"
threshold = { "fix-loop" = "any(open_severity >= blocker)", "drain-highs" = "any(open_severity >= high)" }

[[step]]
after = ["reconcile"]
emits = "drain-report"
executor = "drain-highs"
expected_cost = 0.30
holds_tree = false
inputs = ["reconcile.findings", "issue.body"]
name = "drain-highs"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after_loop = "review"
class = "write"
emits = "change-summary"
executor = "fix"
expected_cost = 1.00
gates = ["build", "tests", "self-hygiene", "secret-scan", "vuln-scan"]
inputs = ["reconcile.findings", "synthesize.findings", "implement.change-summary", "issue.latest.change-summary", "issue.latest.ac-report", "verify-tribunal.vote-record"]
loop = true
name = "fix"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["reconcile"]
emits = "ac-report"
executor = "verify-ac"
expected_cost = 0.50
gates = [{ name = "ac-commands", pre = true }]
holds_tree = false
inputs = ["issue.body", "issue.diff", "implement.change-summary", "verify.gate-results"]
name = "verify"
packet = ["contracts/{executor}.md"]
payload = "ac-report@1"
threshold = { "fix-loop" = "any(status == unmet)", "verify-tribunal" = "any(status == unverifiable)" }

[[step]]
after = ["verify"]
inputs = ["verify.ac-report", "issue.body", "issue.diff"]
name = "verify-tribunal"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-correctness"]
