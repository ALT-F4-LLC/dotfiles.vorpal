[policy]
version = 23

# `blocked`: the hold label. An issue not yet workable — blocked on
# a capability that does not exist, or needing a design session before
# implementation makes sense — carries this label so it matches zero
# registered workflows and cannot be selected by `docket-plan` or treated as
# run-ready by `docket-groom`. Every `workflows/*.toml`'s `[match].unless_labels`
# names it. Remove the label only once the specific blocking condition named
# on the issue (the missing capability, or the completed design session) is
# met; it is not a silent, permanent exclusion.

[variants]
fable-high = { model = "fable", effort = "high" }
fable-max = { model = "fable", effort = "max" }
fable-medium = { model = "fable", effort = "medium" }
fable-xhigh = { model = "fable", effort = "xhigh" }
opus-high = { model = "opus", effort = "high", escalate_to = "fable-high" }
opus-medium = { model = "opus", effort = "medium", escalate_to = "fable-medium" }
opus-xhigh  = { model = "opus", effort = "xhigh", escalate_to = "fable-xhigh" }
opus-max = { model = "opus", effort = "max", escalate_to = "fable-max" }
sonnet-high = { model = "sonnet", effort = "high", escalate_to = "opus-high" }
sonnet-max = { model = "sonnet", effort = "max", escalate_to = "opus-max" }
sonnet-medium = { model = "sonnet", effort = "medium", escalate_to = "opus-medium" }
sonnet-xhigh = { model = "sonnet", effort = "xhigh", escalate_to = "opus-xhigh" }

[executors]
# Policy 21 — model/effort re-derived from Anthropic's official documentation
# (fetched 2026-09-02), fit to each seat's role and cost-aware. Cited below as D1-D7:
#   D1 code.claude.com/docs/en/model-config — aliases resolve fable → Fable 5.1,
#      opus → Opus 5, sonnet → Sonnet 5, haiku → Haiku 4.5; effort is
#      low|medium|high|xhigh|max with `high` "The default on every model except
#      Opus 4.7"; `max` "may show diminishing returns and is prone to overthinking.
#      Test before adopting broadly"; Fable: "root-cause investigations, outage
#      debugging, and architecture decisions are where the extra investigation and
#      verification pay off".
#   D2 platform.claude.com/docs/en/build-with-claude/effort — xhigh: "Long-running
#      agentic and coding tasks (over 30 minutes) with token budgets in the
#      millions"; Fable 5.1: "Start with `high`, the default. Step up to `xhigh` or
#      `max` for the most capability-sensitive agentic and coding work, and step down
#      to `medium` or `low` for routine or latency-sensitive work once your evals
#      show quality holds"; Opus 5: "use `low` and `medium` liberally as your primary
#      control for token cost and response time wherever your evals show quality
#      holds"; Sonnet 5 medium: "Comparable to Claude Sonnet 4.6 at high effort";
#      max (Opus 4.7 table): "Reserve for frontier problems".
#   D3 platform.claude.com/docs/en/about-claude/models/overview — "start with
#      Claude Opus 5 for most workloads. Use Claude Fable 5.1 for demanding reasoning
#      and long-horizon agentic work, or when your evals on Claude Opus 5 at higher
#      effort still fall short"; Haiku 4.5 effort: "Not supported" (so no haiku
#      variant here).
#   D4 platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence
#      — SWE-bench Pro: "Claude Opus 5 at its default remains the cheaper way to the
#      top score"; Opus 5 at `low` 84.0% for $0.25 per solved task against Sonnet 5 at
#      default 77.4% for $0.84; "Claude Opus 5 gave up about 2 points at `medium` for
#      half the cost and about 8 points at `low` for a quarter of it"; `low` plus
#      re-running failures at the default gave "the same pass rate for half the
#      cost"; knowledge work: "`medium` matched the default's accuracy at about 70% to
#      87% of its cost, and the default bought nothing measurable over `medium`";
#      DeepResearch Bench II: Fable 5.1 "scored nearly the same at `low`, `medium`,
#      and `high` while the cost per task rose".
#   D5 platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-fable-5-1
#      — "At `medium`, results roughly match Claude Fable 5 at lower cost"; "At `low`,
#      Claude Fable 5.1 is often competitive with Claude Opus and Claude Sonnet models
#      on cost per task while scoring higher, so include it in the comparison wherever
#      you'd otherwise run a smaller model at a higher effort level"; at `low` it
#      "calls search and retrieval tools less often".
#   D6 claude.com/blog/claude-model-and-effort-level-in-claude-code — routine edits
#      and mechanical changes: Sonnet at default; code review and verification:
#      Sonnet→Opus at high; "for most tasks you should use the model's default effort
#      level".
#   D7 code.claude.com/docs/en/model-config#automatic-model-fallback — see [security].
# The re-run-failures pattern in D4 is what [escalation] already implements: a
# non-gated opus-medium seat that fails hops to fable-medium, misses the fable gate,
# and lands on [escalation.fallback] opus-high — the model's default effort. Rows
# without a comment are confirmed at their prior tier under D1-D6.
# fable-high, down from fable-max: D1 names architecture decisions as Fable's
# ground; D1 and D2 contraindicate max without evals showing headroom at high.
adr-author = { variant = "fable-high" }
design-qa = { variant = "opus-high" }
dispose = { variant = "opus-high" }
# Seat for the reconcile drain-highs routing — files each still-open
# high cluster as a --gap-file backlog issue. Mechanical selection and faithful
# copying, no judgment over severities; same tier as synthesize-findings.
drain-highs = { variant = "sonnet-medium" }
# opus-medium, down from sonnet-xhigh: D4 has Opus 5 at low/medium beating Sonnet 5
# at default per solved task, D5 warns off a smaller model at a higher effort, and D2
# reserves xhigh for 30-minute-plus agentic runs, which a scoped repair of reconciled
# findings is not. Round 2 onward lands on opus-high through the fallback.
fix = { variant = "opus-medium" }
# opus-medium, from sonnet-high: D4 — medium gives up about 2 points for half the
# cost and re-running failures at the default recovers the pass rate; judges and
# verify-ac are the failure detector here, fix rounds the re-run at opus-high.
implement = { variant = "opus-medium" }
# fable-high, down from fable-xhigh: D1 names root-cause investigation as Fable's
# ground; D2 starts at high and reserves xhigh for 30-minute-plus agentic coding
# with evals showing the gain, which no run here has produced.
investigate = { variant = "fable-high" }
# Policy 23 — judge-architecture and judge-testing at opus-medium, down from
# opus-high; judge-correctness stays at opus-high. Measured on RUN-90 (session
# 099f7b93, 36 waves, 1594 agent-minutes): the three review seats were 45% of
# all agent time (judge-testing 281 min at 8.5 min per seat, judge-correctness
# 215 min, judge-architecture 191 min) against implement's 16%. D4 has Opus 5 at
# medium giving up about 2 points for half the cost, with re-running failures at
# the default recovering the pass rate — and the escalation ladder is exactly
# that re-run: a judge seat that fails hops opus-medium -> opus-high. D5 keeps
# this on Opus rather than a smaller model at a higher effort. The correctness
# lens keeps the default because it is the seat whose misses reach the tree.
judge-architecture = { variant = "opus-medium" }
judge-correctness = { variant = "opus-high" }
judge-design = { variant = "opus-high" }
judge-security = { variant = "opus-high", never = ["fable"], reason = "security-classifier-reroute" }
judge-simplicity = { variant = "opus-medium" }
judge-testing = { variant = "opus-medium" }
# fable-medium, down from fable-max: a requirements document is the knowledge-work
# deliverable class D4 measured — medium matched the default at 70-87% of its cost —
# and D5 has Fable at medium matching Fable 5; max is contraindicated by D1.
prd-author = { variant = "fable-medium" }
# fable-medium, down from fable-xhigh: D4 — DeepResearch Bench II scored the same at
# low, medium, and high while cost rose; D5 — at low Fable calls retrieval less
# often, so medium is the floor for a seat whose whole job is retrieval.
research = { variant = "fable-medium" }
spec-author-architecture = { variant = "opus-high" }
spec-author-code-quality = { variant = "opus-high" }
spec-author-operations = { variant = "opus-high" }
spec-author-performance = { variant = "opus-high" }
spec-author-review-strategy = { variant = "opus-high" }
spec-author-security = { variant = "opus-high", never = ["fable"], reason = "security-classifier-reroute" }
spec-author-testing = { variant = "opus-high" }
synthesize-findings = { variant = "sonnet-medium" }
# fable-high, down from fable-xhigh: D1 puts architecture decisions on Fable; D2
# starts at high and reserves xhigh for long agentic coding, not authoring.
tdd-author = { variant = "fable-high" }
# opus-high, down from opus-xhigh: D2 places Opus 5 xhigh on demanding coding and
# agentic work, not a design document; parity with threat-model and
# spec-author-security. A retry lands on opus-xhigh through the fallback.
tdd-author-security = { variant = "opus-high", never = ["fable"], reason = "security-classifier-reroute" }
# opus-high, down from opus-xhigh (policy 20). The threat model is the single
# longest serial stage of the security track: across every security-track
# issue on this machine (52 issues, 24 timed threat-model steps, all at
# opus-xhigh) it ran a median 8.0 minutes and a p90 of 10.3, emitting a median
# 26k output tokens — the largest output of any step in the pipeline — and it
# spent 10 minutes on a single advisory markdown file. No tier-differentiated
# observation exists, so this is design judgment stated as such: the contract
# already asks for effort proportional to what an attacker gains rather than to
# the diff, and the read-only security siblings (judge-security,
# spec-author-security) sit at opus-high. `never` and the [security] ceiling
# still bind because the node stays in [security].nodes; a retry escalates
# opus-high -> fable-high, which `never` redirects through
# [escalation.fallback] to opus-xhigh — the escalation path lands where the
# standing tier used to be. Re-open with runs that pair tier and outcome.
threat-model = { variant = "opus-high", never = ["fable"], reason = "security-classifier-reroute" }
# Policy 23 — tribunal-architecture and tribunal-correctness at opus-high, down
# from fable-high (tribunal-design keeps fable-high: no per-issue step names it).
# standard-change@31 and security-change@31 interpose a verify-tribunal vote on
# every verify that reports an AC unverifiable, which on a repo whose
# ac-commands gate is a stub is nearly every issue (RUN-90: 20 of 23), so these
# two seats became a per-issue pipeline step rather than an occasional
# conversational gate, at three seats a firing. D1's ground for Fable —
# architecture decisions and precedent — is the conversational-gate case; a
# verify-tribunal weighs an AC report against a diff, the review-executor work
# judge-correctness and judge-architecture already do at opus-high. A failed
# seat still escalates opus-high -> fable-high.
tribunal-architecture = { variant = "opus-high" }
tribunal-correctness = { variant = "opus-high" }
# fable-high, down from fable-xhigh: a vote is a short judgment over a proposal, not
# the 30-minute-plus agentic run D2 reserves xhigh for; D1 keeps architecture and
# precedent judgment on Fable; D2 starts at high.
tribunal-design = { variant = "fable-high" }
# opus-high, down from opus-xhigh: same reasoning as its siblings; judge-security,
# the review-executor face of the same lens, already sits at opus-high.
tribunal-security = { variant = "opus-high", never = ["fable"], reason = "security-classifier-reroute" }
# fable-medium, down from fable-max: same knowledge-work deliverable class as
# prd-author (D4, D5); max is contraindicated by D1.
ux-spec-author = { variant = "fable-medium" }
verify-ac = { variant = "opus-high" }

[security]
ceiling = "opus-max"
# Every label here also ROUTES — it is not a model-only list. Until
# security-change@26 these three labels model-routed while only two of them
# appeared in any workflow's [match].labels_any, so an issue labelled just
# `security` drew the ceiling and the `never` below but ran the ordinary
# standard-change pipeline, with no threat model, no security-vote and no
# abuse-case gate, and no check could see it: `run activate --dry-run` refuses
# zero matches and refuses several, but an exactly-one-WRONG match is
# structurally undetectable there. The split was reconciled by making
# `security` route (security-change@26 [match].labels_any; excluded in
# standard-change@27, ui-change@21, disposition@3) rather than by deleting it
# here — deleting it would have removed the divergence without closing the
# hole, since an issue labelled only `security` would still bind the baseline
# silently, and would have lost the Opus floor as well. So: a label added to
# this list must also be added to security-change's `labels_any` and to the
# `unless_labels` of every workflow that excludes its siblings, or it re-opens
# the same trap.
labels = ["security-change", "security-load-bearing", "security"]
# security-load-bearing labeling test: apply the label at filing
# time to any issue that changes, relocates, or test-gates one of these
# control classes. "Test-gates" means acceptance criteria whose deletion or
# mutation a test would catch. Both changing a control's logic and moving or
# deleting its existing implementation qualify — a botched relocation can
# silently drop a chokepoint without changing any allow/deny outcome.
#   (a) Authentication — identity verification (OIDC/JWKS, issuer validation,
#       interceptor construction, credential validation)
#   (b) Authorization — access-control decisions (namespace/principal
#       binding, permission gates)
#   (c) Credential handling — building, storing, writing, or transmitting
#       secrets/tokens/credentials
#   (d) Egress/trust-boundary configuration — what hosts/registries/
#       endpoints code may reach or trust
#   (e) Path/namespace confinement — preventing caller-controlled escape
#       from an intended directory/namespace
#   (f) Verification/detection of any of the above — per threat-model.md's
#       definition of a control as including its verification, an
#       audit/detection-logging gap on a control counts even though deleting
#       it changes no allow/deny outcome
# Apply this test once, at filing (drain-highs.md references it for its own
# gap filings). Do not re-derive it at activation; RUN-92 spent five tribunal
# rounds re-deriving this same criterion because it lived nowhere durable.
never = ["fable"]
nodes = ["judge-security", "threat-model", "tdd-author-security", "spec-author-security", "tribunal-security"]
# D7 (code.claude.com/docs/en/model-config#automatic-model-fallback, 2026-09-02):
# "Fable models and Opus 5 run with safety classifiers, which most often flag
# cybersecurity and biology content. When a classifier flags a request and the
# flagged category has a fallback model, Claude Code re-runs the request on that
# model and shows a notice in the transcript." Fable 5.1: cyber → Opus 4.8, bio →
# Opus 5. Opus 5: cyber → Opus 4.8. Fable's classifier set is "a broader set than
# Claude Opus 5's cybersecurity-only classifiers" (Fable 5.1 migration guide).
reason = "Fable's safety classifiers cover more categories than Opus 5's cyber-only set and flag security review by its nature; Claude Code then re-runs the request on the fallback model (cyber → Opus 4.8), so a Fable seat here pays Fable's rate for an Opus 4.8 run and the ledger credits a model that never ran. Name Opus up front. Residual: Opus 5 itself re-runs cyber-flagged requests on Opus 4.8; only the model_resolved metadata each executor records catches that hop."

[escalation]
# DOT-1266 (RUN-80, 2026-09-03): on_failure's attempt-keyed hop does not
# distinguish a reaped attempt from a genuinely FAILED one. RUN-80's
# DISPATCH-400 was killed by a session usage limit; the engine reaped 10
# leases (not quality failures), and on re-dispatch those steps ran at
# attempt 1 with on_failure walking them straight to [escalation.fallback]
# on the very next miss — e.g. judge-correctness/judge-security opus-high ->
# fable-high -> (never fable, security-change) -> opus-xhigh, on rows that
# had done nothing wrong. The xhigh tier bought nothing there: STEP-3668 ran
# 17.9k output tokens, STEP-3670 43 tool calls, for a kill that was pure
# infrastructure, not a quality signal.
#
# DKT-1279 (schema v27, docket engine) now adds `prior_attempt_end` —
# "reaped" | "failed", omitempty — to every next/dispatch-open/step-show/
# step-list row, so a hop-worthy failure and a lease reap are finally
# distinguishable at the SAME row this escalation logic already reads. As of
# this comment the engine binary this repo installs has not yet picked up
# v27 (feature/engine-improvements, commits 4942039/77c9a5c, not yet
# pushed/installed via `just activate`), so on_failure/on_round still cannot
# read the field and still hop on a reaped attempt exactly as RUN-80 did.
# Once v27 is installed, teach the escalation walk to skip the hop (or reset
# to base tier) for an attempt whose prior_attempt_end == "reaped" — that is
# an engine-side change to the walk itself, not a value this TOML can
# express, so it is tracked separately from this comment, not inline here.
#
# Until then: an acknowledged reap that gets re-dispatched still re-runs ONE
# TIER UP under on_failure's ordinary walk, same as any other retry —
# acknowledging a reap (docket-run SKILL.md's ack-reap ruling) buys that
# tier cost knowingly, not a free re-run at the standing tier. docket-retro
# should weigh in on whether the shipped default should change once v27's
# distinction is actually available to route on.
on_failure = "one-hop"
# Round-based escalation. A fix-loop round is a FRESH step id —
# `docket step resolve --as fix-round` mints fix@N+1 at attempt 0 — so
# on_failure's attempt-keyed walk never sees a loop's failure history and the
# fixer sat at sonnet-medium for all nine rounds of a past run before this gap
# was caught. The engine
# encodes the round ordinal in the instance name (`fix@N`, first entry minted
# at @1); executors listed in round_executors count each round AFTER their
# first as one escalate_to hop, composed with any attempt hops and bounded by
# the same chain end / [security].ceiling. Only listed executors participate:
# the per-round re-runs that share the ordinal (review@N judges, synthesize@N,
# verify@N) are deliberately NOT listed and keep their standing variants.
on_round = "one-hop"
# Docket-retro: DECLINED — `fix` does not start one hop up on
# security-labelled issues. Measured across 19 fix-loop runs (15 security-flavored:
# RUN-25/29/30/34/35/36/38/48/49/50/51/52/58/59/60; 4 contrast: RUN-32/53/56/61):
# round-1 fixers that already served opus-medium reproduced the just-closed-class
# recurrence the docket-retro attributes to the base tier in every group that could observe
# one (e.g. RUN-60's own fix@2, RUN-61's own "re-introducing the class this same
# commit deleted twice"), while sonnet-medium round-1 fixers converged in one round
# on several security issues. The recurrence tracks the
# fix diff's size and spread, not the tier, and appears at the same rate on
# unlabelled work. The remedy landed instead as the sibling-sweep and
# claim-discipline obligations in contracts/fix.md@4. Do not re-open without runs
# where a tier-differentiated comparison is observable — today the ledger prices no
# tier (expected_cost is variant-blind) and pairs requested/resolved only per step.
round_executors = ["fix", "dispose"]
fable_gates = [
  "failed-top-opus-round",
  "investigator-class",
  "novel-architecture",
]

[escalation.fallback]
fable-high = "opus-xhigh"
fable-max = "opus-max"
fable-medium = "opus-high"
fable-xhigh = "opus-max"
