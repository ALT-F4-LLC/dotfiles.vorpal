[pipeline]
description = "Author the seven reserved project spec files in parallel, optionally grounded by a research step. Review and reconcile the findings, accept by tribunal vote, then drain the final round's open findings. A rejection re-enters the bounded revise loop at spec authoring and runs review again."
name = "spec-project"
version = 42

[match]
labels_any = ["spec-project"]
unless_labels = ["blocked", "docs-only", "release", "retro", "route-direct", "route-loop"]

[limits]
"drain-highs" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-architecture" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-correctness" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"judge-simplicity" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"research" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"synthesize-findings" = { max = 16, lease_ttl = "1h", max_step_duration = "1h" }
"write" = { max = 16, lease_ttl = "2h", max_step_duration = "2h" }

[[step]]
after = []
emits = "research-notes"
executor = "research"
expected_cost = 0.50
holds_tree = false
inputs = []
max_attempts = 2
name = "research"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
payload = "research-notes@3"
when = "labels contains needs-research"

[[step]]
after = ["research"]
class = "write"
emits = "spec"
expected_cost = 1.00
fanout = [
  "spec-author-architecture",
  "spec-author-security",
  "spec-author-operations",
  "spec-author-performance",
  "spec-author-code-quality",
  "spec-author-review-strategy",
  "spec-author-testing",
]
gates = ["doc-validate", "reserved-name-check"]
inputs = ["research.*"]
max_attempts = 2
name = "spec-author"
on_fail = "waiting-human"
packet = ["contracts/spec-author.md"]

[[step]]
after = ["spec-author"]
emits = "findings"
expected_cost = 0.60
fanout = ["judge-architecture", "judge-correctness", "judge-simplicity"]
holds_tree = false
inputs = ["issue.latest.spec"]
name = "review"
packet = ["contracts/{executor}.md"]
payload = "findings@12"

[[step]]
after = ["review"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.60
holds_tree = false
inputs = ["review.*"]
max_attempts = 2
name = "synthesize-findings"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@7"

[[step]]
action = "aggregate"
after = ["synthesize-findings"]
inputs = ["synthesize-findings.findings"]
max_fix_loops = 2
name = "reconcile"
params = { field = "severity", method = "max", hold_spread = 3, output = "findings", source_field = "member_sources" }
payload = "findings@15"
threshold = { "fix-loop" = "any(open_severity >= blocker)" }

[[step]]
after = ["spec-vote"]
emits = "drain-report"
executor = "drain-highs"
expected_cost = 0.30
holds_tree = false
inputs = ["reconcile.findings"]
max_attempts = 2
name = "drain-highs"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

# Loop body: attempts and failure routing are governed by reconcile's
# max_fix_loops, not a local max_attempts/on_fail pair.
[[step]]
after_loop = "review"
class = "write"
emits = "spec"
expected_cost = 0.70
fanout = [
  "spec-author-architecture",
  "spec-author-security",
  "spec-author-operations",
  "spec-author-performance",
  "spec-author-code-quality",
  "spec-author-review-strategy",
  "spec-author-testing",
]
gates = ["doc-validate", "reserved-name-check"]
inputs = ["reconcile.findings", "issue.latest.spec", "spec-vote.vote-record", "research.*"]
loop = true
name = "revise-spec"
packet = ["contracts/spec-author.md"]

[[step]]
after = ["reconcile"]
inputs = ["issue.latest.spec", "reconcile.findings"]
name = "spec-vote"
on_fail = "fix-loop"
threshold = { "fix-loop" = "count>=1(vote == reject)" }
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-correctness"]
