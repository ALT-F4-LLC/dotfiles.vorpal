[pipeline]
description = "Implement, review, reconcile, and verify one ordinary change; the conductor integrates commits, the operator publishes."
name = "standard-change"
version = 37  # 37: `verify-ac` emits `ac-report@2`, whose status enum adds
              #   `unmet-out-of-scope`: an AC shown false whose every repair lies
              #   outside all applicable step scopes or in another repository,
              #   gap-filed by verify-ac itself. The vote predicate becomes
              #   `any(status != met)`, read after `fix-loop`'s
              #   `any(status == unmet)` under first-match order, so an in-scope
              #   unmet still loops while an out-of-scope or unverifiable AC goes
              #   to the one-seat `verify-ac-vote`: approve passes with the filing
              #   on record, reject routes fix-loop as before. No topology change.
              #   Measured on one RUN-98 issue (this track at 35): its AC3's only
              #   remedy was engine-side from review@0 and it stayed `unmet` through
              #   every verify, so the issue could only loop to the cap and park —
              #   four rounds each closing a distinct gap in AC1, then override-pass
              #   with the residue filed as a follow-up; a second issue on the same
              #   run filed the same shape as a gap. Under @37 that AC3 routes to
              #   the vote at verify@0. Also `reconcile` gains
              #   `max_stalled_rounds = 2`: the engine refuses a loop entry after two
              #   consecutive rounds in which the aggregate's cluster count set no new
              #   minimum, parking it `waiting-human` as a loop-bound park. Measured
              #   on RUN-98's three looped issues, the reconciled count ran 9→8→3→3,
              #   7→5→3→5 and 2→2→0→0, so no converging loop would have parked while
              #   a ten-round plateau (RUN-51, 8-12 clusters flat) parks at round 3.
              # 36: corpus-wide naming-convention pass (src/user/docket/config/README.md).
              #   Step renames only, no topology change: `synthesize` ->
              #   `synthesize-findings` (step now equals its sole executor's
              #   name), `verify` -> `verify-ac` (same), `verify-tribunal` ->
              #   `verify-ac-vote` (vote steps now uniformly named
              #   `<gated-step>-vote`). Every `after`, threshold route key, and
              #   `<step>.<kind>` input reference updated to match. `fix`'s
              #   `verify-tribunal.vote-record` input is now
              #   `verify-ac-vote.vote-record`.
              # 35: `small` and `trivial` join unless_labels, so an issue carrying either
              #   binds the new small-change or trivial-change track instead of this one;
              #   nothing else changes. Measured on one 147-issue run on this machine
              #   (35 issues bound here, 27 finished): a change of 20 lines or fewer
              #   spent a median 38 seat-minutes over 7 executor seats plus 3 tribunal
              #   seats and took a median 22.7 hours from first claim to done, no
              #   faster than a 21-100-line change (23.5 h) or one over 400 lines
              #   (17.2 h). Seat time by stage here: the three judges 35%, implement
              #   28%, verify 25%, fix 4%, synthesize 4%, drain-highs 4%. The elapsed
              #   time was not seat time: every finished chain crossed three
              #   dispatches (implement; the three judges and synthesize; drain, verify
              #   and the tribunal), and the waits at those boundaries were about two
              #   thirds of it, so the lever a lighter track pulls is rows per issue
              #   and serial stages, not model tiers. Nine of the 35 issues recorded no
              #   diff at all (their acceptance criteria were already met at HEAD) and
              #   still walked every stage; they drew 3 of this track's 4 blocker fix
              #   rounds and all 3 of its parked fix rounds — a stale-backlog class for
              #   grooming to retire before activation, not a lane this file can
              #   express, because `[match]` and a step's `when` read issue kind and
              #   labels only, never the diff. Across every project's ledger (225
              #   distinct issues bound here) round-0 reconcile routed a blocker fix
              #   round on 7 of 64 changes of 20 lines or fewer and 12 of 92 of 21-100
              #   lines, so this three-judge review is kept as the default for an
              #   unlabelled change; the lighter tracks bind only by a label a person,
              #   the groomer or the planner applied.
              # 34: two edits on the review stage, no topology change. (1)
              #   `verify-tribunal` seats `tribunal-correctness` alone instead of the
              #   three-seat tribunal roster. Measured across every verify-tribunal
              #   decided on this machine (25 panels: 1 here, 10 on security-change,
              #   9 on ui-change, 5 on the retired security-load-bearing track; 19
              #   approved, 6 rejected), the correctness seat's own cast matched the
              #   panel's outcome in all 25, every rejection included. One voter
              #   tallies 1.0 on approve and 0.0 on reject against the rule's 0.67, so
              #   the decision is deterministic; a three-seat 2-1 tally scored 0.63 to
              #   0.70 by each cast's confidence decimals, and the twenty such tallies
              #   in the ledger split ten approved, ten rejected. Rule, `on_fail` and
              #   the fixer's vote-record input are unchanged. (2) `reconcile` drops
              #   `hold_spread`: absent never holds, so a disputed blocker routes to
              #   the fixer directly. 10 held-cluster panels were decided on this
              #   track and 9 approved the computed value, which then routed fix-loop
              #   anyway; each panel seats three store-configured tribunal seats at a
              #   median 13 minutes apiece, so a wrong blocker now costs one fix round
              #   instead of a panel on every disputed one. Thresholds and
              #   `max_fix_loops` stay. The judge fan-out stays at three: each seat is
              #   the sole finder of clusters no other seat raised (across 187
              #   reconciled rounds, correctness 11 blocker / 43 high, architecture
              #   3 / 71, testing 3 / 154), and of drained highs 41% were later worked
              #   to done inside a run while 1-4% of any seat's high-or-above
              #   findings were ever downgraded by a fixer, a panel or an operator.
              # 33: `doc-validate` joins the `implement` and `fix` gate lists
              #   the widened doc-validate pathspec was declared
              #   only on docs-only and spec-doc/spec-project, so an ordinary
              #   change's doc edits were never checked by it.
              # 32: `blocked` joins unless_labels: a hold label so
              #   an issue not yet workable matches zero registered workflows
              #   until the label is removed.
              # 31: `verify` routes `unverifiable` to an interposed
              #   `verify-tribunal` vote instead of `waiting-human`, the
              #   step security-change@31 already carries (same seats, same
              #   `on_fail = "fix-loop"`, `vote_rule = "tribunal"`), and
              #   `fix` reads its vote-record. RUN-90 measured the old
              #   routing: 20 of its 21 parks were a verify reporting an AC
              #   `unverifiable` because the `ac-commands` gate is a stub
              #   (AGT-271); every one parked the whole run and every one
              #   the operator resolved `override-pass`. A vote rides the
              #   wave and parks nothing; a below-threshold tally still
              #   routes to the fixer, never to a silent pass. Cost: three
              #   seats per verify that reports an unverifiable AC — most of
              #   them while the gate stays a stub. `unmet` still loops.
              # 30: two input edits on `fix`, no topology change. (1)
              #   `synthesize.findings` joins `reconcile.findings`: the
              #   aggregate reaches the fixer as cluster titles and member ids
              #   with no evidence, while the synthesize artifact's body lists
              #   every member's judge, id, severity and evidence — one fixer
              #   handed eight title-only clusters spent fourteen calls (run
              #   reports, step shows, a raw open of the store's database)
              #   hunting for member bodies. ordinalScoped binds it to the
              #   round that just judged the fixer's base. (2)
              #   `issue.latest.change-summary` joins
              #   `implement.change-summary`: the engine never rebinds a loop
              #   body's own inputs, so at fix@2 and later the packet carried
              #   implement@0's account and omitted fix@(N-1)'s, the tree the
              #   fixer actually stands on (three fix@2 packets in one run all
              #   bound to implement@0). `issue.latest.<kind>` is the engine's
              #   named form for exactly this; at fix@1 both entries resolve
              #   to implement@0 and the bundle de-duplicates them. This track
              #   has no vote step, so the target-ref change its siblings
              #   made at the same time does not apply here. NOT changed:
              #   `synthesize`'s `review.*` already binds to the current round
              #   only; the previous-round raw judge payloads in a re-review
              #   synthesize packet come from the engine's previous-round pass
              #   matching every artifact of the emitted kind, which no input
              #   edit can scope — engine change, tracked separately.
              # 29: the `review-security` step is removed, with its
              #   `judge-security` limit row and synthesize's
              #   `review-security.findings` input. Its predicate
              #   (`labels contains security`) has been unsatisfiable since
              #   27 put `security` in unless_labels: the match table refuses
              #   every issue carrying that label, and a step-level `when`
              #   reads the same label list, so the lane could never fire
              #   again. Measured across every project's ledger: 4 executions,
              #   all on versions 26 and earlier; 24 skips, 8 of them on 27.
              #   The security judge still runs where the label routes, on
              #   the security-change track. Nothing else changes: a false
              #   `when` already expanded the step as `skipped`, so the
              #   topology every run actually walked is exactly this one.
              # 28: reconcile gains the `drain-highs` routing on
              #   `any(open_severity >= high)` plus the interposed executor
              #   step it names, which files each still-open high cluster
              #   (not held, not operator-resolved) as a `--gap-file` backlog
              #   issue at its completion; see ui-change@22 for the full
              #   trail (open highs completed rounds recorded only in
              #   reconcile artifacts nothing downstream reads — the fix-loop
              #   threshold worked as configured, but an open high had no
              #   drain path at all). `fix-loop` stays first and
              #   ThresholdOrder evaluates it first, so a round with any open
              #   blocker still loops; a round with nothing open at high or
              #   above routes `pass` with the drain step terminalized
              #   `skipped`, never claimed and never billed.
              # 27: `security` joins unless_labels beside
              #   `security-change` and `security-load-bearing`, because
              #   security-change@26 now matches that label too. Without this
              #   the two workflows would both match an issue labelled only
              #   `security`; with it, that issue binds the security track
              #   instead of falling through to this baseline unnoticed.
              # 26: implement and fix add the `vuln-scan` gate. An ordinary
              #   change can add a third-party dependency, and nothing in
              #   this pipeline audited a newly added dependency's own CVE
              #   exposure — a hash-pinned lockfile buys integrity, not
              #   vulnerability freedom. The gate is UNCONDITIONAL because
              #   §11.1 admits no gate predicate: a gate entry carries only
              #   `name`, `source`, and `pre`, and step-level `when` reads
              #   issue kind/labels, never the diff. A repo with no
              #   `vuln-scan` trust entry records `unmatched`, which routes
              #   as a failure — register one (a declared stub, if there is
              #   no scanner yet) before binding this version

[match]
unless_labels = [
  "blocked",
  "disposition",
  "docs-only",
  "investigation",
  "release",
  "retro",
  "security",
  "security-change",
  "security-load-bearing",
  "small",
  "spec-doc",
  "spec-project",
  "trivial",
  "ui",
]

[limits]
"drain-highs" = { max = 16, max_step_duration = "1h" }
"judge-architecture" = { max = 16, max_step_duration = "1h" }
"judge-correctness" = { max = 16, max_step_duration = "1h" }
"judge-testing" = { max = 16, max_step_duration = "1h" }
"synthesize-findings" = { max = 16, max_step_duration = "1h" }
"verify-ac" = { max = 16, max_step_duration = "1h" }
"write" = { max = 16, max_step_duration = "2h" }

[[step]]
after = []
class = "write"
emits = "change-summary"
executor = "implement"
expected_cost = 1.50
gates = ["build", "tests", "self-hygiene", "secret-scan", "vuln-scan", "doc-validate"]
inputs = ["issue.body"]
max_attempts = 2
name = "implement"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
name = "review"
holds_tree = false
after = ["implement"]
fanout = ["judge-correctness", "judge-architecture", "judge-testing"]
emits = "findings"
packet = ["contracts/{executor}.md"]
payload = "findings@9"
expected_cost = 0.60
inputs = ["implement.change-summary", "issue.diff"]

[[step]]
after = ["review"]
emits = "findings"
executor = "synthesize-findings"
expected_cost = 0.60
holds_tree = false
inputs = ["review.*"]
name = "synthesize-findings"
packet = ["contracts/{executor}.md"]
payload = "findings-cluster@2"

[[step]]
action = "aggregate"
after = ["synthesize-findings"]
inputs = ["synthesize-findings.findings"]
max_fix_loops = 2
max_stalled_rounds = 2
name = "reconcile"
params = { field = "severity", method = "max", output = "findings" }
payload = "findings@9"
threshold = { "fix-loop" = "any(open_severity >= blocker)", "drain-highs" = "any(open_severity >= high)" }

[[step]]
after = ["reconcile"]
emits = "drain-report"
executor = "drain-highs"
expected_cost = 0.30
holds_tree = false
inputs = ["reconcile.findings", "issue.body"]
name = "drain-highs"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after_loop = "review"
class = "write"
emits = "change-summary"
executor = "fix"
expected_cost = 1.00
gates = ["build", "tests", "self-hygiene", "secret-scan", "vuln-scan", "doc-validate"]
inputs = ["reconcile.findings", "synthesize-findings.findings", "implement.change-summary", "issue.latest.change-summary", "issue.latest.ac-report", "verify-ac-vote.vote-record"]
loop = true
name = "fix"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["reconcile"]
emits = "ac-report"
executor = "verify-ac"
expected_cost = 0.50
gates = [{ name = "ac-commands", pre = true }]
holds_tree = false
inputs = ["issue.body", "issue.diff", "implement.change-summary", "verify-ac.gate-results"]
name = "verify-ac"
packet = ["contracts/{executor}.md"]
payload = "ac-report@2"
threshold = { "fix-loop" = "any(status == unmet)", "verify-ac-vote" = "any(status != met)" }

[[step]]
after = ["verify-ac"]
inputs = ["verify-ac.ac-report", "issue.body", "issue.diff"]
name = "verify-ac-vote"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-correctness"]
