# security-load-bearing — label-matched variant of standard-change (05 §2).
# Deltas from the baseline, per 05 §2:
#   - prepends `threat-model` (before implement; its artifact feeds the
#     implement brief)
#   - review fanout adds `judge-security`
#   - adds gates `vuln-scan` (govulncheck), stricter `secret-scan`, and
#     `sdet-abuse` (Q4 closure — named abuse cases from the threat model
#     actually executed; 05 §3)
#   - threshold: medium security findings => fix-loop; a payload carrying high+
#     findings and no mediums requires a VOTE GATE (05 §4) instead of silent
#     acceptance. The two predicates are disjoint by construction — see the
#     reconcile step's comment for why they have to be.
#   - (was: commit gate requires the vote reference — the commit tail is
#     removed, see the note at the end of this file; the vote outcome reaches
#     the operator through the reconciled payload and the run report, and the
#     operator's own manual commit is the acceptance act)
# The vote gate is interposed by routing a threshold to a STEP NAME, which is
# exactly 06 §11.2's interposition rule: "the reference instance's security
# workflow interposes its vote gate this way — upstream 05 §2".
# `secret-scan` is stricter here as a TRUST-ENTRY property (argv/timeout/flake
# live in trust.toml, 06 §4), not a distinct pipeline-visible name: the pipeline
# references gate names only (05 §3).

[pipeline]
name    = "security-load-bearing"
version = 9   # 9: reconcile aggregates severity by `max` instead of
              #   `median` — a lower median demotes the mixed clusters that
              #   most need attention (retro 2026-08-19); and reconcile's
              #   payload moves to findings@3, whose `prior_disposition`
              #   carries an earlier round's ruling forward so a settled
              #   cluster is not decided twice
              # 8: verify's unverifiable park routes through an interposed
              #   tribunal vote first (operator policy, 2026-08-16) — the
              #   panel escalates only what it will not pass
              # 7: medium auto fix-loop retired (2026-08-10)
description = "Security-track change: threat model first, security judge, abuse-case gate, vote-gated acceptance."

[match]                      # exactly-one-match (06 §11.1): security is the highest-
                             #   precedence CODE pipeline, but the doc/meta pipelines
                             #   are different work and still outrank it
                             # NO `kind` CLAUSE (DKT-25): an absent list already
                             #   matches every kind (match.go:48). DKT-22 spelled
                             #   out the whole closed set here, which decided
                             #   nothing and made a sixth kind unroutable in all
                             #   nine workflows at once. The label terms below are
                             #   what actually discriminate.
labels_any  = ["security-load-bearing"]
unless_labels = [
  "docs-only", "investigation",
  "spec-doc", "spec-project", "release", "retro",
]




[limits]                     # per-class bounds (DKT-16). `max_step_duration` is a
                             #   SCHEDULE-TO-CLOSE bound measured from the claim,
                             #   independent of heartbeats — a runaway holder cannot
                             #   renew past it (02 §11.1, enforced in
                             #   Scheduler.Expired). Without it the lease TTL is the
                             #   only clock, so a dead executor's step sits claimed
                             #   for the full TTL with nothing shorter-circuiting it.
                             #   The values are RUNAWAY CEILINGS, not budgets, and
                             #   they sit well above observed behaviour: RUN-1's
                             #   entire run was 161.5m of wall clock, its
                             #   claim-to-record `write` peak was 20.1m (fix@1)
                             #   against a 10.8m average, and every read class
                             #   finished inside 12.0m — so 2h/1h bound a dead or
                             #   runaway holder without constraining a real step.
                             # `max` is required by V24 and is CONCURRENCY, a
                             #   separate question from duration. `write` = 1 is the
                             #   writer serialization the spec's reference instance
                             #   specifies (02 §11.1); read classes take 4, the
                             #   fanout width these pipelines actually declare, so
                             #   the bound records existing behaviour rather than
                             #   newly throttling anything.
"judge-architecture"  = { max = 4, max_step_duration = "1h" }
"judge-correctness"   = { max = 4, max_step_duration = "1h" }
"judge-security"      = { max = 4, max_step_duration = "1h" }
"judge-simplicity"    = { max = 4, max_step_duration = "1h" }
"judge-testing"       = { max = 4, max_step_duration = "1h" }
"synthesize-findings" = { max = 4, max_step_duration = "1h" }
"threat-model"        = { max = 4, max_step_duration = "1h" }
"verify-ac"           = { max = 4, max_step_duration = "1h" }
"write"               = { max = 1, max_step_duration = "2h" }

[[step]]
name = "threat-model"
holds_tree = false            # reads the tree, never writes it: exempt from scope
                             #   exclusion so this step coexists with other issues'
                             #   steps instead of serialising against them
after = []                           # root: the threat model precedes implement
executor = "threat-model"
emits = "threat-model"
packet = ["contracts/{executor}.md"]
expected_cost = 0.80
inputs = ["issue.body"]

[[step]]
name = "implement"
after = ["threat-model"]
executor = "implement"
class = "write"
emits = "change-summary"
packet = ["contracts/{executor}.md"]
expected_cost = 1.50
inputs = ["threat-model.threat-model", "issue.body"]   # the threat model feeds
                                     #   the implement brief (05 §2)
gates = ["build", "tests", "self-hygiene", "secret-scan", "vuln-scan", "sdet-abuse"]
                                     # `scope` removed: gates get no issue
                                     #   identity, so scope containment is
                                     #   un-mechanized (DKT-66)
max_attempts = 2
on_fail = "waiting-human"

[[step]]
name = "review"
holds_tree = false            # reads the tree, never writes it: exempt from scope
                             #   exclusion so this step coexists with other issues'
                             #   steps instead of serialising against them
after = ["implement"]
fanout = ["judge-correctness", "judge-architecture", "judge-simplicity", "judge-testing", "judge-security"]
emits = "findings"
packet = ["contracts/{executor}.md"]
payload = "findings@1"               # judge-boundary validation, per-judge failure
                                     #   attribution (see standard-change's note);
                                     #   deliberately absent on `synthesize`
expected_cost = 0.60                 # per expanded sibling
inputs = ["implement.change-summary", "threat-model.threat-model", "issue.diff"]

[[step]]
name = "synthesize"
holds_tree = false            # reads the tree, never writes it: exempt from scope
                             #   exclusion so this step coexists with other issues'
                             #   steps instead of serialising against them
after = ["review"]
executor = "synthesize-findings"
emits = "findings"
packet = ["contracts/{executor}.md"]
expected_cost = 0.40
inputs = ["review.*"]

[[step]]
name = "reconcile"
after = ["synthesize"]
action = "aggregate"
params = { field = "severity", method = "max", hold_spread = 2, output = "findings" }
                                     # MAX, NOT MEDIAN (retro 2026-08-19): the
                                     #   top of the declared order is the bad
                                     #   end, so a lower median demotes the
                                     #   cluster that most needs attention, and
                                     #   silently. Measured on the general
                                     #   track, which shares this aggregate:
                                     #   RUN-2's [low, medium] -> low, RUN-3's
                                     #   [high, info] -> info (10.9-minute hold,
                                     #   operator-corrected to high), and both
                                     #   of RUN-20's exact low/high ties -> low,
                                     #   both corrected to high. `max` never
                                     #   demotes. Sharper here than anywhere:
                                     #   this file's routing turns on `>= high`,
                                     #   so a demotion is the difference between
                                     #   the security vote firing and not.
                                     #   `hold_spread` is unchanged.
inputs = ["synthesize.findings"]
payload = "findings@3"               # findings@1's successor: same declared
                                     #   severity order, plus the optional
                                     #   `prior_disposition` (retro
                                     #   2026-08-19). The `review` step above
                                     #   stays on findings@1 — judges emit no
                                     #   disposition, so nothing there needs
                                     #   the successor.
threshold = { "security-vote" = "any(severity >= high)" }   # AUTO FIX-LOOP RETIRED for the
                                     #   security track (2026-08-10): Medium
                                     #   findings are recorded, never looped;
                                     #   high+ still routes to the HUMAN vote,
                                     #   which converges by decision. Same
                                     #   rationale as standard-change.toml.
                                     # `fix-loop` is evaluated BEFORE any
                                     #   interposed step routing regardless of
                                     #   declaration order (ThresholdOrder,
                                     #   internal/engine/threshold.go) — so the
                                     #   two predicates must be DISJOINT or the
                                     #   vote gate is unreachable. RUN-2
                                     #   recorded zero votes for exactly this
                                     #   reason. The §11.2 grammar has no
                                     #   compound predicates, so `==` is the
                                     #   disjoint form: payloads with mediums
                                     #   loop, and the vote fires when a payload
                                     #   carries highs and no mediums. A payload
                                     #   with both mediums and highs loops first
                                     #   — fix the fixable, vote when only highs
                                     #   remain.
max_fix_loops = 2

[[step]]
name = "fix"
executor = "fix"
class = "write"
emits = "change-summary"
packet = ["contracts/{executor}.md"]
expected_cost = 1.00
loop = true
inputs = ["reconcile.findings", "implement.change-summary", "threat-model.threat-model"]
gates = ["build", "tests", "secret-scan", "vuln-scan"]
after_loop = "review"

[[step]]                     # reached ONLY by reconcile's threshold routing
name = "security-vote"
after = ["reconcile"]                # names the predecessor V8 requires; the step
                                     #   stays otherwise-unreached — interposition
                                     #   is what makes it ready (06 §11.2)
type = "vote"                        # 05 §4: waivers and security acceptance are
                                     #   where per-voter accountability is the point
voters = ["judge-security", "judge-architecture", "judge-correctness"]
vote_rule = "security-acceptance"
on_fail = "fix-loop"                 # a refused waiver is rework, not a park
inputs = ["reconcile.findings"]

[[step]]
name = "verify"
holds_tree = false            # reads the tree, never writes it: exempt from scope
                             #   exclusion so this step coexists with other issues'
                             #   steps instead of serialising against them
after = ["reconcile"]
executor = "verify-ac"
emits = "ac-report"
packet = ["contracts/{executor}.md"]
payload = "ac-report@1"
expected_cost = 0.50
gates = [{ name = "ac-commands", pre = true }]
inputs = ["issue.body", "issue.diff", "implement.change-summary"]
threshold = { "fix-loop" = "any(status == unmet)", "verify-tribunal" = "any(status == unverifiable)" }
                                     # TRIBUNAL-FILTERED ESCALATION (operator
                                     #   policy, 2026-08-16): an unverifiable AC
                                     #   used to park straight to the operator;
                                     #   it now routes to the interposed vote
                                     #   step below. `fix-loop` is evaluated
                                     #   BEFORE any interposed step routing
                                     #   (ThresholdOrder), so a report carrying
                                     #   both unmet and unverifiable rows loops
                                     #   first — fix the fixable, judge what
                                     #   remains. Distinct from `security-vote`,
                                     #   which is 05 §4's own waiver panel over
                                     #   FINDINGS; this seat judges the
                                     #   AC-REPORT in the operator's stead.

[[step]]                     # reached ONLY by verify's threshold routing
name = "verify-tribunal"
after = ["verify"]                   # names the predecessor V8 requires; the step
                                     #   stays otherwise-unreached — interposition
                                     #   is what makes it ready (06 §11.2)
type = "vote"                        # TRIBUNAL (operator policy, 2026-08-16):
                                     #   the panel reads the ac-report FIRST and
                                     #   escalates only what it will not pass.
voters = ["tribunal-architecture", "tribunal-security", "tribunal-correctness"]
vote_rule = "tribunal"               # registered engine-side (see
                                     #   investigation.toml's note on V26)
on_fail = "waiting-human"            # any non-approval escalates to the human
inputs = ["verify.ac-report", "issue.body"]

# COMMIT TAIL REMOVED (operator decision, 2026-08-09): commit-gate, commit, and
# commit-exec are gone from every pipeline — automated commits are incompatible
# with the harness security model (interactive 1Password commit-signing
# authorization is unavailable to headless executors and engine actions;
# `commit-msg` 0 pass / 1 fail across RUN-1/2/5, all override-passed; DKT-13/
# DKT-61). Full rationale in standard-change.toml's matching note. The threat-
# model / judge-security / sdet-abuse / vote-gated path above is unchanged:
# `security-vote` remains the acceptance gate and `verify` the terminal engine
# step. The vote reference the removed commit-gate carried rides in the
# reconciled payload and the run report; the operator reads it there before
# committing by hand.
