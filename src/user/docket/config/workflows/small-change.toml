[pipeline]
description = "Small ordinary change, bound by the `small` label: implement with the full gate list, one correctness judge routing a blocker straight to the fix loop, AC verification with a single-seat tribunal on an unverifiable AC, and a bounded fix loop re-entering at review; the conductor integrates commits, the operator publishes."
name = "small-change"
version = 1  # 1: the light track for an ordinary change that a person, the groomer
             #   or the planner labelled `small`. Same implement step and gate list
             #   as standard-change; one correctness judge instead of three; no
             #   synthesize, reconcile or drain step, because those exist to cluster
             #   several judges' findings and one judge's payload routes on its own
             #   severity field, exactly as docs-only's review does. Measured on one
             #   147-issue run on this machine, where 35 issues bound standard-change
             #   and 27 finished: a change of 20 lines or fewer spent a median 38
             #   seat-minutes over 7 executor seats plus 3 tribunal seats and took a
             #   median 22.7 hours from first claim to done, no faster than a
             #   21-100-line change (23.5 h) or one over 400 lines (17.2 h), because
             #   every chain crossed three dispatches (implement; the three judges and
             #   synthesize; drain, verify and the tribunal) and the waits at those
             #   boundaries were about two thirds of the elapsed time. docs-only,
             #   which has this track's shape, finished its 21-100-line changes on the
             #   same run in a median 8.4 hours over two dispatches, with 3 executor
             #   seats and 24 seat-minutes. The correctness seat stays because across
             #   187 reconciled rounds corpus-wide it was the sole finder of 11
             #   blocker clusters against architecture's 3 and testing's 3, and across
             #   the 225 distinct standard-change issues in every project's ledger the
             #   three-judge panel routed a blocker fix round on 7 of 64 changes of 20
             #   lines or fewer and 12 of 92 of 21-100 lines, so review at this size is
             #   not dead weight. What this track gives up, stated plainly: the
             #   testing and architecture seats' high findings (on that run, 11 of the
             #   18 high findings on changes up to 100 lines were the testing seat's,
             #   and every high at that size was drained to the backlog rather than
             #   fixed in the run) and the drain path itself; a high this judge reports
             #   stays in the review artifact for the operator at publish, as on
             #   docs-only. A blocker routes to the fixer directly rather than through a
             #   tribunal: a wrong single-seat blocker costs one fix round (median 16
             #   minutes on that run) where a tribunal seat costs about as much and a
             #   further dispatch boundary. The loop cannot re-fire on settled ground:
             #   a judge's payload carries only unresolved prior findings and records
             #   closures in the body, the 15 re-review payloads on that run carried a
             #   blocker only where the defect was still open, and corpus-wide the
             #   single-executor threshold steps at ordinal 1 and later routed pass 23
             #   times and fix-loop once (ui-change's design-qa, which routes a
             #   blocker to the fixer directly, is the precedent for this edge). The
             #   label is applied before activation
             #   because a step's `when` and a workflow's `[match]` read issue kind and
             #   labels only, never the diff.

[match]
labels_any = ["small"]
unless_labels = [
  "blocked",
  "disposition",
  "docs-only",
  "investigation",
  "release",
  "retro",
  "security",
  "security-change",
  "security-load-bearing",
  "spec-doc",
  "spec-project",
  "ui",
]

[limits]
"judge-correctness" = { max = 16, max_step_duration = "1h" }
"verify-ac" = { max = 16, max_step_duration = "1h" }
"write" = { max = 16, max_step_duration = "2h" }

[[step]]
after = []
class = "write"
emits = "change-summary"
executor = "implement"
expected_cost = 1.50
gates = ["build", "tests", "self-hygiene", "secret-scan", "vuln-scan", "doc-validate"]
inputs = ["issue.body"]
max_attempts = 2
name = "implement"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["implement"]
emits = "findings"
executor = "judge-correctness"
expected_cost = 0.60
holds_tree = false
inputs = ["implement.change-summary", "issue.diff"]
max_fix_loops = 2
name = "review"
packet = ["contracts/{executor}.md"]
payload = "findings@9"
threshold = { "fix-loop" = "any(severity >= blocker)" }

[[step]]
after_loop = "review"
class = "write"
emits = "change-summary"
executor = "fix"
expected_cost = 1.00
gates = ["build", "tests", "self-hygiene", "secret-scan", "vuln-scan", "doc-validate"]
inputs = ["review.findings", "implement.change-summary", "issue.latest.change-summary", "issue.latest.ac-report", "verify-tribunal.vote-record"]
loop = true
name = "fix"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["review"]
emits = "ac-report"
executor = "verify-ac"
expected_cost = 0.50
gates = [{ name = "ac-commands", pre = true }]
holds_tree = false
inputs = ["issue.body", "issue.diff", "implement.change-summary", "verify.gate-results"]
name = "verify"
packet = ["contracts/{executor}.md"]
payload = "ac-report@1"
threshold = { "fix-loop" = "any(status == unmet)", "verify-tribunal" = "any(status == unverifiable)" }

[[step]]
after = ["verify"]
inputs = ["verify.ac-report", "issue.body", "issue.diff"]
name = "verify-tribunal"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-correctness"]
