# docs-only — kind/label-matched, scope = docs/** (05 §2).
# Per 05 §2: "implement -> single `judge-correctness` review -> verify; gates:
# `doc-validate` (per doc type), `citation-check`. No fix-loop (attempts
# suffice), no commit vote."
# Consequences of "no fix-loop", read against the engine:
#   - there is no `fix` step and no `after_loop` anywhere in this file;
#   - no threshold may route "fix-loop" (there would be no loop body to enter),
#     so the review outcome routes `waiting-human` instead — the operator reads
#     the findings. `max_fix_loops` is therefore absent too.
#   - the single-judge review is an ordinary executor step, not a `fanout`: a
#     one-hint fanout would register (V15 only refuses an EMPTY fanout) but would
#     model a join over one sibling that 05 §2 does not ask for.
# `synthesize`/`reconcile` are absent: clustering across judges is meaningless
# with one judge, and `aggregate` over a single input computes nothing new.
# Scope (`docs/**`) is issue data, not a pipeline field (02 §5). No gate
# enforces it: gates receive no issue identity (DKT-66), so scope containment
# is un-mechanized — an action-shaped gap, not a gate-shaped one.

[pipeline]
name    = "docs-only"
version = 7   # 7: verify step declares verify.gate-results so its own
              #   ac-commands pre-gate row resolves at claim (DOT-13,
              #   engine fix 7a2cbff)
              # 6: description + commit-tail note updated to the
              #   conductor-integrates model (2026-08-10)
description = "Documentation change: one correctness judge, doc-validate and citation gates, no fix-loop; the conductor integrates commits, the operator publishes."

[match]                      # no `docs` kind exists (closed set, see spec-doc's
                             #   note); `docs-only` is the label 05 §2 names anyway
                             # Precedence (exactly-one-match, 06 §11.1): the nine
                             #   [match] clauses form a total order, each excluding
                             #   every label that binds above it —
                             #   retro > release > spec-project > spec-doc >
                             #   investigation > docs-only > security > ui >
                             #   standard-change.
                             # `kind` carries all five closed-set kinds (DKT-22):
                             #   `epic` included so an epic carrying this label
                             #   routes here like any other kind — see the parallel
                             #   note on `standard-change`, the workflow that
                             #   catches an unlabeled epic.
labels_any  = ["docs-only"]
unless_labels = ["investigation", "spec-doc", "spec-project", "release", "retro"]




[limits]                     # per-class bounds (DKT-16). `max_step_duration` is a
                             #   SCHEDULE-TO-CLOSE bound measured from the claim,
                             #   independent of heartbeats — a runaway holder cannot
                             #   renew past it (02 §11.1, enforced in
                             #   Scheduler.Expired). Without it the lease TTL is the
                             #   only clock, so a dead executor's step sits claimed
                             #   for the full TTL with nothing shorter-circuiting it.
                             #   Durations are derived from RUN-1's measured steps,
                             #   not guessed: `write` peaked at 735m (the runaway
                             #   this bounds) against a 104m average, and every read
                             #   class finished inside 13m.
                             # `max` is required by V24 and is CONCURRENCY, a
                             #   separate question from duration. `write` = 1 is the
                             #   writer serialization the spec's reference instance
                             #   specifies (02 §11.1); read classes take 4, the
                             #   fanout width these pipelines actually declare, so
                             #   the bound records existing behaviour rather than
                             #   newly throttling anything.
"judge-correctness" = { max = 4, max_step_duration = "1h" }
"verify-ac"         = { max = 4, max_step_duration = "1h" }
"write"             = { max = 1, max_step_duration = "2h" }

[[step]]
name = "implement"
after = []
executor = "implement"
class = "write"
emits = "change-summary"
packet = ["contracts/{executor}.md"]
expected_cost = 0.80
inputs = ["issue.body"]
gates = ["build", "self-hygiene", "doc-validate", "citation-check"]
                                     # `scope` removed: gates get no issue
                                     #   identity, so scope containment is
                                     #   un-mechanized (DKT-66)
                                     # `doc-validate` is 05 §3's per-type gate:
                                     #   doc_validate.py per type. Per-type
                                     #   checks are its parameters, not sibling
                                     #   gate names (see the fold decisions).
max_attempts = 2
on_fail = "waiting-human"            # attempts suffice (05 §2); nothing loops

[[step]]
name = "review"
holds_tree = false            # reads the tree, never writes it: exempt from scope
                             #   exclusion so this step coexists with other issues'
                             #   steps instead of serialising against them
after = ["implement"]
executor = "judge-correctness"       # the single judge 05 §2 specifies
emits = "findings"
packet = ["contracts/{executor}.md"]
payload = "findings@1"
expected_cost = 0.60
inputs = ["implement.change-summary", "issue.diff"]
threshold = { "waiting-human" = "any(severity >= high)" }
                                     # no fix-loop exists to route to; a high+
                                     #   finding parks for the operator instead

[[step]]
name = "verify"
holds_tree = false            # reads the tree, never writes it: exempt from scope
                             #   exclusion so this step coexists with other issues'
                             #   steps instead of serialising against them
after = ["review"]
executor = "verify-ac"
emits = "ac-report"
packet = ["contracts/{executor}.md"]
payload = "ac-report@1"
expected_cost = 0.40
gates = [{ name = "ac-commands", pre = true }]
inputs = ["issue.body", "issue.diff", "implement.change-summary", "verify.gate-results"]
threshold = { "waiting-human" = "any(status == unmet)" }
                                     # unmet parks rather than looping; the
                                     #   `unverifiable` clause collapses into the
                                     #   same routing, so it is not restated

# COMMIT TAIL REMOVED (operator decision, 2026-08-09): commit-gate, commit, and
# commit-exec are gone from every pipeline — automated commits are incompatible
# with the harness security model (interactive 1Password commit-signing
# authorization is unavailable to headless executors and engine actions;
# `commit-msg` 0 pass / 1 fail across RUN-1/2/5, all override-passed; DKT-13/
# DKT-61). Full rationale in standard-change.toml's matching note. Since 2026-08-10 the
# conductor integrates each write sha as a real unsigned commit; only
# publishing stays the operator's. `verify` is the terminal engine step, and
# its `waiting-human` threshold on unmet ACs remains the pipeline's park point.
