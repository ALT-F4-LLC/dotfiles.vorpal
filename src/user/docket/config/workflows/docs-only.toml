[pipeline]
description = "Documentation change: implement with doc-validate and citation gates, one correctness judge, tribunal-filtered review and AC verification, and a bounded fix-loop re-entering at review; the conductor integrates commits, the operator publishes. Design-heavy doc work routes through spec-doc first."
name = "docs-only"
version = 20  # 20: `blocked` joins unless_labels (DOT-1788): a hold label so
              #   an issue not yet workable matches zero registered workflows
              #   until the label is removed.
              # 19: two input edits, no topology change. (1) `fix` adds
              #   `issue.latest.change-summary` beside
              #   `implement.change-summary`: the engine never rebinds a loop
              #   body's own inputs, so at fix@2 and later the packet carried
              #   implement@0's account and omitted fix@(N-1)'s, the tree the
              #   fixer actually stands on (three fix@2 packets in one run on
              #   a sibling track all bound to implement@0).
              #   `issue.latest.<kind>` is the engine's named form for exactly
              #   this; at fix@1 both entries resolve to implement@0 and the
              #   bundle de-duplicates them. The sibling tracks also fed their
              #   fixers the synthesize clusters for member evidence; this
              #   track has one judge and no synthesize step, and its
              #   `review.findings` already carries that judge's evidence, so
              #   nothing to add. (2) `issue.diff` joins `verify-tribunal`, as
              #   `review-tribunal` already has it: without it context assembly
              #   lifts no target_sha, wave.js seats the panel with "NO target
              #   ref — seats read their own HEAD", and seats re-derive the
              #   judged tree from the ac-report's prose. With it the bundle
              #   and the packet header carry target_sha/target_worktree; the
              #   wave's own log line still needs `step show` to surface the
              #   field, an engine change tracked separately.

[match]
labels_any = ["docs-only"]
unless_labels = ["blocked", "investigation", "spec-doc", "spec-project", "release", "retro"]

[limits]
"judge-correctness" = { max = 16, max_step_duration = "1h" }
"verify-ac" = { max = 16, max_step_duration = "1h" }
"write" = { max = 16, max_step_duration = "2h" }

[[step]]
after = []
class = "write"
emits = "change-summary"
executor = "implement"
expected_cost = 0.80
gates = ["self-hygiene", "doc-validate", "citation-check"]
inputs = ["issue.body"]
max_attempts = 2
name = "implement"
on_fail = "waiting-human"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["implement"]
emits = "findings"
executor = "judge-correctness"
expected_cost = 0.60
holds_tree = false
inputs = ["implement.change-summary", "issue.diff"]
name = "review"
packet = ["contracts/{executor}.md"]
payload = "findings@9"
threshold = { "review-tribunal" = "any(severity >= blocker)" }

[[step]]
after = ["review"]
inputs = ["review.findings", "issue.diff"]
name = "review-tribunal"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-correctness"]

[[step]]
after_loop = "review"
class = "write"
emits = "change-summary"
executor = "fix"
expected_cost = 0.60
gates = ["self-hygiene", "doc-validate", "citation-check"]
inputs = ["review.findings", "implement.change-summary", "issue.latest.change-summary", "issue.latest.ac-report", "review-tribunal.vote-record", "verify-tribunal.vote-record"]
loop = true
name = "fix"
packet = ["contracts/{executor}.md"]

[[step]]
after = ["review"]
emits = "ac-report"
executor = "verify-ac"
expected_cost = 0.40
gates = [{ name = "ac-commands", pre = true }]
holds_tree = false
inputs = ["issue.body", "issue.diff", "implement.change-summary", "verify.gate-results"]
max_fix_loops = 2
name = "verify"
packet = ["contracts/{executor}.md"]
payload = "ac-report@1"
threshold = { "fix-loop" = "any(status == unmet)", "verify-tribunal" = "any(status == unverifiable)" }

[[step]]
after = ["verify"]
inputs = ["verify.ac-report", "issue.body", "issue.diff"]
name = "verify-tribunal"
on_fail = "fix-loop"
type = "vote"
vote_rule = "tribunal"
voters = ["tribunal-architecture", "tribunal-security", "tribunal-correctness"]
