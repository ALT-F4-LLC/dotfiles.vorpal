# standard-change — the baseline pipeline (05 §1).
# Ported from 05 §1's TOML, which is the design authority for this file.
# Engine-supplied semantics are never restated per pipeline: readiness, leases,
# attempts, artifact recording, context assembly, event logging (02 §5, §8).
# A pipeline author writes topology and thresholds only (05 §1).
# `issue.diff` is the engine-provided virtual artifact — referenced, never emitted.
# Requires `findings@2` AND `findings@4` registered first: the review fanout
# declares findings@2 (judge-boundary anchor keys required — retro after RUN-5;
# 7 judge-architecture findings keyed location/rule were silently dropped
# downstream, see DKT-79), while `reconcile` takes findings@4 — findings@3's
# re-registration (DKT-317 follow-up: the engine enforces byte-identity on a
# frozen registration, so findings@3's `prior_disposition` wording fix moved
# to a fresh schema instead of editing findings@3 in place) — carrying the
# same declared severity order the ordered severity threshold compiles from
# (06 §11.2, V21c/V29) plus the optional `prior_disposition` that makes a
# previously-ruled cluster recognisable as one. The split is deliberate:
# `aggregate` carries through only input keys, so a schema requiring `id` on
# the reconcile document trips V30 — which is why findings@3/@4 inherit
# findings@1's optional `id` rather than findings@2's required one.

[pipeline]
name    = "standard-change"
version = 14                 # 14: reconcile's payload moves from findings@3
                             #   to findings@4 — the engine enforces
                             #   byte-identity on a frozen registration, and
                             #   findings@3's `prior_disposition` description
                             #   text was edited in place post-registration
                             #   (DKT-317 follow-up) without a version bump;
                             #   findings@4 carries the corrected text under
                             #   a fresh registration.
                             # 13: a rejected `verify-tribunal` routes
                             #   `fix-loop` instead of parking at
                             #   `waiting-human` (operator ruling 2026-08-19,
                             #   DOT-277) — see that step's comment for the
                             #   bound that keeps the park as the floor.
                             # 12: reconcile aggregates severity by `max`
                             #   instead of `median` — a lower median demotes
                             #   the mixed clusters that most need attention
                             #   (retro 2026-08-19); and reconcile's payload
                             #   moves to findings@3, whose
                             #   `prior_disposition` carries an earlier
                             #   round's ruling forward so a settled cluster
                             #   is not decided twice; and a when-gated
                             #   `review-security` sibling seats the security
                             #   judge on `security`-labelled issues.
                             # 11: verify's unverifiable park routes through an
                             #   interposed tribunal vote first (operator
                             #   policy, 2026-08-16) — the panel reads the
                             #   ac-report and escalates only what it will not
                             #   pass; the operator hears only escalations.
                             # 10: verify step declares verify.gate-results so
                             #   its own ac-commands pre-gate row resolves at
                             #   claim (DOT-13, engine fix 7a2cbff).
                             # 9: implement split into when-gated siblings
                             #   (implement / implement-test-infra), each a
                             #   concrete executor; the label-keyed [[resolve]]
                             #   table is retired (DKT-70 decision (d),
                             #   2026-08-13).
                             # 8: write concurrency 1 -> 20 (operator directive,
                             #   2026-08-10): per-executor worktrees isolate
                             #   writers, so class-wide serialization guards
                             #   nothing; the conflicting-cherry-pick
                             #   stop-and-ask gate at integration backstops
                             #   scope overlap. (7: fix-loop threshold high ->
                             #   blocker, operator convergence policy,
                             #   2026-08-10 — see the threshold comment — plus
                             #   description update to the conductor-integrates
                             #   model. 6: @5 was frozen and a comment edit
                             #   forced the bump.)
description = "Implement, review, reconcile, and verify one ordinary change; the conductor integrates commits, the operator publishes."

[match]                      # binding rule, evaluated at run activation (02 §1.2)
                             # EXACTLY ONE workflow may match an issue (06 §11.1), so
                             # this baseline must exclude every label that binds a
                             # variant. 05 §1's four exclusions cover the four
                             # variants that existed as labels in its own prose; the
                             # remaining four bind on labels only because Docket's
                             # issue kinds are a closed set (see the variants' [match]
                             # notes), so they are excluded here too. DKT filed.
                             # NO `kind` CLAUSE (DKT-25): an absent list already
                             #   matches every kind (match.go:48). DKT-22 spelled
                             #   out the whole closed set here, which decided
                             #   nothing and made a sixth kind unroutable in all
                             #   nine workflows at once. The label terms below are
                             #   what actually discriminate.
unless_labels = [
  "security-load-bearing", "ui", "docs-only", "investigation",
  "spec-doc", "spec-project", "release", "retro",
]




[limits]                     # per-class bounds (DKT-16). `max_step_duration` is a
                             #   SCHEDULE-TO-CLOSE bound measured from the claim,
                             #   independent of heartbeats — a runaway holder cannot
                             #   renew past it (02 §11.1, enforced in
                             #   Scheduler.Expired). Without it the lease TTL is the
                             #   only clock, so a dead executor's step sits claimed
                             #   for the full TTL with nothing shorter-circuiting it.
                             #   Durations are derived from RUN-1's measured steps,
                             #   not guessed: `write` peaked at 735m (the runaway
                             #   this bounds) against a 104m average, and every read
                             #   class finished inside 13m.
                             # `max` is required by V24 and is CONCURRENCY, a
                             #   separate question from duration. `write` takes 20
                             #   since @8: 02 §11.1's write=1 reference instance
                             #   predates per-executor worktrees, which isolate
                             #   writers; overlap surfaces at integration as a
                             #   conflicting cherry-pick, a stop-and-ask gate.
                             #   Read classes take 4, the fanout width these
                             #   pipelines actually declare.
"judge-architecture"  = { max = 4, max_step_duration = "1h" }
"judge-correctness"   = { max = 4, max_step_duration = "1h" }
"judge-security"      = { max = 4, max_step_duration = "1h" }
"judge-simplicity"    = { max = 4, max_step_duration = "1h" }
"judge-testing"       = { max = 4, max_step_duration = "1h" }
"synthesize-findings" = { max = 4, max_step_duration = "1h" }
"verify-ac"           = { max = 4, max_step_duration = "1h" }
"write"               = { max = 20, max_step_duration = "2h" }

[[step]]
name = "implement"           # the general case; test-infra-labeled issues take
                             #   the when-gated sibling below instead, each
                             #   declaring its CONCRETE executor so the engine
                             #   renders the right contract (packet.go
                             #   substitutes {executor} from the step's own
                             #   declaration; the retired [[resolve]] table
                             #   mis-briefed test-infra work silently —
                             #   m3-harness.md F-W1, DKT-70).
after = []
executor = "implement"
when = "labels != test-infra"
class = "write"
emits = "change-summary"
packet = ["contracts/{executor}.md"]
expected_cost = 1.50
gates = ["build", "tests", "self-hygiene", "secret-scan"]
                                     # `scope` removed: gates get no issue
                                     #   identity, so scope containment is
                                     #   un-mechanized (DKT-66)
max_attempts = 2
on_fail = "waiting-human"

[[step]]
name = "implement-test-infra"
after = []
executor = "test-infra"
when = "labels contains test-infra"
class = "write"
emits = "change-summary"
packet = ["contracts/{executor}.md"]
expected_cost = 1.50
gates = ["build", "tests", "self-hygiene", "secret-scan"]
max_attempts = 2
on_fail = "waiting-human"

[[step]]
name = "review"
holds_tree = false            # reads the tree, never writes it: exempt from scope
                             #   exclusion so this step coexists with other issues'
                             #   steps instead of serialising against them
after = ["implement", "implement-test-infra"]
                             # joins over whichever implement variant ran; the
                             #   `skipped` sibling is terminal, and a join waits
                             #   for terminal siblings (06 §2)
fanout = ["judge-correctness", "judge-architecture", "judge-simplicity", "judge-testing"]
emits = "findings"
packet = ["contracts/{executor}.md"]
payload = "findings@2"               # validates at the JUDGE boundary: each judge
                                     #   emits a scalar `severity`, so a malformed
                                     #   payload fails its own sibling's `complete`
                                     #   with per-judge attribution, rather than
                                     #   surfacing later as a reconcile-time error.
                                     #   NOT declared on `synthesize`: that step's
                                     #   multi-member clusters carry member
                                     #   severities IN the `severity` field as an
                                     #   array (engine `clusterMembers`), which this
                                     #   schema's property-level enum would refuse
expected_cost = 0.60                 # per expanded sibling
inputs = ["implement.change-summary", "implement-test-infra.change-summary", "issue.diff"]
                                     # Fix-loop re-entries REBIND: the engine
                                     #   re-renders loop inputs from the loop
                                     #   producer's latest emit (landed
                                     #   engine-side; verified in production,
                                     #   RUN-3), so a re-review round receives
                                     #   fix@N's change-summary, not
                                     #   implement's. The conductor's remaining
                                     #   discipline is only the cheap glance —
                                     #   each judge report's reviewed sha
                                     #   against the step under review (conduct
                                     #   SKILL.md); the hand-the-sha-explicitly
                                     #   workaround this comment used to
                                     #   prescribe is retired. STILL OPEN: a
                                     #   re-review round receives no PREVIOUS
                                     #   round's findings — when the engine's
                                     #   input grammar can bind a prior round's
                                     #   emit, declare it here so judges see
                                     #   what the last round found (docket-side
                                     #   DKT-63 tracks the grammar half).

[[step]]
name = "review-security"     # the security seat this pipeline has never had
                             #   (retro 2026-08-19). Same when-gated shape as
                             #   the implement/implement-test-infra twins: a
                             #   concrete executor plus a label predicate, so
                             #   the engine renders judge-security's own
                             #   contract and the step is terminal-skipped on
                             #   every other issue. ADDITIVE, not a twin of
                             #   `review`: the general fanout runs either way,
                             #   and this only adds the fifth lens where the
                             #   label asks for it.
                             # WHY: RUN-20's credential-exposure cluster —
                             #   plaintext credentials in an un-gitignored
                             #   go:embed corpus, [high, high] — was found by
                             #   judges who each deferred the call "to
                             #   judge-security", a seat this pipeline's
                             #   fanout does not contain, and blocker-only
                             #   convergence then shipped the run with no fix
                             #   round touching it.
                             # KNOWN LIMIT: `fix` re-enters the loop at
                             #   `review` only (after_loop takes one step
                             #   name), so this seat sees round 0 and not the
                             #   re-review rounds. It is a first look, not a
                             #   standing one.
holds_tree = false            # reads the tree, never writes it: exempt from scope
                             #   exclusion so this step coexists with other issues'
                             #   steps instead of serialising against them
after = ["implement", "implement-test-infra"]
                             # same join as `review` over whichever implement
                             #   variant ran
executor = "judge-security"
when = "labels contains security"
                             # mirrors [security].labels, minus
                             #   `security-load-bearing` — this pipeline's
                             #   [match] already excludes that label, and an
                             #   issue carrying it binds the security-load-
                             #   bearing workflow, which seats this judge in
                             #   its standing fanout instead
emits = "findings"
packet = ["contracts/{executor}.md"]
payload = "findings@2"               # judge boundary, same as `review`
expected_cost = 0.60
inputs = ["implement.change-summary", "implement-test-infra.change-summary", "issue.diff"]

[[step]]
name = "synthesize"
holds_tree = false            # reads the tree, never writes it: exempt from scope
                             #   exclusion so this step coexists with other issues'
                             #   steps instead of serialising against them
after = ["review", "review-security"]
                             # a `when`-skipped sibling is terminal, and a join
                             #   waits for terminal siblings (06 §2) — so the
                             #   unlabelled path is unaffected
executor = "synthesize-findings"
emits = "findings"
packet = ["contracts/{executor}.md"]
expected_cost = 0.40
inputs = ["review.*", "review-security.findings"]
                             # `review.*` globs the fanout's siblings within
                             #   step `review`; the security seat is its own
                             #   step and is named explicitly

[[step]]                     # deterministic: an action, no node
name = "reconcile"
after = ["synthesize"]
action = "aggregate"                 # builtin (06 §2); held clusters materialize
params = { field = "severity", method = "max", hold_spread = 2, output = "findings" }
                                     #   a `reconcile-held` human step — the
                                     #   fleet's reconciliation is parameters,
                                     #   not code
                                     # MAX, NOT MEDIAN (retro 2026-08-19): on
                                     #   severity the TOP of the declared order
                                     #   is the bad end, so a lower median
                                     #   demotes exactly the cluster that most
                                     #   needs attention, and it does so
                                     #   silently. Both mixed clusters observed
                                     #   this epoch were demoted: RUN-2's
                                     #   [low, medium] computed low with nobody
                                     #   told, and RUN-3's [high, info]
                                     #   computed info and cost a 10.9-minute
                                     #   hold before the operator hand-
                                     #   corrected it to high. RUN-20's two
                                     #   exact low/high ties both computed low
                                     #   and were both corrected to high.
                                     #   `max` never demotes (the builtin's own
                                     #   note in aggregate.go). `hold_spread`
                                     #   is deliberately unchanged: genuine
                                     #   disagreement still reaches a human,
                                     #   and this only fixes where the
                                     #   undisputed cases land.
inputs = ["synthesize.findings"]     # the clusters the builtin reduces (DKT-28,
                                     #   V31: required non-empty)
payload = "findings@4"               # findings@3's re-registration (DKT-317
                                     #   follow-up: byte-identity on the
                                     #   frozen findings@3 registration
                                     #   forced the wording fix into a fresh
                                     #   schema). severity's declared order
                                     #   (V29), plus `prior_disposition` —
                                     #   findings@1's successor, additive and
                                     #   optional, so a payload that sets it
                                     #   never validates differently (retro
                                     #   2026-08-19)
threshold = { "fix-loop" = "any(severity >= blocker)" }   # no match -> pass (06 §11.2)
                                     # BLOCKER-ONLY LOOPING (operator policy,
                                     #   2026-08-10): `high` findings are
                                     #   recorded, surface in held clusters and
                                     #   at the operator's gates, and land as
                                     #   backlog — they never re-enter the fix
                                     #   loop. Opus-tier judges sustain Concern
                                     #   pressure indefinitely (RUN-1
                                     #   graph-engine: 3 rounds, findings GREW
                                     #   to 30KB on a 5-line change), so a loop
                                     #   keyed on `high` cannot converge; a loop
                                     #   keyed on `blocker` closes when the
                                     #   change is shippable, which is the
                                     #   question the loop exists to answer.
max_fix_loops = 2                    # loops exhausted -> waiting-human (06 §11.3)

[[step]]
name = "fix"
executor = "fix"
class = "write"
emits = "change-summary"
packet = ["contracts/{executor}.md"]
expected_cost = 1.00
loop = true                          # instantiated per fix-loop entry (06 §11.3)
inputs = ["reconcile.findings", "implement.change-summary", "implement-test-infra.change-summary"]
gates = ["build", "tests", "secret-scan"]
after_loop = "review"                # re-review the delta; engine re-enters at review

[[step]]
name = "verify"
holds_tree = false            # reads the tree, never writes it: exempt from scope
                             #   exclusion so this step coexists with other issues'
                             #   steps instead of serialising against them
after = ["reconcile"]
executor = "verify-ac"
emits = "ac-report"
packet = ["contracts/{executor}.md"]
payload = "ac-report@1"              # status is a plain enum: the thresholds below
                                     #   are equality, which needs no declared order
expected_cost = 0.50
gates = [{ name = "ac-commands", pre = true }]   # pre-gate: runs at claim, results
                                     #   land in the context bundle (02 §6)
inputs = ["issue.body", "issue.diff", "implement.change-summary", "implement-test-infra.change-summary", "verify.gate-results"]
threshold = { "fix-loop" = "any(status == unmet)", "verify-tribunal" = "any(status == unverifiable)" }
                                     # TRIBUNAL-FILTERED ESCALATION (operator
                                     #   policy, 2026-08-16): an unverifiable AC
                                     #   used to park straight to the operator;
                                     #   it now routes to the interposed vote
                                     #   step below, which escalates only what
                                     #   it will not pass. `fix-loop` is
                                     #   evaluated BEFORE any interposed step
                                     #   routing regardless of declaration order
                                     #   (ThresholdOrder,
                                     #   internal/engine/threshold.go), so a
                                     #   report carrying both unmet and
                                     #   unverifiable rows loops first — fix the
                                     #   fixable, judge what remains.

[[step]]                     # reached ONLY by verify's threshold routing
name = "verify-tribunal"
after = ["verify"]                   # names the predecessor V8 requires; the step
                                     #   stays otherwise-unreached — interposition
                                     #   is what makes it ready (06 §11.2)
type = "vote"                        # TRIBUNAL (operator policy, 2026-08-16):
                                     #   the panel reads the ac-report FIRST and
                                     #   escalates only what it will not pass —
                                     #   same rationale as investigation's
                                     #   read-gate. The operator's attention is
                                     #   the scarcest resource in the loop.
voters = ["tribunal-architecture", "tribunal-security", "tribunal-correctness"]
vote_rule = "tribunal"               # registered engine-side (see
                                     #   investigation.toml's note on V26)
on_fail = "fix-loop"                 # REJECTED VERIFY-TRIBUNAL IS REWORK, not a
                                     #   park (operator ruling, 2026-08-19,
                                     #   DOT-277). It parked before, and the
                                     #   park was terminal: RUN-26 sat at
                                     #   `waiting-human: rejected` for 30+
                                     #   hours with neither a loop nor an
                                     #   abandon recorded as a choice. A panel
                                     #   that will not pass the ac-report is
                                     #   saying the work is not demonstrably
                                     #   done — the same reading `security-vote`
                                     #   already applies to a refused waiver.
                                     #   The park is the FLOOR, not the first
                                     #   move: `max_fix_loops = 2` bounds the
                                     #   loop and the engine degrades the
                                     #   routing to `waiting-human` on
                                     #   exhaustion (06 §11.3), so an AC that
                                     #   genuinely cannot be verified still
                                     #   reaches the operator, two rework
                                     #   attempts later.
                                     #   KNOWN LIMIT, not fixed here: `fix`
                                     #   does not take `verify.ac-report` as an
                                     #   input, so the loop carries the
                                     #   reconciled findings and not the list of
                                     #   unverifiable ACs. Adding that binding
                                     #   would be unresolvable on the first
                                     #   ordinal, where `fix` can be entered
                                     #   before any `verify` has run, and an
                                     #   unresolvable binding refuses
                                     #   activation.
inputs = ["verify.ac-report", "issue.body"]

# COMMIT TAIL REMOVED (operator decision, 2026-08-09): commit-gate, commit, and
# commit-exec are gone from every pipeline. Automated commits are incompatible
# with the harness security model — commit signing requires interactive
# 1Password authorization no headless executor or engine action can obtain
# (op-ssh-sign "failed to fill whole buffer"; the `commit-msg` gate went 0 pass
# / 1 fail in RUN-1, RUN-2 and RUN-5 alike, every failure cleared only by
# operator override-pass; DKT-13/DKT-61 lineage). Since 2026-08-10 the conductor
# integrates each write sha as a real unsigned commit; publishing stays the
# operator's (contracts/commit-author.md and .docket/bin/git-commit were
# removed with the tail; git history keeps both). `verify` (with its interposed
# `verify-tribunal`, when routed) is the terminal engine step; acceptance is
# the operator's own commit, outside the engine.
