[policy]
version = 31  # 31: comment-only concision rewrite; no routing value changed.
              # 30: comment-only, no routing value changed. Engine commit
              # ffd117a (docket nightly-101) exempts fable-standing
              # rows from the post-walk fable gate, so fable-low's retry now
              # stays on Fable for every row, not only the investigator
              # class; the version 29 deviation note and its per-row echoes
              # are dropped. Also corrects two version 29 comments: opus-low's
              # retry lands above the tier judge-testing and judge-architecture
              # left (opus-medium), and fix's security-labelled walk diverges
              # from the unlabelled one at round 4.
              # 29: lower default effort across the corpus. Reverses policy
              # 27's implement/fix move and goes below it: every row but
              # judge-simplicity now stands at the lowest tier its model
              # supports (three `low` variants added; judge-correctness,
              # tribunal-correctness and verify-ac at opus-medium), on the
              # operator's direction to be bullish on lower effort for
              # wall-clock and more incremental fix-loop rounds over longer
              # individual steps, taken against the measured or documented
              # recommendation where one existed (each such row says so).
              # What the store showed: across all 100 runs no step has ever
              # recorded a failed attempt (`failed_attempts` is 0 on every
              # row, no step-failed event exists), so the on_failure ladder
              # has only ever moved on lease reaps and the retry that actually
              # happens is the fix loop, at a mean 42 lane-minutes per round.
              # docket-retro checks each row's retro number after about five
              # runs on this version. [security] never/ceiling/labels/nodes
              # are byte-identical.
              # 28: fixes a grammar slip in the round-1 fixer comment ("the
              # docket-retro attributes" -> "docket-retro attributes"). No
              # routing value changed.
              # 27: implement and fix move opus-medium -> opus-high. The design
              # search (fragments/design-search.md) puts an architecture
              # decision inside every writer step, and D1 names architecture
              # decisions as where extra investigation pays; D6 has review and
              # verification at high. Round 2 onward already landed on opus-high
              # through the fallback, so the retune removes the cheap first
              # round rather than adding a tier. Escalation for both is now
              # fable-high via opus-high's escalate_to.
              # 26: the [escalation] note now records what the reap-vs-failure
              # measurement found and where the fix belongs (the engine's
              # resolver now sees `prior_attempt_end` on the row but still
              # walks the bare claim count) and rules that `one-hop` stays;
              # the [security] `reason` no longer claims that executor
              # metadata catches a classifier re-run, since the wave records
              # `model_resolved` as unknown unless the runtime supplies an
              # observation. No routing value changed.
              # 25: docket-groom now parents retained issues under epics and
              # can propose creating one, marking it `blocked` so no workflow
              # selects it. That is a permanent use of the hold label, which
              # this file's `blocked` comment did not previously cover.
              # 24: corpus-wide naming-convention pass
              # (src/user/docket/config/README.md) adds two `[executors]` rows,
              # `report` and `revise-investigation`, promoted from borrowing
              # `investigate`'s policy row (investigation.toml renamed their
              # steps to match their own executor identity). Both inherit
              # `investigate`'s current `fable-high` tier absent evidence to
              # retune it. No existing row renamed or retuned.

# `blocked`: the hold label. Apply it to an issue not yet workable — blocked
# on a missing capability, or needing a design session first. It matches zero
# registered workflows, so `docket-plan` cannot select the issue and
# `docket-groom` cannot treat it as run-ready. Every `workflows/*.toml`'s
# `[match].unless_labels` names it. Remove the label only once the blocking
# condition named on the issue is met.
#
# Exception: an epic issue (kind `epic`) carries `blocked` permanently as a
# container marker, since epics have no work of their own for a workflow to
# match. docket-groom never removes `blocked` from an epic.

[variants]
# Policy 29 adds the three `low` variants. opus-low escalates to opus-high,
# the tier every opus row left except judge-testing and judge-architecture
# (left opus-medium; retry lands above it). fable-low escalates to
# fable-medium and stays on Fable for every fable-standing row: since engine
# commit ffd117a (policy 30) the post-walk fable gate exempts rows already
# standing on fable, so the redirect to [escalation.fallback] applies only to
# opus- and sonnet-standing rows that walk onto Fable. sonnet-low escalates to
# sonnet-medium. The older fable variants stay chain tops.
fable-high = { model = "fable", effort = "high" }
fable-low = { model = "fable", effort = "low", escalate_to = "fable-medium" }
fable-max = { model = "fable", effort = "max" }
fable-medium = { model = "fable", effort = "medium" }
fable-xhigh = { model = "fable", effort = "xhigh" }
opus-high = { model = "opus", effort = "high", escalate_to = "fable-high" }
opus-low = { model = "opus", effort = "low", escalate_to = "opus-high" }
opus-medium = { model = "opus", effort = "medium", escalate_to = "fable-medium" }
opus-xhigh  = { model = "opus", effort = "xhigh", escalate_to = "fable-xhigh" }
opus-max = { model = "opus", effort = "max", escalate_to = "fable-max" }
sonnet-high = { model = "sonnet", effort = "high", escalate_to = "opus-high" }
sonnet-low = { model = "sonnet", effort = "low", escalate_to = "sonnet-medium" }
sonnet-max = { model = "sonnet", effort = "max", escalate_to = "opus-max" }
sonnet-medium = { model = "sonnet", effort = "medium", escalate_to = "opus-medium" }
sonnet-xhigh = { model = "sonnet", effort = "xhigh", escalate_to = "opus-xhigh" }

[executors]
# Policy 21 — model/effort re-derived from Anthropic's official documentation
# (fetched 2026-09-02), fit to each seat's role, cost-aware. Cited below as D1-D7:
#   D1 code.claude.com/docs/en/model-config — aliases resolve fable → Fable 5.1,
#      opus → Opus 5, sonnet → Sonnet 5, haiku → Haiku 4.5; effort is
#      low|medium|high|xhigh|max with `high` "The default on every model except
#      Opus 4.7"; `max` "may show diminishing returns and is prone to overthinking.
#      Test before adopting broadly"; Fable: "root-cause investigations, outage
#      debugging, and architecture decisions are where the extra investigation and
#      verification pay off".
#   D2 platform.claude.com/docs/en/build-with-claude/effort — xhigh: "Long-running
#      agentic and coding tasks (over 30 minutes) with token budgets in the
#      millions"; Fable 5.1: "Start with `high`, the default. Step up to `xhigh` or
#      `max` for the most capability-sensitive agentic and coding work, and step down
#      to `medium` or `low` for routine or latency-sensitive work once your evals
#      show quality holds"; Opus 5: "use `low` and `medium` liberally as your primary
#      control for token cost and response time wherever your evals show quality
#      holds"; Sonnet 5 medium: "Comparable to Claude Sonnet 4.6 at high effort";
#      max (Opus 4.7 table): "Reserve for frontier problems".
#   D3 platform.claude.com/docs/en/about-claude/models/overview — "start with
#      Claude Opus 5 for most workloads. Use Claude Fable 5.1 for demanding reasoning
#      and long-horizon agentic work, or when your evals on Claude Opus 5 at higher
#      effort still fall short"; Haiku 4.5 effort: "Not supported" (so no haiku
#      variant here).
#   D4 platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence
#      — SWE-bench Pro: "Claude Opus 5 at its default remains the cheaper way to the
#      top score"; Opus 5 at `low` 84.0% for $0.25 per solved task against Sonnet 5 at
#      default 77.4% for $0.84; "Claude Opus 5 gave up about 2 points at `medium` for
#      half the cost and about 8 points at `low` for a quarter of it"; `low` plus
#      re-running failures at the default gave "the same pass rate for half the
#      cost"; knowledge work: "`medium` matched the default's accuracy at about 70% to
#      87% of its cost, and the default bought nothing measurable over `medium`";
#      DeepResearch Bench II: Fable 5.1 "scored nearly the same at `low`, `medium`,
#      and `high` while the cost per task rose".
#   D5 platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-fable-5-1
#      — "At `medium`, results roughly match Claude Fable 5 at lower cost"; "At `low`,
#      Claude Fable 5.1 is often competitive with Claude Opus and Claude Sonnet models
#      on cost per task while scoring higher, so include it in the comparison wherever
#      you'd otherwise run a smaller model at a higher effort level"; at `low` it
#      "calls search and retrieval tools less often".
#   D6 claude.com/blog/claude-model-and-effort-level-in-claude-code — routine edits
#      and mechanical changes: Sonnet at default; code review and verification:
#      Sonnet→Opus at high; "for most tasks you should use the model's default effort
#      level".
#   D7 code.claude.com/docs/en/model-config#automatic-model-fallback — see [security].
# D4's re-run-failures pattern is what [escalation] already implements: a
# non-gated opus-medium seat that fails hops to fable-medium, misses the fable
# gate, and lands on [escalation.fallback] opus-high — the model's default
# effort. Policy 29 moved every row but judge-simplicity, which keeps its
# prior tier since no decision covered it; every other row's comment states
# its move.
# Seat for the reconcile drain-highs routing — files each still-open
# high cluster as a --gap-file backlog issue. Mechanical selection and faithful
# copying, no judgment over severities; same tier as synthesize-findings.
